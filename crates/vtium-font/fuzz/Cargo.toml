# The PSF loader's and the set reader's fuzz targets, run with cargo-fuzz
# on nightly:
#   cargo +nightly fuzz run psf
#   cargo +nightly fuzz run set
# Its own workspace, so the main workspace and CI do not build it.
[package]
name = "vtium-font-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
vtium-font = { path = "..", features = ["psf", "gzip"] }

[[bin]]
name = "psf"
path = "fuzz_targets/psf.rs"
test = false
doc = false
bench = false

[[bin]]
name = "set"
path = "fuzz_targets/set.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]
