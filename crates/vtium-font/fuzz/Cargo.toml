# The PSF loader's fuzz target, run with cargo-fuzz on nightly:
#   cargo +nightly fuzz run psf
# Its own workspace, so the main workspace and CI do not build it.
[package]
name = "vtium-font-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
vtium-font = { path = ".." }

[[bin]]
name = "psf"
path = "fuzz_targets/psf.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]
