[package]
name = "vtium-font"
description = "Glyph sources: bitmap fonts first, outline fonts behind a feature"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[features]
default = ["unifont", "unscii"]
# the PSF loader, `Psf`: vtium-vitrify reads PSF fonts with it, and the
# console never parses a font file (ADR-1200 D6)
psf = []
# gzip-compressed PSF fonts, as the C reference's zlib option read them
gzip = ["psf"]
# the set writer's deflate: vtium-vitrify enables it, and the console, whose
# writer only rewrites its store raw, does not (ADR-1200 D19); without it
# the writer stores every chunk raw
deflate = []
# the built-in unifont, a vitrified set compiled in, inflated a chunk at a time
unifont = []
# the built-in Unscii-8 set, for cells under 16 pixels high (ADR-1200 D7)
unscii = []

[dependencies]
# inflates a vitrified set's deflated chunks in every build, the built-in
# sets' among them, and gzipped PSF fonts (ADR-1200 D2); deflates the
# chunks a set is written with, with the `deflate` feature
miniz_oxide = "0.8.9"

[dev-dependencies]
# the tests read the PSF fixtures with the features the console leaves out
vtium-font = { path = ".", features = ["psf", "gzip"] }

[build-dependencies]
miniz_oxide = "0.8.9"
