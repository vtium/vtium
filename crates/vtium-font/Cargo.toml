[package]
name = "vtium-font"
description = "Glyph sources: bitmap fonts first, outline fonts behind a feature"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[features]
default = ["gzip", "unifont", "unscii"]
# gzip-compressed PSF fonts, as the C reference's zlib option read them
gzip = []
# the built-in unifont, a vitrified set compiled in, inflated a chunk at a time
unifont = []
# the built-in Unscii-8 set, for cells under 16 pixels high (ADR-1200 D7)
unscii = []

[dependencies]
# inflates a vitrified set's deflated chunks in every build, the built-in
# sets' among them, and gzipped PSF fonts (ADR-1200 D2); deflates the
# chunks a set is written with
miniz_oxide = "0.8.9"
# opens the store's files relative to its directory with O_NOFOLLOW
# (ADR-1200 D3); vtium-platform already links this version
rustix = { version = "=1.1.5", default-features = false, features = ["std", "fs"] }

[build-dependencies]
miniz_oxide = "0.8.9"
