[package]
name = "vtium-settings"
description = "vtium's configuration: the key table, vtium.conf's line syntax and editor, and the head file's reader, parser, evaluator and one writer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
# opens the head file without blocking and without taking a tty as the
# controlling one, as the console opens vtium.conf; vtium links it already
rustix = { version = "=1.1.5", default-features = false, features = ["std", "fs"] }
# The bounds and defaults the key table states: the cell's largest side,
# and the scrollback's sizes. Constants only; both crates are vtium's own,
# and vtium links them already.
vtium-font = { workspace = true, default-features = false }
vtium-term.workspace = true
