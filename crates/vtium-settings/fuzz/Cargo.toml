# The section reader's, the split's, the section writer's and the vtlook
# reader's fuzz targets,
# run with cargo-fuzz on nightly:
#   cargo +nightly fuzz run reading
#   cargo +nightly fuzz run split
#   cargo +nightly fuzz run sections
#   cargo +nightly fuzz run vtlook
# Its own workspace, so the main workspace and CI do not build it.
[package]
name = "vtium-settings-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
vtium-settings = { path = "..", features = ["filters"] }
vtium-render = { path = "../../vtium-render", features = ["filters"] }

[[bin]]
name = "reading"
path = "fuzz_targets/reading.rs"
test = false
doc = false
bench = false

[[bin]]
name = "split"
path = "fuzz_targets/split.rs"
test = false
doc = false
bench = false

[[bin]]
name = "sections"
path = "fuzz_targets/sections.rs"
test = false
doc = false
bench = false

[[bin]]
name = "vtlook"
path = "fuzz_targets/vtlook.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]
