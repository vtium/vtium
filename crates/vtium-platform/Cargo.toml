[package]
name = "vtium-platform"
description = "The console's platform: displays, VTs, seats, input, the pty and the event loop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[features]
# logind through sd-bus from libsystemd or libelogind, which the build
# script finds through pkg-config (ADR-1400's L2 layer): the power keys'
# suspend. Off in the minspec build, which links neither.
logind = ["dep:pkg-config"]
# The image helper's host (ADR-1101): starting `vtium-image` as the
# session's user, its socket, its replies' memory files, the timeout and
# the crash limit. Off in the minspec build, which carries no images.
images = ["dep:vtium-image"]
# The GPU path's platform half (ADR-1303 D7, D8): a GL context on a card's
# render node through GBM and EGL, its safe GL type and the import of a
# display's buffer as a dma-buf. libEGL and libgbm are loaded when a context
# is made, never linked, so a build with it starts on a machine without
# them. Off in the minspec and default builds, which compile none of it.
gpu = ["dep:glow", "dep:khronos-egl", "dep:libloading"]
# The seat through libseat (ADR-1400's L2 layer): the display devices and
# VT switching from the seat manager, seatd or logind, with the seat and
# each device retried from the loop's timers. Off in the minspec and
# default builds, which link no libseat.
libseat = ["dep:libseat"]

[dependencies]
calloop = { version = "0.14.4", features = ["signals"] }
drm-ffi = "=0.9.1"
# kill(2) with a real-time signal and libc's SIGRTMIN, which rustix does
# not send safely; already in the build through xkbcommon and nix.
libc = "=0.2.191"
log = "0.4"
udev = "=0.9.3"
xkbcommon = { version = "=0.9.0", default-features = false }
rustix = { version = "=1.1.5", default-features = false, features = ["std", "fs", "mm", "net", "process", "pty", "runtime", "system", "termios", "thread"] }
# The image helper's wire and reply types, which the helper links too
# (ADR-1101 D7); only with `images`.
vtium-image = { workspace = true, optional = true }
# GL's function table, loaded through eglGetProcAddress; only with `gpu`.
glow = { version = "=0.18.0", default-features = false, optional = true }
# EGL, loaded from libEGL.so.1 at run time through its `dynamic` feature;
# only with `gpu`.
khronos-egl = { version = "=6.0.0", default-features = false, features = ["1_5", "dynamic"], optional = true }
# Opens libgbm.so.1 at run time for the few GBM calls `src/gpu/gbm.rs`
# makes; khronos-egl's `dynamic` feature already builds it. Only with `gpu`.
libloading = { version = "=0.8.9", optional = true }
# libseat, through the libseat-sys binding, which finds the library through
# pkg-config and fails the build naming it when it is missing. Its default
# feature compiles a C file to route libseat's log into the log crate,
# which needs a C compiler for each target; without it libseat writes its
# errors to stderr itself. Only with `libseat`.
libseat = { version = "=0.2.4", default-features = false, optional = true }

[build-dependencies]
# Finds libsystemd or libelogind for the `logind` feature; already in the
# build through libudev-sys.
pkg-config = { version = "=0.3.34", optional = true }

[dev-dependencies]
# The stand-in programs the image helper's tests write and copy, put in
# place so that the kernel never refuses to run one as busy.
vtium-testscript = { path = "../../tools/testscript" }

# One process, one thread: see the file's header.
[[test]]
name = "pty"
harness = false

# The image helper's host against stand-in helpers, which are this test
# binary run again in a role: see the file's header.
[[test]]
name = "image_helper"
harness = false
required-features = ["images"]
