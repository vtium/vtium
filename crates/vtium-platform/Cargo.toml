[package]
name = "vtium-platform"
description = "The console's platform: displays, VTs, seats, input, the pty and the event loop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[features]
# logind through sd-bus from libsystemd (ADR-1400's L2 layer): the power
# keys' suspend. Off in the minspec build, which links no libsystemd.
logind = []

[dependencies]
calloop = { version = "0.14.4", features = ["signals"] }
drm-ffi = "=0.9.1"
# kill(2) with a real-time signal and libc's SIGRTMIN, which rustix does
# not send safely; already in the build through xkbcommon and nix.
libc = "=0.2.191"
log = "0.4"
udev = "=0.9.3"
xkbcommon = { version = "=0.9.0", default-features = false }
rustix = { version = "=1.1.5", default-features = false, features = ["std", "fs", "mm", "process", "pty", "runtime", "system", "termios"] }

# One process, one thread: see the file's header.
[[test]]
name = "pty"
harness = false
