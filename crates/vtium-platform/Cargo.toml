[package]
name = "vtium-platform"
description = "The console's platform: displays, VTs, seats, input, the pty and the event loop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
calloop = { version = "0.14.4", features = ["signals"] }
rustix = { version = "1.1.5", default-features = false, features = ["std", "fs", "process", "pty", "runtime", "termios"] }

# One process, one thread: see the file's header.
[[test]]
name = "pty"
harness = false
