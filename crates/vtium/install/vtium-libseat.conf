# The drop-in that a build with libseat and logind adds to vtium@.service,
# as vtium@.service.d/libseat.conf beside the unit (ADR-1400 D3). make
# install and make install-tree stage it, and the PAM file vtium.pam as
# /etc/pam.d/vtium, only when FEATURES names both. A build with libseat
# alone is for seatd: it opens no PAM session, and its logins run as in the
# default build.
#
# libseat's logind backend takes the seat from the logind session of the
# process that asks for it. So the unit opens a session of vtium's own: with
# PAMName=, systemd runs the PAM stack /etc/pam.d/vtium for vtium, on the
# VT that TTYPath= names, and pam_systemd registers that session with
# logind. vtium starts each login child in a systemd scope of its own,
# outside this session, so pam_systemd in /bin/login gives the user a
# logind session of their own. That session has no seat, since vtium's
# session holds seat0, and vtium leaves XDG_SEAT, XDG_VTNR and its own
# XDG_SESSION_* variables out of the child's environment (ADR-1400 D3).
# Where systemd is not PID 1, the login child stays in this session.
#
# systemd refuses to load a unit that sets PAMName= with KillMode=process,
# the shipped unit's value (systemd 262's service_verify, measured with
# systemd-analyze verify). So this drop-in sets KillMode=mixed: systemd
# still signals vtium alone when the unit stops or restarts, and then ends
# the rest of the unit's processes, such as a login prompt nobody has used
# yet. A logged-in session lives in its own logind scope and is not ended.

[Service]
User=root
PAMName=vtium
KillMode=mixed
