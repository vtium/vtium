# The accounts of vtium's privilege split (ADR-1400 D4, "The accounts"). A
# console built with the feature split starts as root and runs everything but
# the jobs that need root as the account vtium: the displays, the keyboards,
# the terminals and the drawing. The account vtium-session is for the session
# processes of a later stage of the split, and nothing runs as it yet.
#
# Both accounts have home /, no login shell, no files and only their own
# group. systemd-sysusers creates them from this file. Without the account
# vtium, vtium runs as one process, as root, and logs one line that names the
# missing account.
u vtium - "vtium drawing process" / -
u vtium-session - "vtium session processes" / -
