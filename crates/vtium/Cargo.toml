[package]
name = "vtium"
description = "A terminal for the Linux virtual console: KMS/DRM, no display server, modern text, sixel and kitty graphics"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[features]
# The minspec build is the default: the smallest complete console.
default = []
# Pictures (ADR-1100 D10): the store and the sixel and kitty handlers in
# vtium-term, the compositor's pictures in vtium-render, vtium-image, and
# the image helper's host in vtium-platform (ADR-1101).
images = ["dep:vtium-image", "vtium-term/images", "vtium-render/images", "vtium-platform/images"]
# grab-suspend through logind's Suspend (ADR-1400's L2 layer).
logind = ["vtium-platform/logind"]

[dependencies]
vtium-term.workspace = true
# Without vtium-font's `deflate` feature: the console rewrites its store
# raw, so it links no deflate (ADR-1200 D19).
vtium-font.workspace = true
vtium-render.workspace = true
vtium-platform.workspace = true
vtium-image = { workspace = true, optional = true }
# The head file's reader, parser and evaluator, which `check-config` runs
# as the start will (ADR-1401 D7, D12).
vtium-settings.workspace = true
# The messages vtium-platform writes through it, and the binary's own,
# which the binary routes to stderr.
log = "0.4"
# Opening the configuration with O_NOCTTY and O_NONBLOCK, and the glyph
# helper's pidfd; vtium-platform already builds the same version with these
# features.
rustix = { version = "=1.1.5", default-features = false, features = ["std", "fs", "process"] }
# Key names in the power keys' chords, as xkb names them; vtium-platform
# already builds the same version for its keyboards.
xkbcommon = { version = "=0.9.0", default-features = false }

[dev-dependencies]
# A timer source in the loop that bounds a wait in `tests/images.rs`;
# vtium-platform builds the same version.
calloop = { version = "=0.14.4", default-features = false }
# The glyph helper's serve mode, which `tests/boot.rs` runs in a process of
# its own as the helper an outline frit asks, so the console's tests meet
# the checks the real helper makes.
vtium-vitrify = { path = "../vtium-vitrify" }
