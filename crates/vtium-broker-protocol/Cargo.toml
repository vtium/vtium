[package]
name = "vtium-broker-protocol"
description = "The messages between vtium's broker, which keeps root, and its drawer, and the SOCK_SEQPACKET socket that carries them"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[features]
# `Link::wait_for_close`, which the broker's tests in the vtium crate use
# to wait for the other end's close. Only a dev-dependency turns it on.
test-support = []

[dependencies]
# The socket, its SCM_RIGHTS descriptors and the poll that tells a closed
# socket from an empty message; vtium-platform already builds the same
# version.
rustix = { version = "=1.1.6", default-features = false, features = ["std", "event", "net"] }

[dev-dependencies]
# One test checks that the protocol's EINVAL is the kernel's; vtium-platform
# already builds the same version.
libc = "=0.2.191"
