# The broker's fuzz target, run with cargo-fuzz on nightly:
#   cargo +nightly fuzz run protocol
# Its own workspace, so the main workspace and CI do not build it.
[package]
name = "vtium-broker-protocol-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
vtium-broker-protocol = { path = ".." }

[[bin]]
name = "protocol"
path = "fuzz_targets/protocol.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]
