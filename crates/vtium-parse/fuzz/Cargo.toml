# The parser's fuzz target, run with cargo-fuzz on nightly:
#   cargo +nightly fuzz run parse
# Its own workspace, so the main workspace and CI do not build it.
[package]
name = "vtium-parse-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
vtium-parse = { path = ".." }

[[bin]]
name = "parse"
path = "fuzz_targets/parse.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]
