# /etc/vtium/heads.conf: vtium's heads, and the rules that place each
# display and each input in one.
#
# With no file, vtium runs this configuration, compiled into it from this
# same text, so a file written from it changes nothing until edited. vtium
# reads the file only when root owns it and neither group nor others can
# write it or a directory above it. vtium never changes the file. It logs
# each error with its line, and each error drops what it takes: a bad rule
# drops that rule, an error in a head's section drops that head with every
# rule naming it, and an error in the file's structure, such as a missing
# version, drops all but the policy. `vtium check-config FILE` checks a
# file before it is installed.
#
# Above the first section come the format's version and the policy, in
# either order. A # starts a comment at the start of a line or after a
# blank; a # inside a word, as in --x#1, is part of the word.
version = 1

# The policy decides what the rules leave unsaid. Under open, an input no
# rule places roams, typing into the active head, no head is isolated
# unless it says so, and the anti-lockout guard and the rescue key are on. Under closed, an input no rule places is ignored, every head is
# isolated unless it says otherwise, and the guards are off: nothing
# reaches a head the file does not send it to.
# policy = open

# A head is a terminal for one or more displays: its displays, its inputs,
# a profile and its consoles. A name is 1 to 64 of A-Z a-z 0-9 . _ + -
# and roaming, ignore and off are reserved. Each key below is shown at its
# default.
[head console]
# The profile's name, which sets the head's font. Until profiles have
# files, any name but default draws with the frit of that name.
# profile = default
#
# How many consoles the head has, 1 to 50; one is shown at a time.
# consoles = 1
#
# The consoles' command, as kmscon.conf's login takes it. Unset, the
# consoles run kmscon.conf's.
# login = /bin/login -p
#
# What the head's sessions do when it loses its last display: keep runs
# them on until a display of the head returns; hangup hangs them up at
# once; hangup DURATION (30, 30s, 5m or 1h) resumes them on a return
# within the time and hangs them up after it.
# when-display-lost = keep
#
# yes isolates the head: its keyboards' Ctrl-Alt-F<n> reach its session as
# keys and switch no VT, the rescue key leaves its keyboards where they
# are, and it is never the active head, so no roaming input reaches it.
# Unset, no under policy = open and yes under policy = closed.
# isolated = no

[rules]
# Each display and each input walks these rules alone, top to bottom, and
# the first that matches places it:
#   display MATCH -> TARGET
#   input MATCH -> TARGET
# MATCH is * (every device of that kind) or key:value tokens, every one of
# which must hold. TARGET is a head's name; for an input, roaming (it types
# into the active head) or ignore (vtium never opens it, but under open
# for a keyboard watched for the rescue key); for a display, off (vtium
# sets it off). A display no rule matches is off, logged with a rule line
# to paste; an input no rule matches roams under open and is ignored under
# closed. `vtiumctl detect` lists every device with its keys filled in.
#
# Keys for an input:
#   path:ID_PATH                  the USB port, and every interface below it
#   serial:VENDOR:PRODUCT:SERIAL  one unit, wherever it is plugged
#   bluetooth:ADDRESS             one device, once bonded
#   id:VENDOR:PRODUCT             every unit of a model; devices lie
#   name:GLOB                     anything that names itself so
#   class:CLASS                   keyboard, key, mouse, touchpad,
#                                 touchscreen, trackball, pointingstick,
#                                 tablet, tablet-pad, joystick,
#                                 accelerometer or switch, as udev tags it
#   udev:NAME=GLOB                any udev property of the device
# For a head whose sessions need protecting, use path plus serial where the
# device has a serial, and path alone otherwise. id or name alone is for
# convenience only. A glob's * takes any run of characters and ? one; a
# value holds no blank, so ? stands for a space in a name.
#
# Keys for a display:
#   edid:MAKER:PRODUCT:SERIAL     one monitor, the recommended key
#   connector-path:PATH           one port of a DisplayPort multi-stream hub
#   connector:CARD/CONNECTOR      a port of a GPU, globs allowed
#   card:GLOB                     every output of a GPU
# A card is its udev ID_PATH (pci-0000:03:00.0), never cardN. A
# multi-stream connector's name, such as DP-8, can move after a replug or a
# resume; its PATH (mst:...) stays, so use connector-path there and
# connector only where the name is stable.
#
# path, serial, card, connector and udev read udev's database, and match
# nothing on a system with no udev daemon.
#
# Customise by adding rules above the shipped ones, as in:
#   display edid:AAA:0x0001:LARGE00001 -> desk
#   input path:pci-0000:15:00.0-usb-0:3.3 -> desk
#   input udev:VTIUM_IGNORE=1 -> ignore
# A udev rule can mark a device for the last of these, copied into
# /etc/udev/rules.d/ (the examples are in /usr/share/doc/vtium/examples/):
#   SUBSYSTEM=="input", ATTRS{name}=="Headphones (AVRCP)", ENV{VTIUM_IGNORE}="1"
# and an hwdb entry, copied into /etc/udev/hwdb.d/, can mark a token or a
# numpad, which the anti-lockout guard then does not count as a keyboard:
#   evdev:input:b0003vBBBBp0001*
#    VTIUM_ROLE=token
#
# The shipped rules: one head mirroring every display, every keyboard,
# key device and pointer typing into it, and every other input left closed.
display * -> console
input class:keyboard -> roaming
input class:mouse -> roaming
input class:touchpad -> roaming
input class:touchscreen -> roaming
input class:trackball -> roaming
input class:pointingstick -> roaming
input class:key -> roaming
input * -> ignore
