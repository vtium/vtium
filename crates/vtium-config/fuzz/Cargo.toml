# The shaping path's, the BDF reader's and the helper's request parser's
# fuzz targets, run with cargo-fuzz on nightly:
#   cargo +nightly fuzz run shape
#   cargo +nightly fuzz run bdf
#   cargo +nightly fuzz run serve
# Its own workspace, so the main workspace and CI do not build it.
[package]
name = "vtium-config-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
# The test font builder the target shares with the tests compresses its
# PNG strikes; vtium-config already builds this version.
miniz_oxide = "=0.8.9"
vtium-config = { path = ".." }
# The style the shaping target synthesises over the glyphs.
vtium-font = { path = "../../vtium-font" }

[[bin]]
name = "shape"
path = "fuzz_targets/shape.rs"
test = false
doc = false
bench = false

[[bin]]
name = "bdf"
path = "fuzz_targets/bdf.rs"
test = false
doc = false
bench = false

[[bin]]
name = "serve"
path = "fuzz_targets/serve.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]
