# The shaping path's, the BDF reader's, the helper's request parser's and
# the name-table reader's fuzz targets, run with cargo-fuzz on nightly:
#   cargo +nightly fuzz run shape
#   cargo +nightly fuzz run bdf
#   cargo +nightly fuzz run serve
#   cargo +nightly fuzz run names
# Its own workspace, so the main workspace and CI do not build it.
[package]
name = "vtium-config-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
# The TrueType test font writer the shaping target shares with
# vtium-config's tests.
vtium-testfont = { path = "../../../tools/testfont" }
vtium-config = { path = ".." }
# The style the shaping target synthesises over the glyphs.
vtium-font = { path = "../../vtium-font" }

[[bin]]
name = "shape"
path = "fuzz_targets/shape.rs"
test = false
doc = false
bench = false

[[bin]]
name = "bdf"
path = "fuzz_targets/bdf.rs"
test = false
doc = false
bench = false

[[bin]]
name = "serve"
path = "fuzz_targets/serve.rs"
test = false
doc = false
bench = false

[[bin]]
name = "names"
path = "fuzz_targets/names.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]
