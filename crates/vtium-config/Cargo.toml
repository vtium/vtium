[package]
name = "vtium-config"
description = "The head file: its reader and parser, and the evaluator that places each display and input"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
# opens the head file without blocking and without taking a tty as the
# controlling one, as the console opens kmscon.conf; vtium links it already
rustix = { version = "=1.1.5", default-features = false, features = ["std", "fs"] }

[dev-dependencies]
# the font-size bound's test reads vtium-font's cell bound, its one source
vtium-font = { workspace = true }
