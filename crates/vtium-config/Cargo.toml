[package]
name = "vtium-config"
description = "Manages the vtium console's fonts and settings, trying each font on the live console, and generates its glyphs at run time"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[features]
# The console's terminal built with images in this crate's tests, to read
# the TUI's size pictures as vtium reads them. The workspace's
# `--all-features` run turns it on; no shipped build does.
kitty-check = ["vtium-term/images"]
# `tui::aim_font_scan`, which aims the Fonts tab's font scan at a test's
# own folders. The workspace's `--all-features` run turns it on; no
# shipped build does.
test-hooks = []

[dependencies]
# The glyph chunk format's writer; the PSF reader; the built-in fonts a
# frit may name as sources. The PSF reader is behind
# vtium-font's `psf` feature and the writer's deflate behind its
# `deflate` feature, which only this tool enables (ADR-1200 D19).
vtium-font = { workspace = true, features = ["psf", "deflate"] }
# KDGETMODE, KDFONTOP and GIO_UNIMAP for the console: source (ADR-1200 D8);
# the TUI's event loop, which holds its signals (ADR-1201 D7).
vtium-platform.workspace = true
# vtium.conf's line editor and the head file's one writer and parser
# (ADR-1201 D5, D6), the crate the console already links; with its vtlook
# reader, which the Effects tab lists vtlooks with (ADR-1205 D3).
vtium-settings = { workspace = true, features = ["filters"] }
# The console's named palettes, in whose colors the TUI draws its pictures
# of the console (ADR-1201 D4), and the terminal's width rule, by which the
# helper gives each glyph its cells (ADR-1200 D21); the crate the console
# already links.
vtium-term.workspace = true
# The devices present as the head file's rules see them, mapped by the
# functions the console places them with, for the flow view (ADR-1403 D9).
vtium-devices.workspace = true
# The font helper: the frits, the sources, the decoders, the rasteriser and
# `serve`, which this crate's binary runs and re-exports at its root.
vtium-font-helper.workspace = true
# The TUI's toolkit: its Backend, its rows of styled text, its colors, its
# shared list and its decoder of keys and replies, which the TUI's `tui`
# module re-exports.
vtium-config-widgets.workspace = true
# Opening a file without following a link, the
# effective uid, `set`'s raw mode, and the terminal's width for the
# banner; vtium-platform already builds this version with these features.
rustix = { version = "=1.1.6", default-features = false, features = ["std", "fs", "process", "system", "termios", "thread"] }
# The frame filters' color tables of the crate the console draws with,
# which the Effects tab's preview draws a picture of the console through,
# as the console's CPU path draws a frame.
vtium-render = { workspace = true, features = ["filters"] }

# The TUI's layout, buffer of cells, styled text and Terminal, and its
# lists, tabs and paragraphs. Only their `std` feature, and no backend
# crate: vtium-config's own Backend turns ratatui's cells into the bytes
# its loop writes. The two crates are released together and move together.
ratatui-core = { version = "=0.1.2", default-features = false, features = ["std"] }
ratatui-widgets = { version = "=0.3.2", default-features = false, features = ["std"] }

# The user database's lookup of the name doas hands apply in DOAS_USER
# (getpwnam), safe; the version calloop already builds, with its `user`
# feature, in this binary only.
nix = { version = "=0.31.3", default-features = false, features = ["user"] }

[dev-dependencies]
# A pty for `set`'s and the banner's tests; vtium-platform already builds
# this version with these features.
rustix = { version = "=1.1.6", default-features = false, features = ["std", "fs", "process", "pty", "termios", "thread"] }
# libc's system call numbers, for the seccomp filters' tests in
# tests/serve.rs; the version vtium-font-helper builds.
libc = "=0.2.191"
# The TrueType test font writer the tests build their outline fonts with,
# which tier 2's ink test font shares (vtium/vtium#339).
vtium-testfont = { path = "../../tools/testfont" }
# The stand-in programs the tests write and copy, put in place so that
# the kernel never refuses to run one as busy.
vtium-testscript = { path = "../../tools/testscript" }
# The property test of the TUI's navigation in tests/scenarios/: random
# key sequences checked against a reading of the key table and the
# interface tree, and shrunk to the shortest that fails. proptest is MIT
# or Apache-2.0. vtium-config asks for it with its default features off,
# but proptest-state-machine 0.9.0 asks for its default features and for
# `fork` and `timeout`, and cargo builds a crate with every feature that
# its dependents ask for. So proptest builds with `std`, `fork`, `timeout`
# and `bit-set`, its regex strategies and its runner that forks each case
# into a process of its own included. Both are dev-dependencies, so the
# release binary does not change.
proptest = { version = "=1.12.0", default-features = false, features = ["std", "bit-set"] }
proptest-state-machine = "=0.9.0"

# The TUI's screens as text snapshots of ratatui's TestBackend, one per
# node of the interface tree, provisional until the maintainer accepts the
# layout. insta is Apache-2.0; a dev-dependency, so the release binary does
# not change.
insta = "=1.49.0"
