# The image handlers' fuzz targets, run with cargo-fuzz on nightly:
#   cargo +nightly fuzz run sixel
#   cargo +nightly fuzz run kitty
# Its own workspace, so the main workspace and CI do not build it.
[package]
name = "vtium-image-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
vtium-term = { path = "../../vtium-term", features = ["images"] }

[[bin]]
name = "sixel"
path = "fuzz_targets/sixel.rs"
test = false
doc = false
bench = false

[[bin]]
name = "kitty"
path = "fuzz_targets/kitty.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]
