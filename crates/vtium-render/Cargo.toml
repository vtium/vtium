[package]
name = "vtium-render"
description = "Frames to pixels: the CPU compositor, a GPU path behind a feature"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
vtium-term.workspace = true
vtium-font.workspace = true

[dev-dependencies]
# the tests draw PSF fonts, whose loader the console leaves out
vtium-font = { workspace = true, features = ["psf"] }

[features]
# the glyph cache defaults to its performance profile (ADR-1300 D4)
performance-cache = []
