[package]
name = "vtium-render"
description = "Frames to pixels: the CPU compositor, a GPU path behind a feature"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
vtium-term.workspace = true
vtium-font.workspace = true
# the store's frame entries, which the compositor draws (ADR-1100 D9)
vtium-image = { workspace = true, optional = true }

[dev-dependencies]
# the tests draw PSF fonts, whose loader the console leaves out
vtium-font = { workspace = true, features = ["psf"] }

[features]
# the glyph cache defaults to its performance profile (ADR-1300 D4)
performance-cache = []
# draws a frame's image placements, keeps their scaled copies and marks the
# cells they change (ADR-1100 D1, D10); the minspec build leaves it out
images = ["dep:vtium-image", "vtium-term/images"]
# the GPU path's frame, its safe `Gl` trait and the tests' stand-in GL
# (ADR-1303 D7); off by default, so the minspec build compiles none of it
gpu = []
# draws right-to-left text (ADR-1004 D13): each letter of a joining script
# in its joined form, the lam-alef ligature across its two cells, and the
# bar cursor on the right side of a right-to-left cell; the minspec build
# leaves it out
bidi = ["vtium-term/bidi"]
