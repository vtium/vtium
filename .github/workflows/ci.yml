name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-features --all-targets -- -D warnings
      - run: cargo test --workspace --all-features
      - name: minspec build
        run: cargo build --profile minspec

  adr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docs/scripts/adr lint --check
      - name: ADR-1000 coverage ledger
        run: docs/scripts/coverage

  # Tier 1 and the capability probes: vtium judged by the C reference's
  # goldens and probes at the commits tools/conformance/pin.tsv names.
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: vtium
      - name: pinned commits
        id: pin
        run: awk '!/^#/ && NF { print $1 "=" $2 }' vtium/tools/conformance/pin.tsv >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: aaronsb/libtsm
          ref: ${{ steps.pin.outputs.libtsm }}
          path: libtsm
      - uses: actions/checkout@v4
        with:
          repository: aaronsb/kmscon
          ref: ${{ steps.pin.outputs.kmscon }}
          path: kmscon
      - uses: dtolnay/rust-toolchain@stable
      - run: make conformance conformance-probes conformance-issues
        working-directory: vtium
        env:
          GH_TOKEN: ${{ github.token }}

  tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make test-tools

  # Tier 2: the renderer's screens against the C reference's goldens at the
  # commit tools/tier2/pin.tsv names, and against vtium's own. The report
  # and the images are kept whatever the result.
  tier2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: vtium
      - name: pinned commit
        id: pin
        run: |
          awk '!/^#/ && $1 == "kmscon" { print "commit=" $2; sub(/^https:\/\/github.com\//, "", $3); sub(/\.git$/, "", $3); print "repository=" $3 }' vtium/tools/tier2/pin.tsv >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: ${{ steps.pin.outputs.repository }}
          ref: ${{ steps.pin.outputs.commit }}
          path: kmscon
      - uses: dtolnay/rust-toolchain@stable
      - run: make tier2
        working-directory: vtium
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tier2-report
          path: |
            vtium/tools/tier2/out/report.json
            vtium/tools/tier2/out/actual/
            vtium/tools/tier2/out/diff/
