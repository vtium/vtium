name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  # The workspace's checks, in two jobs that run at once: one builds with
  # every feature (fmt, clippy and the tests), the other the default build,
  # which is the minspec console's (its tests and the minspec profile).
  # --all-features never compiles or tests what a feature leaves out, so
  # both builds are checked.
  check:
    strategy:
      fail-fast: false
      matrix:
        build: [all-features, default]
    name: check (${{ matrix.build }})
    runs-on: ubuntu-latest
    steps:
      # Each build fills much of the runner's disk. The runner's preinstalled
      # .NET, Android, Haskell and CodeQL toolchains, which vtium never uses,
      # are removed to make room.
      - name: free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@v4
      # libudev and libxkbcommon, which vtium-platform links, and libsystemd,
      # which its logind feature links; and Mesa's EGL and llvmpipe, which
      # the gpu feature's tests draw on (vtium-platform loads libEGL and
      # libgbm at run time and links neither)
      - run: sudo apt-get update && sudo apt-get install -y libudev-dev libxkbcommon-dev libsystemd-dev libegl1 libegl-mesa0 libgl1-mesa-dri libgbm1
      # The toolchain rust-toolchain.toml pins.
      - id: toolchain
        run: echo "channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          components: rustfmt, clippy
      # Cache the cargo registry and the target directory between runs; the
      # key follows Cargo.lock, the toolchain, this job and its build, so
      # the two builds never share a cache entry.
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.build }}
      - if: matrix.build == 'all-features'
        run: cargo fmt --all --check
      - if: matrix.build == 'all-features'
        run: cargo clippy --workspace --all-features --all-targets -- -D warnings
      - if: matrix.build == 'all-features'
        run: cargo test --workspace --all-features
      - name: default build tests
        if: matrix.build == 'default'
        run: cargo test --workspace
      - name: minspec build
        if: matrix.build == 'default'
        run: cargo build --profile minspec

  # minspec's ARM targets (tools/arm/README.md). The tests run natively on
  # an aarch64 runner, which judges what qemu-user cannot; the cross build
  # takes both targets through the sysroots and wrappers `make arm` uses.
  arm-native:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      # As the check job's, Mesa's EGL and llvmpipe included: the gpu
      # feature's tests draw on llvmpipe here too
      - run: sudo apt-get update && sudo apt-get install -y libudev-dev libxkbcommon-dev libsystemd-dev libegl1 libegl-mesa0 libgl1-mesa-dri libgbm1
      # The toolchain rust-toolchain.toml pins.
      - id: toolchain
        run: echo "channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
      # Cache the cargo registry and the target directory between runs; the
      # key follows Cargo.lock, the toolchain and this job, so every job still
      # builds and tests everything it did.
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-features
      - name: minspec build
        run: cargo build --profile minspec

  arm-cross:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The toolchain rust-toolchain.toml pins.
      - id: toolchain
        run: echo "channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          targets: aarch64-unknown-linux-gnu, armv7-unknown-linux-gnueabihf
      # Cache the cargo registry and the target directory between runs; the
      # key follows Cargo.lock, the toolchain and this job, so every job still
      # builds and tests everything it did.
      - uses: Swatinem/rust-cache@v2
      # Only the packages, which every extraction checks against pin.tsv;
      # the sysroots are extracted afresh on each run. The packages are
      # saved under a key of this run's own even when the job fails, so a
      # run that fetched some of them before the Debian snapshot archive
      # stopped answering keeps them, and the next run starts from there.
      - id: arm-debs
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/vtium/arm/debs
          key: arm-debs-${{ hashFiles('tools/arm/pin.tsv') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: arm-debs-${{ hashFiles('tools/arm/pin.tsv') }}-
      - run: make arm
      # A passing run that restored an entry adds nothing new, so it saves
      # no copy of it.
      - uses: actions/cache/save@v4
        if: always() && (failure() || steps.arm-debs.outputs.cache-matched-key == '')
        with:
          path: ~/.cache/vtium/arm/debs
          key: arm-debs-${{ hashFiles('tools/arm/pin.tsv') }}-${{ github.run_id }}-${{ github.run_attempt }}

  # The oldest Rust vtium builds on: the rust-version Cargo.toml declares.
  # The builds catch a language feature or a dependency newer than it, and
  # --all-targets keeps the tests building too; the gates run the tests on
  # the pinned toolchain in the jobs above.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libudev-dev libxkbcommon-dev libsystemd-dev
      # RUSTUP_TOOLCHAIN takes precedence over rust-toolchain.toml's pin, so
      # every later step, the cache's key included, runs on the rust-version.
      - id: msrv
        run: |
          version=$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "RUSTUP_TOOLCHAIN=$version" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      # Cache the cargo registry and the target directory between runs; the
      # key follows Cargo.lock, the toolchain and this job, so every job still
      # builds and tests everything it did.
      - uses: Swatinem/rust-cache@v2
      - run: make msrv

  adr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docs/scripts/adr lint --check
      - run: docs/scripts/adr cite --check
      - run: docs/scripts/issue-refs
      - run: docs/scripts/fork-refs
      - name: ADR-1000 coverage ledger
        run: docs/scripts/coverage

  # Tier 1 and the capability probes, against the goldens and probes
  # tools/conformance/ holds.
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The toolchain rust-toolchain.toml pins.
      - id: toolchain
        run: echo "channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
      # Cache the cargo registry and the target directory between runs; the
      # key follows Cargo.lock, the toolchain and this job, so every job still
      # builds and tests everything it did.
      - uses: Swatinem/rust-cache@v2
      - run: make conformance conformance-probes conformance-issues
        env:
          GH_TOKEN: ${{ github.token }}

  # The VT review tools and tier 3's harness, whose tests read the goldens
  # in tools/tier3/goldens; vtium is the only checkout.
  tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # libudev and libxkbcommon, which vtium-platform links, and Mesa's EGL
      # and llvmpipe, which vtium's unit tests of the GPU path draw on when
      # the target tests the key table's crates with gpu (vtium-platform
      # loads libEGL and libgbm at run time and links neither)
      - run: sudo apt-get update && sudo apt-get install -y libudev-dev libxkbcommon-dev libegl1 libegl-mesa0 libgl1-mesa-dri libgbm1
      # The toolchain rust-toolchain.toml pins, for the cargo tests and
      # cargo tree the target runs.
      - id: toolchain
        run: echo "channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
      # The Debian packages the test of the development console's build
      # fetches for its sysroot, which every extraction checks against
      # pin.tsv. The key prefix is the job's own, because arm-cross's entries
      # hold only the ARM packages. Each run saves under a key of its own
      # even when the job fails, so the packages a run fetched before the
      # Debian snapshot archive stopped answering are kept, and the next run
      # restores the newest entry and fetches only what is still missing.
      - id: tools-debs
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/vtium/arm/debs
          key: tools-debs-${{ hashFiles('tools/arm/pin.tsv') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: tools-debs-${{ hashFiles('tools/arm/pin.tsv') }}-
      - run: make test-tools
      # A passing run that restored an entry adds nothing new, so it saves
      # no copy of it.
      - uses: actions/cache/save@v4
        if: always() && (failure() || steps.tools-debs.outputs.cache-matched-key == '')
        with:
          path: ~/.cache/vtium/arm/debs
          key: tools-debs-${{ hashFiles('tools/arm/pin.tsv') }}-${{ github.run_id }}-${{ github.run_attempt }}

  # Tier 2: the renderer's screens against vtium's goldens in
  # tools/tier2/goldens, and the GPU path's drawing of each against the CPU
  # path's, on llvmpipe; vtium is the only checkout. The report and the images are kept whatever the result.
  tier2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: vtium
      # libudev and libxkbcommon, which vtium-platform links through
      # vtium-config, the tool that draws the test fonts' glyphs; and Mesa's
      # EGL and llvmpipe, which the GPU path's screens draw on (vtium-platform
      # loads libEGL and libgbm at run time and links neither)
      - run: sudo apt-get update && sudo apt-get install -y libudev-dev libxkbcommon-dev libegl1 libegl-mesa0 libgl1-mesa-dri libgbm1
      # The toolchain rust-toolchain.toml pins.
      - id: toolchain
        run: echo "channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' vtium/rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
      # Cache the cargo registry and the target directory between runs; the
      # key follows Cargo.lock, the toolchain and this job, so every job still
      # builds and tests everything it did.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: vtium
      # The outline fonts the outline screens draw with, which
      # tools/tier2/src/fonts.rs names by URL and SHA-256. `make tier2` runs
      # `make tier2-fonts`, which checks each cached font against its SHA-256
      # and fetches only those the cache lacks.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/vtium/tier2/fonts
          key: tier2-fonts-${{ hashFiles('vtium/tools/tier2/src/fonts.rs') }}
      - run: make tier2
        working-directory: vtium
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tier2-report
          path: |
            vtium/tools/tier2/out/report.json
            vtium/tools/tier2/out/actual/
            vtium/tools/tier2/out/diff/

  # The specimens: the test card drawn for each display profile, against
  # what docs/specimens holds. `cargo test` in the check job judges every
  # profile but the three drawn from fetched fonts, 1920x1080, 2560x1440
  # and 320x240-tiny5, and names this job as the one that judges those.
  specimens:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # libudev and libxkbcommon, which vtium-platform links through
      # vtium-config, the crate whose engine generates the fetched fonts'
      # glyphs
      - run: sudo apt-get update && sudo apt-get install -y libudev-dev libxkbcommon-dev
      # The toolchain rust-toolchain.toml pins.
      - id: toolchain
        run: echo "channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
      # Cache the cargo registry and the target directory between runs; the
      # key follows Cargo.lock, the toolchain and this job, so every job still
      # builds and tests everything it did.
      - uses: Swatinem/rust-cache@v2
      # The pinned fonts, which tools/specimens/src/fonts.rs names by URL
      # and SHA-256. `make specimens-fonts` checks each cached font against
      # its SHA-256 and fetches only those the cache lacks.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/vtium/specimens/fonts
          key: specimens-fonts-${{ hashFiles('tools/specimens/src/fonts.rs') }}
      - run: make specimens-fonts
      - run: make specimens-check
