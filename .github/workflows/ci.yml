name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # libudev and libxkbcommon, which vtium-platform links, and libsystemd,
      # which its logind feature links
      - run: sudo apt-get update && sudo apt-get install -y libudev-dev libxkbcommon-dev libsystemd-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-features --all-targets -- -D warnings
      - run: cargo test --workspace --all-features
      - name: minspec build
        run: cargo build --profile minspec

  # minspec's ARM targets (tools/arm/README.md). The tests run natively on
  # an aarch64 runner, which judges what qemu-user cannot; the cross build
  # takes both targets through the sysroots and wrappers `make arm` uses.
  arm-native:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libudev-dev libxkbcommon-dev libsystemd-dev
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace --all-features
      - name: minspec build
        run: cargo build --profile minspec

  arm-cross:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu, armv7-unknown-linux-gnueabihf
      # Only the packages, which every extraction checks against pin.tsv;
      # the sysroots are extracted afresh on each run.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/vtium/arm/debs
          key: arm-debs-${{ hashFiles('tools/arm/pin.tsv') }}
      - run: make arm

  adr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docs/scripts/adr lint --check
      - name: ADR-1000 coverage ledger
        run: docs/scripts/coverage

  # Tier 1 and the capability probes, against the goldens and probes
  # tools/conformance/ holds.
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: make conformance conformance-probes conformance-issues
        env:
          GH_TOKEN: ${{ github.token }}

  # The VT review tools and tier 3's harness, with the kmscon checkout at
  # tools/tier3/pin.tsv's commit beside vtium, so the tests that read tier
  # 3's goldens run.
  tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: vtium
      - name: pinned commit
        id: pin
        run: |
          awk '!/^#/ && $1 == "kmscon" { print "commit=" $2; sub(/^https:\/\/github.com\//, "", $3); sub(/\.git$/, "", $3); print "repository=" $3 }' vtium/tools/tier3/pin.tsv >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: ${{ steps.pin.outputs.repository }}
          ref: ${{ steps.pin.outputs.commit }}
          path: kmscon
      - run: make test-tools
        working-directory: vtium

  # Tier 2: the renderer's screens against the C reference's goldens at the
  # commit tools/tier2/pin.tsv names, and against vtium's own. The report
  # and the images are kept whatever the result.
  tier2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: vtium
      - name: pinned commit
        id: pin
        run: |
          awk '!/^#/ && $1 == "kmscon" { print "commit=" $2; sub(/^https:\/\/github.com\//, "", $3); sub(/\.git$/, "", $3); print "repository=" $3 }' vtium/tools/tier2/pin.tsv >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: ${{ steps.pin.outputs.repository }}
          ref: ${{ steps.pin.outputs.commit }}
          path: kmscon
      - uses: dtolnay/rust-toolchain@stable
      - run: make tier2
        working-directory: vtium
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tier2-report
          path: |
            vtium/tools/tier2/out/report.json
            vtium/tools/tier2/out/actual/
            vtium/tools/tier2/out/diff/
