name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-features --all-targets -- -D warnings
      - run: cargo test --workspace --all-features
      - name: minspec build
        run: cargo build --profile minspec

  adr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docs/scripts/adr lint --check
      - name: ADR-1000 coverage ledger
        run: docs/scripts/coverage

  # Tier 1 and the capability probes: vtium judged by the C reference's
  # goldens and probes at the commits tools/conformance/pin.tsv names.
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: vtium
      - name: pinned commits
        id: pin
        run: awk '!/^#/ && NF { print $1 "=" $2 }' vtium/tools/conformance/pin.tsv >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: aaronsb/libtsm
          ref: ${{ steps.pin.outputs.libtsm }}
          path: libtsm
      - uses: actions/checkout@v4
        with:
          repository: aaronsb/kmscon
          ref: ${{ steps.pin.outputs.kmscon }}
          path: kmscon
      - uses: dtolnay/rust-toolchain@stable
      - run: make conformance conformance-probes conformance-issues
        working-directory: vtium
        env:
          GH_TOKEN: ${{ github.token }}

  tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make test-tools
