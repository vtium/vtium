# The files each GitHub release carries, all made here from the tagged
# commit: the source as vtium-VERSION.tar.gz and vtium-VERSION.zip from git
# archive, the vendor archive vtium-VERSION-vendor.tar.zst and its .sha256,
# which hold the source of every outside crate vtium builds with so that a
# package manager that builds with no network has them, the manifest of
# those crates, vtium-VERSION-dependencies.tsv, and SHA256SUMS, which lists
# the SHA-256 of each. tools/vendor/archive describes the files.
#
# A release is published from a draft. GitHub's immutable releases lock a
# release's files once it is published, so the files go onto the draft
# first. The person who makes the release pushes the signed tag, saves a
# draft release for it, and runs this workflow on the tag with draft set:
#
#   gh workflow run release-vendor.yml --ref v0.1.0-alpha.12 -f draft=true
#
# The draft job checks that the tag has a release and that the release is
# still a draft. It also checks that the tag is an annotated tag whose
# signature GitHub verifies, and that the tag still names the commit the run
# started on. The archive job checks out that commit, builds Cullet Mono's
# faces, then packs the files with make vendor-archive-check. The check
# verifies them against SHA256SUMS and the source archives against the
# commit, builds the workspace and make install offline from the vendor
# archive, and keeps the files as a workflow artifact. The attest job makes
# a build provenance attestation for each file. A run started on the tag
# runs from the tag's commit, so each attestation names that commit and the
# tag. The attach job attaches the files to the draft, then checks the
# draft's whole set of files the way the published job does. The person
# then looks over the draft and publishes it. Anyone can check a file with
# gh attestation verify FILE --repo vtium/vtium --source-ref refs/tags/TAG.
#
# GitHub starts no workflow when a draft release is saved, because the
# release event's created type does not fire for a draft. That is why a
# person starts this workflow by hand.
#
# When the release is published, the published job checks the tag again,
# downloads the release's files, and checks that they are the files
# SHA256SUMS lists, that each one matches its SHA-256, and that each one
# has an attestation that this workflow made from the tag at the tag's
# commit on a GitHub-hosted runner. An attestation from a dry run on a
# branch does not count. A release published with the workflow token starts
# no workflow, so this runs for a release that a person publishes.
# tools/release/check holds the tag check and the files check, which the
# draft, attach and published jobs share. Those jobs check out only
# tools/release, at the commit the workflow file itself comes from.
#
# Run by hand without draft, on a tag, a branch or a commit, the workflow
# is a dry run. It packs and checks the files and keeps them as a workflow
# artifact alone, so they can be checked before a release depends on them.
# It attests them only when the attest input is true, which checks the
# attest step itself. An attestation names the commit the workflow ran
# from, which in a dry run is the branch the run was started on, not the
# ref input, so a dry run attests only to try the step. A dry run checks
# out the whole history, so the files' names carry the ref's tag, or git
# describe's name for it.
#
# References:
# - ADR-1500 D9: each release carries the vendor archive, for a package
#   manager that builds with no network.
name: Release files
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: The tag, branch or commit to pack the release files for, such as v0.1.0-alpha.6 or main; empty packs the ref the run started on. A run with draft set packs the tag it started on and takes no other ref.
        required: false
        default: ''
        type: string
      attest:
        description: Also make a build provenance attestation for each file, to try the attest step
        required: false
        default: false
        type: boolean
      draft:
        description: Attach the attested files to the draft release of the tag this run started on
        required: false
        default: false
        type: boolean

permissions:
  contents: read

# Two runs that attach files to the same draft would replace each other's
# files, so they wait for each other. Dry runs never wait.
concurrency:
  group: release-files-${{ inputs.draft && github.ref_name || github.run_id }}
  cancel-in-progress: false

env:
  # The tag of the draft release, and empty in a dry run.
  RELEASE_TAG: ${{ inputs.draft && github.ref_name || '' }}

jobs:
  # Fails before the long build when the run cannot attach its files: the
  # run did not start on a tag, the ref input names something else, the tag
  # has no draft release, the tag is not signed, or the tag moved after the
  # run started. Only a token that may write to the repository sees draft
  # releases. The job runs only tools/release/check, from the commit the
  # workflow file comes from, and builds nothing.
  draft:
    if: inputs.draft
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          sparse-checkout: tools/release
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ github.token }}
          REF_TYPE: ${{ github.ref_type }}
          REF_INPUT: ${{ inputs.ref }}
        run: |
          if [ "$REF_TYPE" != tag ]; then
            echo "::error::A run with draft set must start on the release's tag, as in gh workflow run release-vendor.yml --ref v0.1.0-alpha.12 -f draft=true. This run started on the $REF_TYPE $GITHUB_REF_NAME."
            exit 1
          fi
          if [ -n "$REF_INPUT" ] && [ "$REF_INPUT" != "$RELEASE_TAG" ]; then
            echo "::error::A run with draft set packs the tag it started on, $RELEASE_TAG, and the ref input names $REF_INPUT."
            exit 1
          fi
          case $RELEASE_TAG in
            v[0-9]*) ;;
            *) echo "::error::The tag $RELEASE_TAG is not a release tag, which reads vVERSION."; exit 1 ;;
          esac
          tools/release/check is-draft "$RELEASE_TAG"
          tools/release/check tag draft "$RELEASE_TAG" "$GITHUB_SHA"

  archive:
    needs: draft
    # The draft job is skipped in a dry run, and GitHub skips every job
    # after a skipped job unless the job's condition says otherwise. A
    # published release starts only the published job.
    if: ${{ github.event_name == 'workflow_dispatch' && !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      # The offline build fills much of the runner's disk. The runner's
      # preinstalled .NET, Android, Haskell and CodeQL toolchains, which
      # vtium never uses, are removed to make room.
      - name: free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      # A draft run checks out the commit it started on. The draft job has
      # checked that the tag names this commit, and each attestation names
      # it too, so a tag moved later cannot change what is built.
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.draft && github.sha || inputs.ref || github.ref }}
          fetch-depth: ${{ inputs.draft && 1 || 0 }}
          persist-credentials: false
      # libudev and libxkbcommon, which vtium-platform links, libsystemd,
      # which its logind feature links, libseat, which its libseat feature
      # links, and zstd, which packs the archive. The check builds every
      # feature.
      - run: sudo apt-get update && sudo apt-get install -y libudev-dev libxkbcommon-dev libsystemd-dev libseat-dev zstd
      # The toolchain rust-toolchain.toml pins, with the ARM targets it
      # names, so the offline build finds them installed.
      - id: toolchain
        run: echo "channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          targets: aarch64-unknown-linux-gnu, armv7-unknown-linux-gnueabihf
      # Ubuntu's AppArmor stops an unprivileged user from making a user
      # namespace, so tools/vendor/archive could not build in a network
      # namespace of its own and would fall back to CARGO_NET_OFFLINE and an
      # empty CARGO_HOME. Lifting the restriction for this runner lets the
      # check build with no network at all. A runner without the setting
      # skips the step.
      - name: allow unprivileged user namespaces
        run: |
          if sysctl -n kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          else
            echo "this runner has no kernel.apparmor_restrict_unprivileged_userns"
          fi
      # The check ends with make install, which installs Cullet Mono's two
      # faces, and tools/cullet-mono/pins.tsv pins the bytes that FontForge
      # 20251009 writes. Ubuntu's FontForge is an older release, so this
      # step builds the faces in an Arch Linux container, with the FontForge
      # the AUR's recipes build them with, into target/cullet-mono. The
      # check copies the faces from there, checks them against their pins,
      # and stages the Terminus and Unifont files itself. The container runs
      # as root, so the step gives the folders it wrote back to the runner's
      # user.
      - name: build Cullet Mono
        run: |
          docker run --rm -v "$PWD:/src" -w /src -e OWNER="$(id -u):$(id -g)" archlinux:latest sh -euc '
            pacman -Syu --noconfirm --needed fontforge python rust gcc curl
            cargo run --release --locked --manifest-path tools/cullet-mono/Cargo.toml \
              --target-dir target/cullet-mono-tool -- build --out target/cullet-mono
            chown -R "$OWNER" target'
      # For a release, the file names carry its tag without the leading v.
      - run: make vendor-archive-check VENDOR_DIR="$RUNNER_TEMP/vendor" ${RELEASE_TAG:+VENDOR_VERSION="${RELEASE_TAG#v}"}
      # SHA256SUMS names every file the release carries, and the check has
      # just verified each against it, so the artifact holds those files.
      - name: list the release files
        run: |
          cd "$RUNNER_TEMP/vendor"
          mkdir "$RUNNER_TEMP/release"
          cut -c67- SHA256SUMS > "$RUNNER_TEMP/files"
          echo SHA256SUMS >> "$RUNNER_TEMP/files"
          while read -r f; do cp "$f" "$RUNNER_TEMP/release/"; done < "$RUNNER_TEMP/files"
          ls -l "$RUNNER_TEMP/release"
      - uses: actions/upload-artifact@v4
        with:
          name: vtium-release
          path: ${{ runner.temp }}/release/
          if-no-files-found: error

  attest:
    # The draft job is skipped in a dry run, and GitHub skips every job
    # after a skipped job unless the job's condition says otherwise.
    # It needs the draft job too, so that a draft job that failed skips it.
    if: ${{ !failure() && !cancelled() && (inputs.draft || inputs.attest) }}
    needs: [draft, archive]
    runs-on: ubuntu-latest
    # Attesting needs a token from GitHub's OIDC provider and the right to
    # store attestations. The job runs no code of the tag's.
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: vtium-release
          path: release
      # v4.2.2. One attestation covers every file, each named with its
      # SHA-256, and gh attestation verify checks a file against it.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: release/*

  attach:
    if: inputs.draft
    needs: [draft, archive, attest]
    runs-on: ubuntu-latest
    # Only this job and the draft job may write to the release. Each runs
    # only tools/release/check, from the commit the workflow file comes
    # from, and builds nothing. Reading attestations lets this job check the
    # draft's files.
    permissions:
      contents: write
      attestations: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          sparse-checkout: tools/release
          path: source
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: vtium-release
          path: release
      # The release is checked again, because the person may have published
      # it during the build. --clobber replaces the files a run that was
      # started again had already attached. Each file must carry the
      # release's version. After the upload, the job checks the draft's
      # whole set of files, so a file left from an earlier run or added by
      # hand shows up while the draft can still be fixed.
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          source/tools/release/check is-draft "$RELEASE_TAG"
          version=${RELEASE_TAG#v}
          for f in release/*; do
            case ${f#release/} in
              SHA256SUMS | "vtium-$version".* | "vtium-$version"-*) ;;
              *) echo "$f does not carry the release's version $version" >&2; exit 1 ;;
            esac
          done
          gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --clobber release/*
          source/tools/release/check files draft "$RELEASE_TAG" "$GITHUB_SHA"
          echo "::notice::The draft release $RELEASE_TAG carries its files, and they passed the check the published job runs. Look over the draft, then publish it."

  # Checks a release once it is published: the tag again, which catches a
  # tag moved after the draft run, and the whole set of files. The job runs
  # only tools/release/check, from the commit the workflow file comes from.
  published:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      attestations: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          sparse-checkout: tools/release
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          tools/release/check tag published "$TAG" "$GITHUB_SHA"
          tools/release/check files published "$TAG" "$GITHUB_SHA"
