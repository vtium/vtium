# The files each GitHub release carries, all made here from the tagged
# commit: the source as vtium-VERSION.tar.gz and vtium-VERSION.zip from git
# archive, the vendor archive vtium-VERSION-vendor.tar.zst and its .sha256,
# which hold the source of every outside crate vtium builds with so that a
# package manager that builds with no network has them (ADR-1500 D9), the
# manifest of those crates, vtium-VERSION-dependencies.tsv, and SHA256SUMS,
# which lists the SHA-256 of each. tools/vendor/archive describes the files.
#
# When a release is published, the archive job checks out the release's tag,
# builds Cullet Mono's faces, then packs the files with make
# vendor-archive-check. The check verifies them against SHA256SUMS and the
# source archives against the commit, builds the workspace and make install
# offline from the vendor archive, and keeps the files as a workflow
# artifact. The attest job makes a build provenance attestation for each
# file, and the attach job attaches the files to the release. Anyone can
# then check a file with gh attestation verify FILE --repo vtium/vtium.
#
# Run by hand on a tag, a branch or a commit, the workflow packs and checks
# the files and keeps them as a workflow artifact alone, so they can be
# checked before a release depends on them. It attests them only when the
# attest input is true, which checks the attest step itself. An attestation
# names the commit the workflow ran from, which in a run by hand is the
# branch the run was started on, not the ref input, so a run by hand
# attests only to try the step. A run by hand checks out the whole history,
# so the files' names carry the ref's tag, or git describe's name for it.
#
# A release published with the workflow token starts no workflow, so this
# runs for a release that a person publishes.
name: Release files
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: The tag, branch or commit to pack the release files for, such as v0.1.0-alpha.6 or main
        required: true
        type: string
      attest:
        description: Also make a build provenance attestation for each file, to try the attest step
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  # Empty in a run by hand.
  RELEASE_TAG: ${{ github.event.release.tag_name }}

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      # The offline build fills much of the runner's disk. The runner's
      # preinstalled .NET, Android, Haskell and CodeQL toolchains, which
      # vtium never uses, are removed to make room.
      - name: free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'release' && format('refs/tags/{0}', github.event.release.tag_name) || inputs.ref }}
          fetch-depth: ${{ github.event_name == 'release' && 1 || 0 }}
          persist-credentials: false
      # libudev and libxkbcommon, which vtium-platform links, libsystemd,
      # which its logind feature links, libseat, which its libseat feature
      # links, and zstd, which packs the archive. The check builds every
      # feature.
      - run: sudo apt-get update && sudo apt-get install -y libudev-dev libxkbcommon-dev libsystemd-dev libseat-dev zstd
      # The toolchain rust-toolchain.toml pins, with the ARM targets it
      # names, so the offline build finds them installed.
      - id: toolchain
        run: echo "channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          targets: aarch64-unknown-linux-gnu, armv7-unknown-linux-gnueabihf
      # Ubuntu's AppArmor stops an unprivileged user from making a user
      # namespace, so tools/vendor/archive could not build in a network
      # namespace of its own and would fall back to CARGO_NET_OFFLINE and an
      # empty CARGO_HOME. Lifting the restriction for this runner lets the
      # check build with no network at all. A runner without the setting
      # skips the step.
      - name: allow unprivileged user namespaces
        run: |
          if sysctl -n kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          else
            echo "this runner has no kernel.apparmor_restrict_unprivileged_userns"
          fi
      # The check ends with make install, which installs Cullet Mono's two
      # faces, and tools/cullet-mono/pins.tsv pins the bytes that FontForge
      # 20251009 writes. Ubuntu's FontForge is an older release, so this
      # step builds the faces in an Arch Linux container, with the FontForge
      # the AUR's recipes build them with, into target/cullet-mono. The
      # check copies the faces from there, checks them against their pins,
      # and stages the Terminus and Unifont files itself. The container runs
      # as root, so the step gives the folders it wrote back to the runner's
      # user.
      - name: build Cullet Mono
        run: |
          docker run --rm -v "$PWD:/src" -w /src -e OWNER="$(id -u):$(id -g)" archlinux:latest sh -euc '
            pacman -Syu --noconfirm --needed fontforge python rust gcc curl
            cargo run --release --locked --manifest-path tools/cullet-mono/Cargo.toml \
              --target-dir target/cullet-mono-tool -- build --out target/cullet-mono
            chown -R "$OWNER" target'
      # For a release, the file names carry its tag without the leading v.
      - run: make vendor-archive-check VENDOR_DIR="$RUNNER_TEMP/vendor" ${RELEASE_TAG:+VENDOR_VERSION="${RELEASE_TAG#v}"}
      # SHA256SUMS names every file the release carries, and the check has
      # just verified each against it, so the artifact holds those files.
      - name: list the release files
        run: |
          cd "$RUNNER_TEMP/vendor"
          mkdir "$RUNNER_TEMP/release"
          cut -c67- SHA256SUMS > "$RUNNER_TEMP/files"
          echo SHA256SUMS >> "$RUNNER_TEMP/files"
          while read -r f; do cp "$f" "$RUNNER_TEMP/release/"; done < "$RUNNER_TEMP/files"
          ls -l "$RUNNER_TEMP/release"
      - uses: actions/upload-artifact@v4
        with:
          name: vtium-release
          path: ${{ runner.temp }}/release/
          if-no-files-found: error

  attest:
    if: github.event_name == 'release' || inputs.attest
    needs: archive
    runs-on: ubuntu-latest
    # Attesting needs a token from GitHub's OIDC provider and the right to
    # store attestations. The job runs no code of the tag's.
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: vtium-release
          path: release
      # v4.2.2. One attestation covers every file, each named with its
      # SHA-256, and gh attestation verify checks a file against it.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: release/*

  attach:
    if: github.event_name == 'release'
    needs: [archive, attest]
    runs-on: ubuntu-latest
    # Only this job may write to the release, and it runs no code of the
    # tag's.
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: vtium-release
          path: release
      # --clobber replaces the files a run that was started again had
      # already attached. Each file must carry the release's version.
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${RELEASE_TAG#v}
          for f in release/*; do
            case ${f#release/} in
              SHA256SUMS | "vtium-$version".* | "vtium-$version"-*) ;;
              *) echo "$f does not carry the release's version $version" >&2; exit 1 ;;
            esac
          done
          gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --clobber release/*
