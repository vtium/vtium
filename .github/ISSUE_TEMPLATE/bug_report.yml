name: Bug report
description: vtium does something wrong on your machine
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Before you file, read [Find out what went wrong](https://github.com/vtium/vtium/blob/main/docs/troubleshooting.md), the troubleshooting guide. It says how to get out of a VT that misbehaves, gives a workaround for a VT that stays black after you switch back from the desktop, and lists what pictures need. If one of its steps fixes the problem, a report still helps, so say which step it was.
  - type: textarea
    id: happened
    attributes:
      label: What happened
      description: What you saw. A photo of the screen helps when something is drawn wrong.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
      description: What you expected to see instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps that reproduce it
      description: What you did, in order, from a fresh start of vtium if you can.
      placeholder: |
        1. Switch to VT 3, where vtium runs, and log in.
        2. Switch to the desktop with Ctrl+Alt+F1.
        3. Switch back with Ctrl+Alt+F3. The screen stays black.
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Which VT and which display
      description: The VT it happened on, and the display or displays vtium drew on, with how each is connected.
      placeholder: VT 3, a 27-inch monitor on DisplayPort through a hub
    validations:
      required: true
  - type: textarea
    id: report
    attributes:
      label: The report from vtium-config report
      description: |
        Run `vtium-config report --save` on the machine where it happened. It writes a file named like `vtium-report-20261103-203044.txt` in the current directory and prints its name. If the defect forced a reboot, add `--previous-boot` to read the log of the boot before. For the kernel's display state, and for the whole journal where your user is not in the systemd-journal group, run `sudo vtium-config report > vtium-report.txt` instead: as root the report writes no file itself, so your own shell saves what it prints. The report leaves out the machine's name and each monitor's serial number, but it can still name user accounts, in its logs, in `vtium console status` and in `vtium.conf`, and its logs' times show your time zone, so read the file over before you share it. Then drag the file into this box to attach it, or paste its text here. If your vtium-config has no `report` command, give the vtium version, the features it was built with, your graphics card and driver, and the output of `journalctl -b -u vtium@tty3.service` for the VT it happened on.
    validations:
      required: true
