# vtium's config for the review of the login picture: the review's
# vtium.conf beside this file, plus a login-image line. make vt-login
# CONF=tools/vt/config/login-picture.conf names it, and run-vt.sh copies it
# into a directory of root's in place of vtium.conf, under the same checks,
# since vtium reads a vtium.conf only when root owns it (ADR-1403 D3).
# Display settings belong to one machine (mode=, font-size=); pass them in
# DEMO_ARGS instead (docs/vt-review.md).

# The ligatures page, 53-ligatures, shows programming ligatures. vtium draws
# them only while font-ligatures is on, and font-ligatures is off by default.
#
# References:
# - ADR-1308 D8: the option that turns programming ligatures on.
font-ligatures=on

# The picture shows behind the login prompt, fitted inside the screen with
# bands of the default background, because no login-image-fit line names
# another fit. It is a 5120×2880 wallpaper that Plasma installs. Any large
# PNG or JPEG file that root can read will do: name its absolute path here.
#
# References:
# - ADR-1100 D17: the login-image keys, and contain, the default fit.
login-image=/usr/share/wallpapers/Next/contents/images/5120x2880.png
