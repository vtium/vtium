# vtium's config for the VT review: run-vt.sh copies this file into a
# directory of root's, since vtium reads a vtium.conf only when root owns it
# (ADR-1403 D3), and passes that directory as --configdir, so the system's
# config is never read and every run starts from vtium's defaults. Display
# settings belong to one machine (mode=, font-size=); pass them in DEMO_ARGS
# instead (docs/vt-review.md).
