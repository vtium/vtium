# vtium's config for the VT review: run-vt.sh copies this file into a
# directory of root's, since vtium reads a vtium.conf only when root owns it
# (ADR-1403 D3), and passes that directory as --configdir, so the system's
# config is never read and every run starts from vtium's defaults, apart from
# the settings below. Display settings belong to one machine (mode=,
# font-size=); pass them in DEMO_ARGS instead (docs/vt-review.md).

# The ligatures page, 53-ligatures, shows programming ligatures. vtium draws
# them only while font-ligatures is on, and font-ligatures is off by default.
#
# References:
# - ADR-1308 D8: the option that turns programming ligatures on.
font-ligatures=on
