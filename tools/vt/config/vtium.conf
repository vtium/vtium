# vtium's config for the VT review: run-vt.sh copies this file into a
# directory of root's, since vtium reads a vtium.conf only when root owns it
# (ADR-1403 D3), and passes that directory as --configdir, so the system's
# config is never read and every run starts from vtium's defaults, apart from
# the settings below. Display settings belong to one machine, so this file
# sets none. run-vt.sh carries the mode= and use-original-mode lines of the
# machine's /etc/vtium/vtium.conf into its copy, so vtium runs each display
# at the mode the machine sets. Pass any other display setting, such as
# font-size=, in DEMO_ARGS (docs/vt-review.md).

# The ligatures page, 53-ligatures, shows programming ligatures. vtium draws
# them only while font-ligatures is on, and font-ligatures is off by default.
#
# References:
# - ADR-1308 D8: the option that turns programming ligatures on.
font-ligatures=on

# The Looks sizes page, 74-looks-sizes, judges vtium-config's live trial of
# a size. vtium-config asks the console for the grid that the size gives,
# and vtium honours that request only while allow-window-ops is on, which is
# off by default. vtium reads the key only when it starts, so it is on for
# the whole pass. No other page sends the request.
#
# References:
# - ADR-1201 D4, "Sizes, live on a vtium console": the trial of a size and
#   the grid request it sends.
allow-window-ops
