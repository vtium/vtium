# vtium's config for login.guide. run-vt.sh gives vtium this file in place of
# the review's tools/vt/config/vtium.conf whenever it runs the guide beside
# it, login.guide, and copies it into a directory of root's first, as it
# copies the review's file, since vtium reads a vtium.conf only when root
# owns it (ADR-1403 D3).
#
# The picture is the Arch Linux logo, 256×256 pixels, which Arch's filesystem
# package installs. Any PNG or JPEG file that root can read will do: name its
# absolute path here.
#
# References:
# - ADR-1100 D17: the login-image keys, and cover, the fit the guide checks.
login-image=/usr/share/pixmaps/archlinux-logo.png
login-image-fit=cover
