# The vtium.conf of pointer-file.guide's third run, steps 5 and 6: vtium's
# defaults, with the pointer's pictures from Adwaita's cursor theme, which
# the adwaita-cursors package installs. make vt-check
# CONF=tools/vt/checks/pointer-file-adwaita.conf names it in place of the
# review's tools/vt/config/vtium.conf. No pointer-size line is set, so vtium
# picks the size of Adwaita's pictures nearest the character cell's height.
#
# References:
# - ADR-1309 D2: a folder that holds a cursors folder is a cursor theme.
# - ADR-1309 D6: which of the theme's sizes draws.
pointer-theme=/usr/share/icons/Adwaita
