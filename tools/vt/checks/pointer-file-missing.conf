# The vtium.conf of pointer-file.guide's fourth run, step 7: vtium's
# defaults, with a pointer-theme line that names a path where nothing is.
# make vt-check CONF=tools/vt/checks/pointer-file-missing.conf names it in
# place of the review's tools/vt/config/vtium.conf. vtium logs one warning
# and draws its own pointer pictures.
#
# References:
# - ADR-1309 D2: anything at the path but an SVG file or a cursor theme's folder draws vtium's own pictures.
# - ADR-1309 D9: the one warning vtium logs for an unusable path.
pointer-theme=/usr/share/vtium/no-such-pointers.svg
