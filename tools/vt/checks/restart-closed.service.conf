# restart.guide's drop-in for vtium-dev@ttyN.service: step 5 installs it as
# /run/systemd/system/vtium-dev@ttyN.service.d/restart-guide.conf, so that
# this one unit runs vtium with the configuration directory
# /run/vtium-restart-guide, which holds restart-closed.conf as its
# vtium.conf. /etc/vtium stays as it is, and every other vtium on the machine
# reads it. Step 8, the guide's cleanup and a reboot each remove the drop-in.
# Its ExecStart= is make vt-install's with --configdir added (test_vt.py
# checks the two agree).
[Service]
ExecStart=
ExecStart=/usr/local/bin/vtium-dev --vt=%I --no-switchvt --configdir /run/vtium-restart-guide
