# The vtium.conf of pointer-file.guide's fifth run, steps 8 and 9: a look
# with a pointer theme of its own. The top level names vtium's own pointer
# file, and the look adwaita names Adwaita's cursor theme. The one head,
# console, uses that look, and the one rule sends every display to it, as
# the built-in configuration does. So the console draws Adwaita's pictures
# only when it takes the pointer theme from the head's look rather than from
# the top level. make vt-check CONF=tools/vt/checks/pointer-file-look.conf
# names it in place of the review's tools/vt/config/vtium.conf.
#
# References:
# - ADR-1205 D6: each look picks its pointer theme.
# - ADR-1309 D1: the pointer-theme key, which a look may set.
pointer-theme=/usr/share/vtium/pointers.svg

version = 1

[look adwaita]
pointer-theme = /usr/share/icons/Adwaita

[head console]
look = adwaita

[rules]
display * -> console
