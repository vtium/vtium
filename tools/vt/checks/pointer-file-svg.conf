# The vtium.conf of pointer-file.guide's second run, steps 3 and 4:
# vtium's defaults, with the pointer's pictures from vtium's own pointer
# file. make vt-check CONF=tools/vt/checks/pointer-file-svg.conf names it in
# place of the review's tools/vt/config/vtium.conf, and run-vt.sh copies it
# into a directory of root's, since vtium reads a vtium.conf only when root
# owns it. vtium reads the pointer file only when root owns it and every
# folder above it, so the guide reads the copy that a package installs in
# /usr/share/vtium, never the checkout's.
#
# References:
# - ADR-1309 D1: the pointer-theme key, an absolute path.
# - ADR-1309 D7: vtium's own shapes as /usr/share/vtium/pointers.svg.
pointer-theme=/usr/share/vtium/pointers.svg
