# The head file of restart.guide: vtium's shipped rules under policy =
# closed, with the one head not isolated, so every keyboard still types on
# the VT and still switches VTs. Step 6 installs it as /etc/vtium/heads.conf
# and step 9 removes it.
version = 1
policy = closed

[head console]
isolated = no

[rules]
display * -> console
input class:keyboard -> roaming
input class:mouse -> roaming
input class:touchpad -> roaming
input class:touchscreen -> roaming
input class:trackball -> roaming
input class:pointingstick -> roaming
input class:key -> roaming
input * -> ignore
