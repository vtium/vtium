# The vtium.conf of restart.guide: vtium's shipped rules under policy =
# closed, with the one head not isolated, so every keyboard still types on
# the VT and still switches VTs. Step 5 copies it into
# /run/vtium-restart-guide, a directory of root's, and gives
# vtium-dev@ttyN.service a drop-in (restart-closed.service.conf) that names
# that directory as vtium's configuration directory; step 8 removes both.
version = 1
policy = closed

[head console]
isolated = no

[rules]
display * -> console
input class:keyboard -> roaming
input class:mouse -> roaming
input class:touchpad -> roaming
input class:touchscreen -> roaming
input class:trackball -> roaming
input class:pointingstick -> roaming
input class:key -> roaming
input * -> ignore
