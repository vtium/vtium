# Tier 2 for vtium: the renderer draws known screens into memory, and each
# is compared pixel for pixel with its golden. A workspace member, so cargo
# test builds and checks the harness; `make tier2` judges every screen
# against the goldens in this tree.
[package]
name = "vtium-tier2"
description = "Tier 2: the renderer's screens against the C reference's pixel goldens"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
vtium-term.workspace = true
# the small displays draw their PSF fonts through the PSF loader, which the
# console leaves out
vtium-font = { workspace = true, features = ["psf"] }
vtium-render.workspace = true
# generates the test PSF fonts' glyphs through the engine the helper runs,
# for the screens drawn from sets
vtium-vitrify = { path = "../../crates/vtium-vitrify" }
# the small displays' PSF fonts, built in memory
vtium-testfont = { path = "../testfont" }
# provenance.tsv's reading and checks, which tier 1's copies use too
vtium-conformance = { path = "../conformance" }
