# Tier 2 for vtium: the renderer draws known screens into memory, and each
# is compared pixel for pixel with its golden. A workspace member, so cargo
# test builds and checks the harness; `make tier2` judges every screen
# against the goldens in this tree.
[package]
name = "vtium-tier2"
description = "Tier 2: the renderer's screens against the pixel goldens"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
# the picture screens feed sixel and kitty strings through the terminal's
# own handlers, and the renderer draws their pictures
vtium-term = { workspace = true, features = ["images", "bidi"] }
# the small displays draw their PSF fonts through the PSF loader, which the
# console leaves out
vtium-font = { workspace = true, features = ["psf"] }
vtium-render = { workspace = true, features = ["images", "bidi"] }
# generates the test PSF fonts' glyphs through the engine the helper runs,
# for the screens drawn from sets
vtium-config = { path = "../../crates/vtium-config" }
# the small displays' PSF fonts, built in memory
vtium-testfont = { path = "../testfont" }
# the PNG writer of vtium-config's test font writer, which the ink test
# font includes
miniz_oxide = "0.8.9"
# the head file's trust, for the notice of a head file with errors
vtium-settings.workspace = true
# the console's own overlay, which draws the notices and the on-screen
# display, and the words of its notices and of the OSD's line
vtium = { path = "../../crates/vtium", features = ["bidi"] }
# the GL context the GPU path's screens draw on, Mesa's llvmpipe, which the
# binary's adapter joins to vtium-render's Gl trait
vtium-platform = { path = "../../crates/vtium-platform", optional = true }

[features]
# the GPU path's screens, drawn on Mesa's llvmpipe and judged against the
# CPU path's (ADR-1303 D1); off by default, so a workspace build keeps
# vtium-render without its GPU path, as the minspec build has it. `make
# tier2` turns it on
gpu = ["vtium-render/gpu", "vtium/gpu", "vtium-platform/gpu", "dep:vtium-platform"]
