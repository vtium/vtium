# Tier 1 for vtium: vtium-replay meets the replay interface, and
# conformance judges it against the goldens and probes copied here from the
# C reference. A workspace member, so cargo test builds and checks it.
[package]
name = "vtium-conformance"
description = "The replay interface over vtium-term, and the runner that judges it against the C reference's goldens"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
vtium-term.workspace = true
# the replay interface's grammar and the probes' patterns are regular
# expressions, with no backreference or lookaround
regex = { version = "1.12", default-features = false, features = ["std", "unicode"] }
