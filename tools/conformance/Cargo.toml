# Tier 1 for vtium: vtium-replay meets the C reference's replay interface
# (libtsm's test/conformance/INTERFACE.md), and conformance judges it
# against the C reference's goldens at a pinned commit. A workspace member,
# so cargo test builds and checks it; reading the goldens needs a libtsm
# checkout, which only the conformance command and CI's conformance job use.
[package]
name = "vtium-conformance"
description = "The replay interface over vtium-term, and the runner that judges it against the C reference's goldens"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
vtium-term.workspace = true
