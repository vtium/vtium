# The demonstration set: vtium's test card, drawn by the renderer in memory
# for each display profile into docs/specimens/, and judged against what is
# committed there (vtium/vtium#142).
[package]
name = "vtium-specimens"
description = "The test card drawn per display profile, and its check"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
# Always with right-to-left text (ADR-1004): the test card holds a Hebrew
# and an Arabic line, and the specimens show them as the vtium package draws
# them, in the order the bidirectional algorithm gives. With the feature on
# here, make specimens, make specimens-check, cargo test --workspace and
# cargo test --workspace --all-features all draw the same pixels; without
# it, --all-features alone would turn it on and the committed drawings
# would differ from the test's (the maintainer's decision, 2026-11-06).
vtium-term = { workspace = true, features = ["bidi"] }
vtium-font.workspace = true
vtium-render.workspace = true
# generates the desktop frit's glyphs through the engine the helper runs
vtium-config = { path = "../../crates/vtium-config" }
# deflates the PNGs written and inflates the ones checked; vtium-font
# already links this version
miniz_oxide = "0.8.9"
# the message bars' screen: the console's overlay, through the overlay
# screens and notice words tier 2 draws
vtium-tier2 = { path = "../tier2" }
