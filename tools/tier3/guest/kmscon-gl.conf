# vtium config for gl-1280x800, which draws on vtium's GPU path: the C
# reference's kmscon-gl.conf, which drew with drm3d and gltex, with
# display-dpi added.
# As kmscon.conf: blinking off, the render timer logging its figures, which
# draws nothing, for the benchmark screens, and the density that draws
# DejaVu Sans Mono at 16 points in the C reference's 10x19 cell, so the
# variant draws the grid 2d-1280x800 draws.
font-engine=pango
font-name=DejaVu Sans Mono
font-size=16
no-blink
hwaccel
render-timer=log
display-dpi=86
