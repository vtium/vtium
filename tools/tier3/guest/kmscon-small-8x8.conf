# vtium config for tier 3's 2d-320x240-psf8 variant: minspec's display floor
# (vtium/vtium#75), 320x240 in tools/testfont's 8x8 PSF2 font, 40 by 30
# cells. font-size=8 draws the font at its own size: at 320x240 the default
# size is 16, which would double it to 20 by 15 cells. Blinking is off so a
# capture does not depend on when it was taken; the render timer logs its
# figures.
font-engine=psf
font-name=/usr/local/share/tier3-fonts/vtium-test-8x8.psf
font-size=8
no-blink
render-timer=log
