# vtium config for tier 3's 2d-640x480-psf16 variant: 640x480 in
# tools/testfont's 8x16 PSF1 font, 80 by 30 cells, the size the default
# font-size picks at 640x480 (vtium/vtium#75). Blinking is off so a capture
# does not depend on when it was taken; the render timer logs its figures.
font-engine=psf
font-name=/usr/local/share/tier3-fonts/vtium-test-8x16.psf
no-blink
render-timer=log
