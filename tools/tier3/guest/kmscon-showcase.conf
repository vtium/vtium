# vtium config for tier 3's showcase-1920x1080 variant (t3_showcase.py,
# ADR-1502 D6): the frit showcase-iosevka at 96 DPI. The frits set their own
# size and state their cells, and no font-size is set here, since a
# configured font-size makes the console ignore a frit's cell and ask the
# helper for it (ADR-1200 D17). The fonts scene switches the console to
# its other frits with OSC 50, which allow-font-ops allows by default.
# Blinking is off so a capture does not depend on when it was taken.
font-name=showcase-iosevka
display-dpi=96
no-blink
