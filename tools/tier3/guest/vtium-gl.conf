# vtium config for gl-1280x800, which draws on vtium's GPU path.
# As vtium.conf: blinking off, the render timer logging its figures, which
# draws nothing, for the benchmark screens, and the density that draws
# DejaVu Sans Mono at 16 points in a 10x19 cell, so the
# variant draws the grid 2d-1280x800 draws.
font-engine=pango
font-name=DejaVu Sans Mono
font-size=16
no-blink
hwaccel
render-timer=log
display-dpi=86
