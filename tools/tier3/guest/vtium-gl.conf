# vtium config for gl-1280x800, which draws on vtium's GPU path.
# As vtium.conf: blinking off, the render timer logging its figures, which
# draws nothing, for the benchmark screens, and tier 3's text font set, the
# frit tier3-text, at 16 points at the density that draws DejaVu Sans Mono
# in a 10x19 cell, so the variant draws the grid 2d-1280x800 draws.
font-name=tier3-text
font-size=16
no-blink
hwaccel
render-timer=log
display-dpi=86
