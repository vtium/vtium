# vtium config for tier 3's images-640x480 variant: the configuration of
# kmscon-small-8x16.conf, 640x480 in the set built from tools/testfont's
# 8x16 PSF1 font, 80 by 30 cells, with blinking off and the render timer
# logging, and two display buffers. A build with images keeps three unless
# told otherwise (ADR-1401 D2), and the render timer's damage covers what a
# frame drew into its buffer, as old as the display's buffers are many, so
# img-tmux-pane's damage per frame counts two frames' changes, not three.
font-engine=psf
font-name=/usr/local/share/tier3-fonts/vtium-test-8x16.psf
no-blink
render-timer=log
display-buffers=2
