# vtium config for tier 3 runs on the 2D path (drm2d with bbulk), the C
# reference's kmscon.conf with display-dpi added.
# Blinking is off so a capture does not depend on when it was taken. The
# render timer logs its figures, which draws nothing, for the benchmark screens.
# vtium draws font-size in points at the display's density (ADR-1200 D17),
# where the C reference drew 16 as a 16-pixel em at a fixed 72 DPI. At 86
# DPI, 16 points are 19 pixels, so DejaVu Sans Mono draws in the C
# reference's 10x19 cell and every screen keeps the C reference's grid.
font-engine=pango
font-name=DejaVu Sans Mono
font-size=16
no-blink
render-timer=log
display-dpi=86
