# Tier 3's valid closed head file for the guest with no display device
# (t3_heads.py): one head, every display and every keyboard on it. With no
# display at the start, vtium holds its VT and waits for one, past
# display-wait (ADR-1401 D8).
version = 1
policy = closed
[head console]
[rules]
display * -> console
input class:keyboard -> console
