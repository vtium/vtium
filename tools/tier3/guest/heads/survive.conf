# Tier 3's head file for sessions that survive a vtium restart (t3_heads.py,
# ADR-1401 D13): one head, every display and every keyboard on it, under a
# closed policy, so a crash brings vtium back on its VT and no getty. Its
# second console keeps a login prompt nobody uses.
version = 1
policy = closed
[head console]
consoles = 2
[rules]
display * -> console
input class:keyboard -> console
