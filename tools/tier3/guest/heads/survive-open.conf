# Tier 3's head file for sessions on a console the user opened, which
# survive a vtium restart (t3_heads.py "opened-survives", ADR-1401 D13): one
# head, every display and every keyboard on it, under an open policy, so
# key-console-open opens a console. The head opens one console at its
# start, and the check opens the second.
version = 1
policy = open
[head console]
[rules]
display * -> console
input class:keyboard -> console
