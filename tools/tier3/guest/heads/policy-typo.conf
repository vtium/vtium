# Tier 3's head file whose policy line holds a misspelled value (t3_heads.py).
# vtium cannot read the line `policy = opne`, so it counts the file as closed
# and broken: the whole file drops, though without that line the head desk
# would run with every keyboard roaming, so nothing runs, no login starts,
# and the boot display shows the panic screen (ADR-1401 D3, D7). The line
# `color = amber` above it is neither top-level key, an error of its own,
# which the panic screen lists after the policy line's error, though it
# comes first in the file.
version = 1
color = amber
policy = opne
[head desk]
[rules]
display * -> desk
input * -> roaming
