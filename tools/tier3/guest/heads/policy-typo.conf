# Tier 3's flow whose policy line holds a misspelled value (t3_heads.py).
# vtium cannot read the line `policy = opne`, so it counts the file as closed
# and broken: every section drops, so nothing runs, no login starts, and the
# boot display shows the panic screen (ADR-1401 D3, D7; ADR-1403 D3). The
# line `version = 2` above it names a version vtium does not know, an error
# of its own, which the panic screen lists after the policy line's error,
# though it comes first in the file.
version = 2
policy = opne
[head desk]
[rules]
display * -> desk
input * -> roaming
