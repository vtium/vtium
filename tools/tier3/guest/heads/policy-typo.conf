# Tier 3's flow whose policy line holds a misspelled value (t3_heads.py).
# vtium cannot read the line `policy = opne`, so it counts the file as closed
# and broken: every section drops, though without that line the head desk
# would run with every keyboard roaming, so nothing runs, no login starts,
# and the boot display shows the panic screen (ADR-1401 D3, D7; ADR-1403
# D3).
version = 1
policy = opne
[head desk]
[rules]
display * -> desk
input * -> roaming
