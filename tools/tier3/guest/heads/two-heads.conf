# Tier 3's valid open flow with two heads (t3_heads.py), one on each output
# of the guest's card: desk on the first in the 8x16 test font, panel on the
# second in the 8x8 one, each font the frit its look names in
# /etc/vtium/fonts (guest/frits/desk.vtfrit, panel.vtfrit). Keyboards roam,
# so they type into the active head, desk, where the boot display is.
version = 1
policy = open
[look desk]
font-name = desk
[look panel]
font-name = panel
[head desk]
look = desk
[head panel]
look = panel
[rules]
display connector:*/Virtual-1 -> desk
display connector:*/Virtual-2 -> panel
input class:keyboard -> roaming
