# Tier 3's kiosk (t3_heads.py), docs/heads/kiosk.conf on the guest's devices:
# one head on every display, and the one keyboard in the hub's port 3.2, the
# boot's USB keyboard, which claims it. Its login is the default, so the
# scenario can log in. Under closed the head is isolated, so the claimed
# keyboard's VT keys reach its session as keys, and every other keyboard,
# the PS/2 one and any plugged in later, is ignored.
version = 1
policy = closed
[head kiosk]
consoles = 1
[rules]
display * -> kiosk
input path:pci-0000:15:00.0-usb-0:3.2 -> kiosk
