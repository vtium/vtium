# Tier 3's partly broken open head file (t3_heads.py): its first rule sends
# every display to a head the file does not declare, which drops that rule
# alone, so the start runs the rest and shows
# "config partly invalid, running what's valid" (ADR-1401 D7).
version = 1
policy = open
[head desk]
[rules]
display * -> desc
display * -> desk
