# Tier 3's closed head file whose one head has no display (t3_heads.py): its
# rule names a connector the guest's card does not have, so no rule matches
# the guest's display. The file is valid and closed, so vtium leaves that
# display blank and logs that it stays off (ADR-1401 D3, D9). No rule places
# an input, so under closed every keyboard is ignored.
version = 1
policy = closed
[head desk]
[rules]
display connector:*/HDMI-A-9 -> desk
