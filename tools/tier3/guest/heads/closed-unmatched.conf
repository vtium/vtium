# Tier 3's closed head file whose one head has no display (t3_heads.py): its
# rule names a connector the guest's card does not have, so the guest's
# display is off, and the display guard lights it for the notice
# "vtium: no display for any head" alone (ADR-1401 D9). No rule places an
# input, so under closed every keyboard is ignored.
version = 1
policy = closed
[head desk]
[rules]
display connector:*/HDMI-A-9 -> desk
