# vtium config for tier 3's 2d-320x240-psf8 variant: minspec's display floor
# (vtium/vtium#75), 320x240 in the set built from tools/testfont's 8x8 PSF2
# font (frits/vtium-test-8x8.vtfrit), 40 by 30 cells. No font size is set:
# where 16-pixel cells would leave fewer than 80 by 25, the default size is
# the font's own (vtium/vtium#118). Blinking is off so a capture does not
# depend on when it was taken; the render timer logs its figures.
font-engine=psf
font-name=/usr/local/share/tier3-fonts/vtium-test-8x8.psf
no-blink
render-timer=log
