# vtium config for the tier 3 variant with large cells: the 2D path (drm2d
# with bbulk) at 32 points.
# Blinking is off so a capture does not depend on when it was taken. The
# render timer logs its figures, which draws nothing, for the benchmark screens.
# The font is tier 3's text font set, the frit tier3-text, as in vtium.conf.
# At 86 DPI, as in vtium.conf, 32 points are 38 pixels, which makes the
# cell 20x38.
font-name=tier3-text
font-size=32
no-blink
render-timer=log
display-dpi=86
