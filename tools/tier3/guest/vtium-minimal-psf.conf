# kmscon config for tier 3's 2d-potato-min-psf variant: the minimal build
# (ADR-103) with a PSF console font, kbd's default 8x16, which takes both
# settings (README.md, Minimal build). Blinking is off so a capture does not
# depend on when it was taken; the render timer logs its figures.
font-engine=psf
font-name=/usr/share/kbd/consolefonts/default8x16.psfu.gz
no-blink
render-timer=log
