# vtium config for tier 3's 2d-640x480-frit and 2d-640x480-frit-held
# variants: 640x480, its font the frit dejavu-mono (frits/dejavu-mono.vtfrit),
# which names the guest's DejaVu Sans Mono and is generated at run time by
# the helper (ADR-1301 D2), in the display's 8x16 cell (#145), 80 by 30.
# Blinking is off so a capture does not depend on when it was taken; the
# render timer logs its figures.
font-name=dejavu-mono
no-blink
render-timer=log
