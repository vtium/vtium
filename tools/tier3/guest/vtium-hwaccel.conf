# vtium config for tier 3 runs on the GPU path: vtium.conf with hwaccel
# on, so the head draws through its GL context on the guest's render node
# (ADR-1303). Everything else is vtium.conf's: blinking off, the render
# timer logging its figures, and DejaVu Sans Mono at 16 points at 86 DPI,
# the 10x19 cell, so the variant draws the grid 2d-1280x800 draws, and
# each of its screens is judged by 2d-1280x800's capture of the same screen
# in the same run.
font-engine=pango
font-name=DejaVu Sans Mono
font-size=16
no-blink
hwaccel
render-timer=log
display-dpi=86
