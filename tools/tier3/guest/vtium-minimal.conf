# kmscon config for tier 3's 2d-potato-min variant: the minimal build
# (ADR-103), whose font backends are unifont, psf and the built-in 8x16. With
# font-engine unset, unifont draws. Blinking is off so a capture does not
# depend on when it was taken; the render timer logs its figures for the
# benchmark screens.
no-blink
render-timer=log
