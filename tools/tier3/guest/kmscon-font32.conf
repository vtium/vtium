# vtium config for the tier 3 variant with large cells: the 2D path (drm2d
# with bbulk) at 32 points, the C reference's kmscon-font32.conf with
# display-dpi added.
# Blinking is off so a capture does not depend on when it was taken. The
# render timer logs its figures, which draws nothing, for the benchmark screens.
# At 86 DPI, as in kmscon.conf, 32 points are 38 pixels, the height of the
# C reference's 19x38 cell.
font-engine=pango
font-name=DejaVu Sans Mono
font-size=32
no-blink
render-timer=log
display-dpi=86
