# vtium config for tier 3's sandbox-off-640x480 variant: the helpers'
# seccomp filters and landlock domains turned off. Its font is the frit
# dejavu-mono (frits/dejavu-mono.vtfrit), which the font helper generates at
# run time, so the font helper starts; its img-png screen starts the image
# helper. Each helper's line about the setting then goes to the console's
# log once a boot.
# Blinking is off so a capture does not depend on when it was taken.
font-name=dejavu-mono
no-blink
helper-sandbox = off
