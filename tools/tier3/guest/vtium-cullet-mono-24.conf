# vtium config for tier 3's cullet-mono-24 variant (t3_fonts.py): the outline
# set cullet-mono. At display-dpi=72 a point is a pixel, so font-size=24 gives
# a cell 24 pixels high. Blinking is off so a capture does not depend on when
# it was taken.
font-name=cullet-mono
display-dpi=72
font-size=24
no-blink
