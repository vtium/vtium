[workspace]
resolver = "3"
members = ["crates/*", "tools/conformance", "tools/cover-tables", "tools/man", "tools/site", "tools/specimens", "tools/tier1-shots", "tools/tier2", "tools/tier3/probes", "tools/tui-review"]

[workspace.package]
version = "0.1.0-alpha.12"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/vtium/vtium"
authors = ["Aaron Bockelie"]

[workspace.dependencies]
vtium-parse = { path = "crates/vtium-parse" }
vtium-term = { path = "crates/vtium-term" }
vtium-image = { path = "crates/vtium-image" }
vtium-font = { path = "crates/vtium-font" }
vtium-render = { path = "crates/vtium-render" }
vtium-platform = { path = "crates/vtium-platform" }
vtium-settings = { path = "crates/vtium-settings" }
vtium-devices = { path = "crates/vtium-devices" }
vtium-broker-protocol = { path = "crates/vtium-broker-protocol" }
vtium-font-helper = { path = "crates/vtium-font-helper" }
vtium-config-widgets = { path = "crates/vtium-config-widgets" }
vtium-config-core = { path = "crates/vtium-config-core" }
vtium-config-tab-help = { path = "crates/vtium-config-tab-help" }
vtium-config-tab-settings = { path = "crates/vtium-config-tab-settings" }
vtium-config-tui = { path = "crates/vtium-config-tui" }
vtium-config-tab-flow = { path = "crates/vtium-config-tab-flow" }
vtium-config-tab-effects = { path = "crates/vtium-config-tab-effects" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# The sprite and font tests sample every cell size; optimised, they take
# seconds instead of minutes.
[profile.dev.package.vtium-font]
opt-level = 2

# vtium-config's scenario tests press every key in every state of the TUI,
# about 77,000 transitions, and draw each node's frame at three grid sizes.
# Built at opt-level 2, the scenarios binary runs in about 90 s instead of
# 300 s.
[profile.dev.package.vtium-config]
opt-level = 2

# The same scenarios call the font helper's code, which vtium-font-helper
# holds, so it is built at the same level.
[profile.dev.package.vtium-font-helper]
opt-level = 2

# The same scenarios draw every frame through the TUI's toolkit, which
# vtium-config-widgets holds, so it is built at the same level too.
[profile.dev.package.vtium-config-widgets]
opt-level = 2

# The same scenarios edit drafts and run the commands through the
# configuration's modules, which vtium-config-core holds, so it is built at
# the same level too.
[profile.dev.package.vtium-config-core]
opt-level = 2

# The Help tab's screen tests lay out every topic at both sizes, and its
# crate is built at the level of the toolkit it draws with.
[profile.dev.package.vtium-config-tab-help]
opt-level = 2

# The Settings tab's screen tests draw every section at two sizes on two
# machines, so the tab is built at the same level as the toolkit it draws
# with.
[profile.dev.package.vtium-config-tab-settings]
opt-level = 2

# The shell's tests drive the App through every tab and menu with both
# fixtures at two screen sizes, and draw each screen; built at the same
# level as the crates it draws through.
[profile.dev.package.vtium-config-tui]
opt-level = 2

# The Flow tab's screen tests lay the large machine's page out and draw
# it at each size, and its tests press every key of the tab's nodes on
# both machines, so the tab is built at the same level as the crates it
# draws through.
[profile.dev.package.vtium-config-tab-flow]
opt-level = 2

# The Effects tab's screen tests draw every screen at two sizes on two
# machines, the large one with 200 vtlooks, so the tab is built at the
# same level as the toolkit it draws with.
[profile.dev.package.vtium-config-tab-effects]
opt-level = 2

[profile.release]
lto = true
codegen-units = 1
panic = "abort"

# The minspec build: smallest binary for the small-machine standard.
[profile.minspec]
inherits = "release"
opt-level = "z"
strip = true

# The renderer's glyph loop and writes are built for speed inside the
# minspec build: the operator's decision on vtium/vtium#78.
[profile.minspec.package.vtium-render]
opt-level = 3
