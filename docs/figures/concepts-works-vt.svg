<svg xmlns="http://www.w3.org/2000/svg" width="960" height="740" viewBox="0 0 960 740" font-family="DejaVu Sans Mono, monospace">
<title>The life of vtium's VT, as a state machine</title>
<rect width="960" height="740" fill="#ffffff"/>
<defs>
<marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="#1f2933"/></marker>
</defs>
<!-- the start -->
<circle cx="36" cy="144" r="7" fill="#1f2933"/>
<line x1="43" y1="144" x2="62" y2="144" stroke="#1f2933" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="64" y="96" width="170" height="96" rx="10" fill="#ffffff" stroke="#2f6fb0" stroke-width="2"/>
<text x="149" y="120" font-size="14" text-anchor="middle" fill="#1f2933">starting</text>
<text x="149" y="140" font-size="12" text-anchor="middle" fill="#1f2933">reads vtium.conf,</text>
<text x="149" y="156" font-size="12" text-anchor="middle" fill="#1f2933">opens the VT,</text>
<text x="149" y="172" font-size="12" text-anchor="middle" fill="#1f2933">sends READY=1</text>
<!-- while vtium runs -->
<rect x="272" y="40" width="560" height="396" rx="14" fill="#eef0f2" stroke="#9aa5b1" stroke-width="1"/>
<text x="290" y="64" font-size="14" fill="#1f2933">while vtium runs</text>
<line x1="234" y1="144" x2="298" y2="144" stroke="#1f2933" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="253" y="136" font-size="12" text-anchor="middle" fill="#1f2933">open</text>
<rect x="300" y="96" width="170" height="96" rx="10" fill="#ffffff" stroke="#2f6fb0" stroke-width="2"/>
<text x="385" y="120" font-size="14" text-anchor="middle" fill="#1f2933">waiting</text>
<text x="385" y="140" font-size="12" text-anchor="middle" fill="#1f2933">for its VT</text>
<text x="385" y="156" font-size="12" text-anchor="middle" fill="#1f2933">to be shown</text>
<line x1="470" y1="144" x2="598" y2="144" stroke="#1f2933" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="534" y="120" font-size="12" text-anchor="middle" fill="#1f2933">the VT is shown:</text>
<text x="534" y="136" font-size="12" text-anchor="middle" fill="#1f2933">SIGUSR1</text>
<rect x="600" y="96" width="170" height="96" rx="10" fill="#ffffff" stroke="#2f6fb0" stroke-width="2"/>
<text x="685" y="120" font-size="14" text-anchor="middle" fill="#1f2933">shown</text>
<text x="685" y="140" font-size="12" text-anchor="middle" fill="#1f2933">vtium draws and</text>
<text x="685" y="156" font-size="12" text-anchor="middle" fill="#1f2933">reads the input</text>
<line x1="740" y1="192" x2="740" y2="298" stroke="#1f2933" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="748" y="232" font-size="12" fill="#1f2933">a switch</text>
<text x="748" y="248" font-size="12" fill="#1f2933">away:</text>
<text x="748" y="264" font-size="12" fill="#1f2933">SIGUSR2</text>
<rect x="600" y="300" width="170" height="96" rx="10" fill="#ffffff" stroke="#2f6fb0" stroke-width="2"/>
<text x="685" y="324" font-size="14" text-anchor="middle" fill="#1f2933">releasing</text>
<text x="685" y="344" font-size="12" text-anchor="middle" fill="#1f2933">the input and</text>
<text x="685" y="360" font-size="12" text-anchor="middle" fill="#1f2933">every display</text>
<text x="685" y="376" font-size="12" text-anchor="middle" fill="#1f2933">go to sleep</text>
<line x1="600" y1="348" x2="472" y2="348" stroke="#1f2933" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="536" y="322" font-size="12" text-anchor="middle" fill="#1f2933">all asleep:</text>
<text x="536" y="338" font-size="12" text-anchor="middle" fill="#1f2933">vtium lets go</text>
<rect x="300" y="300" width="170" height="96" rx="10" fill="#ffffff" stroke="#2f6fb0" stroke-width="2"/>
<text x="385" y="324" font-size="14" text-anchor="middle" fill="#1f2933">away</text>
<text x="385" y="344" font-size="12" text-anchor="middle" fill="#1f2933">another VT shown;</text>
<text x="385" y="360" font-size="12" text-anchor="middle" fill="#1f2933">the sessions</text>
<text x="385" y="376" font-size="12" text-anchor="middle" fill="#1f2933">run on</text>
<path d="M 385 300 L 385 252 L 640 252 L 640 194" fill="none" stroke="#1f2933" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="400" y="224" font-size="12" fill="#1f2933">a switch back: SIGUSR1;</text>
<text x="400" y="240" font-size="12" fill="#1f2933">displays set up again</text>
<!-- the end -->
<line x1="410" y1="436" x2="410" y2="488" stroke="#1f2933" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="418" y="466" font-size="12" fill="#1f2933">a reason to end</text>
<rect x="24" y="468" width="240" height="176" fill="#ffffff" stroke="#9aa5b1" stroke-width="1"/>
<text x="36" y="490" font-size="13" fill="#1f2933">why vtium ends</text>
<text x="36" y="512" font-size="12" fill="#2f6fb0">exit status 0:</text>
<text x="36" y="528" font-size="12" fill="#1f2933">SIGTERM or SIGINT;</text>
<text x="36" y="544" font-size="12" fill="#1f2933">oneshot sessions ended</text>
<text x="36" y="566" font-size="12" fill="#2f6fb0">exit status 1:</text>
<text x="36" y="582" font-size="12" fill="#1f2933">the VT hung up;</text>
<text x="36" y="598" font-size="12" fill="#1f2933">no display in time;</text>
<text x="36" y="614" font-size="12" fill="#1f2933">a session cannot start;</text>
<text x="36" y="630" font-size="12" fill="#1f2933">sessions end too fast</text>
<rect x="300" y="490" width="220" height="128" rx="10" fill="#ffffff" stroke="#2f6fb0" stroke-width="2"/>
<text x="410" y="514" font-size="14" text-anchor="middle" fill="#1f2933">ending</text>
<text x="410" y="534" font-size="12" text-anchor="middle" fill="#1f2933">switches back, if it</text>
<text x="410" y="550" font-size="12" text-anchor="middle" fill="#1f2933">switched at its start;</text>
<text x="410" y="566" font-size="12" text-anchor="middle" fill="#1f2933">leaves the sessions</text>
<text x="410" y="582" font-size="12" text-anchor="middle" fill="#1f2933">to the keeper;</text>
<text x="410" y="598" font-size="12" text-anchor="middle" fill="#1f2933">puts back text mode</text>
<!-- after the exit, under systemd -->
<path d="M 520 546 L 560 546" fill="none" stroke="#1f2933" stroke-width="1.5"/>
<path d="M 560 496 L 560 664" fill="none" stroke="#1f2933" stroke-width="1.5"/>
<line x1="560" y1="496" x2="698" y2="496" stroke="#1f2933" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="568" y="488" font-size="12" fill="#1f2933">exit 0</text>
<line x1="560" y1="576" x2="698" y2="576" stroke="#1f2933" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="568" y="568" font-size="12" fill="#1f2933">exit 1, open</text>
<line x1="560" y1="664" x2="698" y2="664" stroke="#1f2933" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="568" y="656" font-size="12" fill="#1f2933">exit 1, closed</text>
<rect x="700" y="470" width="244" height="52" fill="#ffffff" stroke="#9aa5b1" stroke-width="1"/>
<text x="822" y="492" font-size="13" text-anchor="middle" fill="#1f2933">the unit stops;</text>
<text x="822" y="510" font-size="13" text-anchor="middle" fill="#1f2933">its sessions hang up</text>
<rect x="700" y="550" width="244" height="52" fill="#ffffff" stroke="#9aa5b1" stroke-width="1"/>
<text x="822" y="572" font-size="13" text-anchor="middle" fill="#1f2933">a getty takes the VT</text>
<text x="822" y="590" font-size="13" text-anchor="middle" fill="#1f2933">from vtium-getty@</text>
<rect x="700" y="628" width="244" height="72" fill="#ffffff" stroke="#9aa5b1" stroke-width="1"/>
<text x="822" y="650" font-size="13" text-anchor="middle" fill="#1f2933">systemd starts vtium</text>
<text x="822" y="668" font-size="13" text-anchor="middle" fill="#1f2933">again, 5 starts in 10 s;</text>
<text x="822" y="686" font-size="13" text-anchor="middle" fill="#1f2933">past that, no login</text>
<text x="700" y="460" font-size="13" fill="#1f2933">then, under systemd:</text>
<!-- note -->
<text x="24" y="680" font-size="12" fill="#1f2933">With libseat, the seat manager's</text>
<text x="24" y="696" font-size="12" fill="#1f2933">enable and disable take the</text>
<text x="24" y="712" font-size="12" fill="#1f2933">place of SIGUSR1 and SIGUSR2.</text>
</svg>
