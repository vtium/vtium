<svg xmlns="http://www.w3.org/2000/svg" width="872" height="320" viewBox="0 0 872 320" font-family="DejaVu Sans Mono, monospace">
<title>A VT switch away from vtium and back</title>
<rect width="872" height="320" fill="#ffffff"/>
<text x="24" y="40" font-size="15" fill="#1f2933">time runs left to right</text>
<text x="24" y="127" font-size="14" fill="#1f2933">the display</text>
<rect x="200" y="108" width="200" height="28" fill="#2f6fb0"/>
<text x="300" y="127" font-size="14" text-anchor="middle" fill="#ffffff">vtium draws</text>
<rect x="400" y="108" width="240" height="28" fill="#fbecd0" stroke="#9aa5b1" stroke-width="1"/>
<text x="520" y="127" font-size="14" text-anchor="middle" fill="#1f2933">the other VT's owner</text>
<rect x="640" y="108" width="208" height="28" fill="#2f6fb0"/>
<text x="744" y="127" font-size="14" text-anchor="middle" fill="#ffffff">vtium draws</text>
<text x="24" y="171" font-size="14" fill="#1f2933">keys, pointer</text>
<rect x="200" y="152" width="200" height="28" fill="#2f6fb0"/>
<text x="300" y="171" font-size="14" text-anchor="middle" fill="#ffffff">to vtium</text>
<rect x="400" y="152" width="240" height="28" fill="#fbecd0" stroke="#9aa5b1" stroke-width="1"/>
<text x="520" y="171" font-size="14" text-anchor="middle" fill="#1f2933">to the other VT</text>
<rect x="640" y="152" width="208" height="28" fill="#2f6fb0"/>
<text x="744" y="171" font-size="14" text-anchor="middle" fill="#ffffff">to vtium</text>
<text x="24" y="83" font-size="14" fill="#1f2933">the session</text>
<rect x="200" y="64" width="648" height="28" fill="#3b8f5a"/>
<text x="524" y="83" font-size="14" text-anchor="middle" fill="#ffffff">keeps running in its pty throughout</text>
<line x1="400" y1="100" x2="400" y2="196" stroke="#1f2933" stroke-width="1.5" stroke-dasharray="5 4"/>
<line x1="640" y1="100" x2="640" y2="196" stroke="#1f2933" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="400" y="218" font-size="14" text-anchor="middle" fill="#1f2933">the user switches away</text>
<text x="400" y="244" font-size="13" text-anchor="middle" fill="#1f2933">vtium finishes its frame,</text>
<text x="400" y="262" font-size="13" text-anchor="middle" fill="#1f2933">gives up the display</text>
<text x="400" y="280" font-size="13" text-anchor="middle" fill="#1f2933">and stops reading input</text>
<text x="640" y="218" font-size="14" text-anchor="middle" fill="#1f2933">the user switches back</text>
<text x="640" y="244" font-size="13" text-anchor="middle" fill="#1f2933">vtium takes the display,</text>
<text x="640" y="262" font-size="13" text-anchor="middle" fill="#1f2933">sets its modes and</text>
<text x="640" y="280" font-size="13" text-anchor="middle" fill="#1f2933">redraws the whole screen</text>
</svg>
