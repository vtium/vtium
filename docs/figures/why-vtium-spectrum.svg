<svg xmlns="http://www.w3.org/2000/svg" width="872" height="460" viewBox="0 0 872 460" font-family="DejaVu Sans Mono, monospace">
<title>The displays vtium draws on, from a 320x240 panel to a 2560x1440 monitor</title>
<rect width="872" height="460" fill="#ffffff"/>
<text x="24" y="36" font-size="15" fill="#1f2933">one console, from a small panel to a large monitor</text>
<text x="24" y="58" font-size="13" fill="#1f2933">each display drawn to scale, one pixel here for twelve on the display</text>
<g stroke="#2f6fb0" stroke-width="2" fill="#e6eef7">
<rect x="58" y="180" width="27" height="20"/>
<rect x="170" y="160" width="53" height="40"/>
<rect x="253" y="136" width="114" height="64"/>
<rect x="384" y="110" width="160" height="90"/>
<rect x="590" y="80" width="213" height="120"/>
</g>
<g font-size="14" text-anchor="middle" fill="#1f2933">
<text x="72" y="226">320x240</text>
<text x="196" y="226">640x480</text>
<text x="310" y="226">1366x768</text>
<text x="464" y="226">1920x1080</text>
<text x="696" y="226">2560x1440</text>
</g>
<g font-size="12" text-anchor="middle" fill="#1f2933">
<text x="72" y="246">a small panel</text>
<text x="72" y="264">8x8 cells</text>
<text x="72" y="282">40 x 30</text>
<text x="72" y="300">5.8 MiB</text>
<text x="196" y="246">an old monitor</text>
<text x="196" y="264">8x16 cells</text>
<text x="196" y="282">80 x 30</text>
<text x="196" y="300">7.8 MiB</text>
<text x="310" y="246">a laptop</text>
<text x="310" y="264">8x16 cells</text>
<text x="310" y="282">170 x 48</text>
<text x="310" y="300">12.1 MiB</text>
<text x="464" y="246">a desktop monitor</text>
<text x="464" y="264">11x24 cells</text>
<text x="464" y="282">174 x 45</text>
<text x="696" y="246">a large monitor</text>
<text x="696" y="264">14x32 cells</text>
<text x="696" y="282">182 x 45</text>
</g>
<text x="24" y="330" font-size="12" fill="#1f2933">MiB: the console's peak memory, measured in a virtual machine with 512 MB</text>
<rect x="24" y="344" width="352" height="28" fill="#3b8f5a"/>
<text x="200" y="363" font-size="13" text-anchor="middle" fill="#ffffff">built-in fonts: Unscii-8, Unifont</text>
<rect x="384" y="344" width="464" height="28" fill="#2f6fb0"/>
<text x="616" y="363" font-size="13" text-anchor="middle" fill="#ffffff">a frit of outline and color fonts</text>
<rect x="24" y="380" width="824" height="28" fill="#ffffff" stroke="#1f2933" stroke-width="1.5"/>
<text x="436" y="399" font-size="13" text-anchor="middle" fill="#1f2933">the same build at every size: drawn on the CPU, with no display server</text>
<rect x="384" y="416" width="464" height="28" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="616" y="435" font-size="13" text-anchor="middle" fill="#1f2933">landing: pictures, a GPU renderer</text>
</svg>
