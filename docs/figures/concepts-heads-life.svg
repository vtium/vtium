<svg xmlns="http://www.w3.org/2000/svg" width="960" height="824" viewBox="0 0 960 824" font-family="DejaVu Sans Mono, monospace">
<title>The life of one head, as a state machine</title>
<rect width="960" height="824" fill="#ffffff"/>
<defs>
<marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="#1f2933"/></marker>
</defs>
<!-- while vtium runs -->
<rect x="16" y="16" width="928" height="576" rx="14" fill="#eef0f2" stroke="#9aa5b1" stroke-width="1"/>
<text x="32" y="40" font-size="14" fill="#1f2933">while vtium runs</text>
<!-- the start -->
<circle cx="38" cy="124" r="6" fill="#1f2933"/>
<line x1="44" y1="124" x2="62" y2="124" stroke="#1f2933" stroke-width="1.5" marker-end="url(#arrow)"/>
<!-- waiting -->
<rect x="64" y="60" width="256" height="128" rx="10" fill="#ffffff" stroke="#2f6fb0" stroke-width="2"/>
<text x="192" y="84" font-size="14" text-anchor="middle" fill="#1f2933">waiting</text>
<text x="192" y="106" font-size="12" text-anchor="middle" fill="#1f2933">vtium.conf declares the</text>
<text x="192" y="122" font-size="12" text-anchor="middle" fill="#1f2933">head, but no display of</text>
<text x="192" y="138" font-size="12" text-anchor="middle" fill="#1f2933">the head is set up yet</text>
<text x="192" y="162" font-size="12" text-anchor="middle" fill="#1f2933">no session runs, and the</text>
<text x="192" y="178" font-size="12" text-anchor="middle" fill="#1f2933">head holds up no exit</text>
<line x1="272" y1="188" x2="272" y2="286" stroke="#1f2933" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="284" y="214" font-size="12" fill="#1f2933">the VT is shown and a display of the head</text>
<text x="284" y="230" font-size="12" fill="#1f2933">is set up: the head's consoles start</text>
<!-- the head's sessions run -->
<rect x="40" y="248" width="880" height="320" rx="14" fill="#e6eef7" stroke="#9aa5b1" stroke-width="1"/>
<text x="56" y="272" font-size="14" fill="#1f2933">sessions run</text>
<!-- running -->
<rect x="64" y="288" width="280" height="264" rx="10" fill="#ffffff" stroke="#2f6fb0" stroke-width="2"/>
<text x="204" y="312" font-size="14" text-anchor="middle" fill="#1f2933">running</text>
<text x="204" y="330" font-size="12" text-anchor="middle" fill="#1f2933">shown on its displays</text>
<text x="204" y="354" font-size="12" text-anchor="middle" fill="#1f2933">Ctrl-Super-Right or Left</text>
<text x="204" y="370" font-size="12" text-anchor="middle" fill="#1f2933">shows another console</text>
<path d="M 164 404 L 164 382 L 244 382 L 244 402" fill="none" stroke="#1f2933" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="104" y="404" width="200" height="56" rx="8" fill="#ffffff" stroke="#2f6fb0" stroke-width="1.5"/>
<text x="204" y="427" font-size="13" text-anchor="middle" fill="#1f2933">one console shown</text>
<text x="204" y="446" font-size="12" text-anchor="middle" fill="#1f2933">the others run unseen</text>
<path d="M 164 460 L 164 482 L 244 482 L 244 462" fill="none" stroke="#1f2933" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="204" y="502" font-size="12" text-anchor="middle" fill="#1f2933">a console's program exits</text>
<text x="204" y="518" font-size="12" text-anchor="middle" fill="#1f2933">and starts again in that</text>
<text x="204" y="534" font-size="12" text-anchor="middle" fill="#1f2933">console</text>
<!-- running to dark and back -->
<line x1="344" y1="344" x2="534" y2="344" stroke="#1f2933" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="440" y="318" font-size="12" text-anchor="middle" fill="#1f2933">its last display</text>
<text x="440" y="334" font-size="12" text-anchor="middle" fill="#1f2933">is disconnected</text>
<line x1="536" y1="404" x2="346" y2="404" stroke="#1f2933" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="440" y="424" font-size="12" text-anchor="middle" fill="#1f2933">a display that the</text>
<text x="440" y="440" font-size="12" text-anchor="middle" fill="#1f2933">head's rules match</text>
<text x="440" y="456" font-size="12" text-anchor="middle" fill="#1f2933">is connected</text>
<!-- dark -->
<rect x="536" y="296" width="232" height="140" rx="10" fill="#ffffff" stroke="#2f6fb0" stroke-width="2"/>
<text x="652" y="320" font-size="14" text-anchor="middle" fill="#1f2933">dark</text>
<text x="652" y="342" font-size="12" text-anchor="middle" fill="#1f2933">no display of the head</text>
<text x="652" y="358" font-size="12" text-anchor="middle" fill="#1f2933">is connected; the</text>
<text x="652" y="374" font-size="12" text-anchor="middle" fill="#1f2933">sessions run on unseen,</text>
<text x="652" y="390" font-size="12" text-anchor="middle" fill="#1f2933">and the keys that reach</text>
<text x="652" y="406" font-size="12" text-anchor="middle" fill="#1f2933">the head still type</text>
<text x="652" y="422" font-size="12" text-anchor="middle" fill="#1f2933">into them</text>
<path d="M 612 436 L 612 464 L 692 464 L 692 438" fill="none" stroke="#1f2933" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="536" y="488" font-size="12" fill="#1f2933">hangup, at once or when its time runs out:</text>
<text x="536" y="504" font-size="12" fill="#1f2933">every pty closes, the programs get SIGHUP,</text>
<text x="536" y="520" font-size="12" fill="#1f2933">and each console starts again at its login</text>
<!-- ended -->
<line x1="216" y1="568" x2="216" y2="654" stroke="#1f2933" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="228" y="614" font-size="12" fill="#1f2933">oneshot: every console's program</text>
<text x="228" y="630" font-size="12" fill="#1f2933">has exited, or a hang-up ended it</text>
<rect x="64" y="656" width="368" height="128" rx="10" fill="#ffffff" stroke="#2f6fb0" stroke-width="2"/>
<text x="248" y="680" font-size="14" text-anchor="middle" fill="#1f2933">ended</text>
<text x="248" y="700" font-size="12" text-anchor="middle" fill="#1f2933">each console shows "Session ended.</text>
<text x="248" y="716" font-size="12" text-anchor="middle" fill="#1f2933">It will not start again."</text>
<text x="248" y="744" font-size="12" text-anchor="middle" fill="#1f2933">once every head that started has</text>
<text x="248" y="760" font-size="12" text-anchor="middle" fill="#1f2933">ended, vtium exits with status 0</text>
<!-- gave up -->
<line x1="660" y1="592" x2="660" y2="654" stroke="#1f2933" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="672" y="614" font-size="12" fill="#1f2933">on any head, a console's program</text>
<text x="672" y="630" font-size="12" fill="#1f2933">exits within 2 s of its start for</text>
<text x="672" y="646" font-size="12" fill="#1f2933">the 6th time in a row</text>
<rect x="476" y="656" width="368" height="128" rx="10" fill="#ffffff" stroke="#2f6fb0" stroke-width="2"/>
<text x="660" y="680" font-size="14" text-anchor="middle" fill="#1f2933">vtium gives up</text>
<text x="660" y="700" font-size="12" text-anchor="middle" fill="#1f2933">the sessions of every head hang up</text>
<text x="660" y="720" font-size="12" text-anchor="middle" fill="#1f2933">open policy: vtium exits with</text>
<text x="660" y="736" font-size="12" text-anchor="middle" fill="#1f2933">status 1, and a getty takes the VT</text>
<text x="660" y="756" font-size="12" text-anchor="middle" fill="#1f2933">closed policy: vtium keeps the VT</text>
<text x="660" y="772" font-size="12" text-anchor="middle" fill="#1f2933">and shows a notice</text>
<!-- note -->
<text x="24" y="812" font-size="12" fill="#1f2933">Each head moves through these states on its own. Giving up stops every head at once.</text>
</svg>
