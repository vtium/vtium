<svg xmlns="http://www.w3.org/2000/svg" width="960" height="664" viewBox="0 0 960 664" font-family="DejaVu Sans Mono, monospace">
<title>How a font reaches the console</title>
<rect width="960" height="664" fill="#ffffff"/>
<defs>
<marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="#1f2933"/></marker>
</defs>
<!-- you choose and write a font set -->
<rect x="16" y="16" width="256" height="328" fill="#fbecd0" stroke="#9aa5b1" stroke-width="1"/>
<text x="32" y="40" font-size="14" fill="#1f2933">you, at a terminal</text>
<rect x="32" y="56" width="224" height="72" fill="#ffffff" stroke="#9aa5b1" stroke-width="1"/>
<text x="144" y="78" font-size="13" text-anchor="middle" fill="#1f2933">vtium config preview</text>
<text x="144" y="98" font-size="12" text-anchor="middle" fill="#1f2933">draws a sample of each</text>
<text x="144" y="114" font-size="12" text-anchor="middle" fill="#1f2933">font, and writes nothing</text>
<line x1="144" y1="128" x2="144" y2="150" stroke="#1f2933" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
<text x="154" y="145" font-size="12" fill="#1f2933">you pick fonts</text>
<rect x="32" y="152" width="224" height="104" fill="#ffffff" stroke="#9aa5b1" stroke-width="1"/>
<text x="144" y="174" font-size="13" text-anchor="middle" fill="#1f2933">vtium config new-frit</text>
<text x="144" y="194" font-size="12" text-anchor="middle" fill="#1f2933">makes a font set of the</text>
<text x="144" y="210" font-size="12" text-anchor="middle" fill="#1f2933">fonts you name, or takes</text>
<text x="144" y="226" font-size="12" text-anchor="middle" fill="#1f2933">a file you wrote from</text>
<text x="144" y="242" font-size="12" text-anchor="middle" fill="#1f2933">its --template</text>
<rect x="32" y="272" width="224" height="56" fill="#ffffff" stroke="#9aa5b1" stroke-width="1"/>
<text x="144" y="294" font-size="13" text-anchor="middle" fill="#1f2933">by hand</text>
<text x="144" y="314" font-size="12" text-anchor="middle" fill="#1f2933">you write the file</text>
<!-- installed as root -->
<path d="M 256 204 L 288 204 L 288 150 L 318 150" fill="none" stroke="#1f2933" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M 256 300 L 288 300 L 288 204" fill="none" stroke="#1f2933" stroke-width="1.5"/>
<text x="304" y="216" font-size="12" fill="#1f2933">installing it asks</text>
<text x="304" y="232" font-size="12" fill="#1f2933">for sudo once</text>
<!-- the frit -->
<rect x="320" y="56" width="180" height="132" fill="#ffffff" stroke="#9aa5b1" stroke-width="1"/>
<text x="410" y="80" font-size="14" text-anchor="middle" fill="#1f2933">the frit</text>
<text x="410" y="100" font-size="12" text-anchor="middle" fill="#1f2933">a font set file</text>
<text x="410" y="120" font-size="12" text-anchor="middle" fill="#1f2933">/etc/vtium/fonts/</text>
<text x="410" y="136" font-size="12" text-anchor="middle" fill="#1f2933">NAME.vtfrit</text>
<text x="410" y="156" font-size="12" text-anchor="middle" fill="#1f2933">names the sources</text>
<text x="410" y="172" font-size="12" text-anchor="middle" fill="#1f2933">in order; root owns it</text>
<!-- the console -->
<rect x="528" y="16" width="416" height="376" fill="#e6eef7" stroke="#2f6fb0" stroke-width="2"/>
<text x="544" y="40" font-size="14" fill="#1f2933">vtium, the console, as root</text>
<line x1="500" y1="84" x2="542" y2="84" stroke="#1f2933" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="544" y="56" width="384" height="56" fill="#ffffff" stroke="#9aa5b1" stroke-width="1"/>
<text x="736" y="78" font-size="12" text-anchor="middle" fill="#1f2933">reads the frit, once the frit passes</text>
<text x="736" y="96" font-size="12" text-anchor="middle" fill="#1f2933">the ownership check that vtium.conf passes</text>
<rect x="544" y="136" width="384" height="76" fill="#ffffff" stroke="#9aa5b1" stroke-width="1"/>
<text x="736" y="158" font-size="13" text-anchor="middle" fill="#1f2933">the built-in fonts, Unifont and Unscii-8</text>
<text x="736" y="178" font-size="12" text-anchor="middle" fill="#1f2933">compiled into vtium: they draw the first</text>
<text x="736" y="194" font-size="12" text-anchor="middle" fill="#1f2933">frame, and each character the store lacks</text>
<rect x="544" y="236" width="384" height="76" fill="#ffffff" stroke="#9aa5b1" stroke-width="1"/>
<text x="736" y="258" font-size="13" text-anchor="middle" fill="#1f2933">the glyph store</text>
<text x="736" y="278" font-size="12" text-anchor="middle" fill="#1f2933">in vtium's memory, within a limit set by</text>
<text x="736" y="294" font-size="12" text-anchor="middle" fill="#1f2933">the machine's memory; nothing goes to disk</text>
<text x="736" y="342" font-size="12" text-anchor="middle" fill="#1f2933">vtium draws the screen from the store,</text>
<text x="736" y="358" font-size="12" text-anchor="middle" fill="#1f2933">and from the built-in fonts</text>
<!-- the session switches the font -->
<rect x="16" y="468" width="420" height="140" fill="#fbecd0" stroke="#9aa5b1" stroke-width="1"/>
<text x="32" y="492" font-size="14" fill="#1f2933">your session, at the console</text>
<rect x="32" y="508" width="388" height="84" fill="#ffffff" stroke="#9aa5b1" stroke-width="1"/>
<text x="226" y="530" font-size="13" text-anchor="middle" fill="#1f2933">vtium config use-frit NAME</text>
<text x="226" y="550" font-size="12" text-anchor="middle" fill="#1f2933">switches the console to another font set</text>
<text x="226" y="566" font-size="12" text-anchor="middle" fill="#1f2933">or a built-in font, while allow-font-ops</text>
<text x="226" y="582" font-size="12" text-anchor="middle" fill="#1f2933">is on, until this session ends</text>
<path d="M 380 508 L 380 376 L 526 376" fill="none" stroke="#1f2933" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="392" y="352" font-size="12" fill="#1f2933">OSC 50, through</text>
<text x="392" y="368" font-size="12" fill="#1f2933">the pty</text>
<!-- the font helper -->
<line x1="580" y1="392" x2="580" y2="466" stroke="#1f2933" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="572" y="424" font-size="12" text-anchor="end" fill="#1f2933">the frit's text, and</text>
<text x="572" y="440" font-size="12" text-anchor="end" fill="#1f2933">the characters to draw</text>
<line x1="720" y1="468" x2="720" y2="394" stroke="#1f2933" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="728" y="420" font-size="12" fill="#1f2933">glyphs at the</text>
<text x="728" y="436" font-size="12" fill="#1f2933">character cell's size;</text>
<text x="728" y="452" font-size="12" fill="#1f2933">vtium checks each one</text>
<rect x="528" y="468" width="248" height="128" fill="#e5f1e8" stroke="#9aa5b1" stroke-width="1"/>
<text x="652" y="492" font-size="14" text-anchor="middle" fill="#1f2933">vtium-config serve</text>
<text x="652" y="512" font-size="13" text-anchor="middle" fill="#1f2933">the font helper</text>
<text x="652" y="532" font-size="12" text-anchor="middle" fill="#1f2933">as nobody, in a sandbox;</text>
<text x="652" y="548" font-size="12" text-anchor="middle" fill="#1f2933">reads the fonts and</text>
<text x="652" y="564" font-size="12" text-anchor="middle" fill="#1f2933">draws their glyphs</text>
<rect x="808" y="484" width="136" height="96" fill="#ffffff" stroke="#9aa5b1" stroke-width="1"/>
<text x="876" y="506" font-size="13" text-anchor="middle" fill="#1f2933">font files</text>
<text x="876" y="526" font-size="12" text-anchor="middle" fill="#1f2933">console fonts,</text>
<text x="876" y="542" font-size="12" text-anchor="middle" fill="#1f2933">font files and</text>
<text x="876" y="558" font-size="12" text-anchor="middle" fill="#1f2933">installed fonts</text>
<line x1="808" y1="532" x2="778" y2="532" stroke="#1f2933" stroke-width="1.5" marker-end="url(#arrow)"/>
<!-- legend -->
<rect x="24" y="632" width="24" height="14" fill="#e6eef7" stroke="#9aa5b1" stroke-width="1"/>
<text x="56" y="644" font-size="13" fill="#1f2933">as root</text>
<rect x="140" y="632" width="24" height="14" fill="#fbecd0" stroke="#9aa5b1" stroke-width="1"/>
<text x="172" y="644" font-size="13" fill="#1f2933">as you</text>
<rect x="248" y="632" width="24" height="14" fill="#e5f1e8" stroke="#9aa5b1" stroke-width="1"/>
<text x="280" y="644" font-size="13" fill="#1f2933">as nobody, sandboxed</text>
<line x1="472" y1="639" x2="512" y2="639" stroke="#1f2933" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="524" y="644" font-size="13" fill="#1f2933">what goes where, labelled</text>
</svg>
