<svg xmlns="http://www.w3.org/2000/svg" width="900" height="436" viewBox="0 0 900 436" font-family="DejaVu Sans Mono, monospace">
<title>What one head is made of</title>
<rect width="900" height="436" fill="#ffffff"/>
<defs>
<marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="#1f2933"/></marker>
</defs>
<rect x="16" y="16" width="868" height="404" rx="14" fill="#eef0f2" stroke="#9aa5b1" stroke-width="1"/>
<text x="32" y="40" font-size="14" fill="#1f2933">vtium, on one VT</text>
<!-- inputs -->
<rect x="40" y="72" width="184" height="44" fill="#ffffff" stroke="#9aa5b1" stroke-width="1"/>
<text x="132" y="91" font-size="13" text-anchor="middle" fill="#1f2933">keyboard</text>
<text x="132" y="108" font-size="12" text-anchor="middle" fill="#1f2933">on USB port 3.1</text>
<rect x="40" y="128" width="184" height="44" fill="#ffffff" stroke="#9aa5b1" stroke-width="1"/>
<text x="132" y="147" font-size="13" text-anchor="middle" fill="#1f2933">mouse</text>
<text x="132" y="164" font-size="12" text-anchor="middle" fill="#1f2933">on USB port 3.1</text>
<line x1="224" y1="94" x2="358" y2="132" stroke="#1f2933" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="224" y1="150" x2="358" y2="150" stroke="#1f2933" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="292" y="192" font-size="12" text-anchor="middle" fill="#1f2933">a rule sends</text>
<text x="292" y="208" font-size="12" text-anchor="middle" fill="#1f2933">port 3.1 to desk</text>
<rect x="40" y="276" width="184" height="44" fill="#ffffff" stroke="#9aa5b1" stroke-width="1" stroke-dasharray="6 4"/>
<text x="132" y="295" font-size="13" text-anchor="middle" fill="#1f2933">roaming keyboard</text>
<text x="132" y="312" font-size="12" text-anchor="middle" fill="#1f2933">no head owns it</text>
<line x1="224" y1="298" x2="358" y2="298" stroke="#1f2933" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
<text x="292" y="258" font-size="12" text-anchor="middle" fill="#1f2933">while desk is</text>
<text x="292" y="274" font-size="12" text-anchor="middle" fill="#1f2933">the active head</text>
<!-- the head -->
<rect x="360" y="56" width="260" height="340" rx="10" fill="#ffffff" stroke="#2f6fb0" stroke-width="2"/>
<text x="490" y="80" font-size="15" text-anchor="middle" fill="#1f2933">head desk</text>
<text x="490" y="98" font-size="12" text-anchor="middle" fill="#1f2933">its [head desk] section</text>
<rect x="380" y="112" width="220" height="60" fill="#ffffff" stroke="#9aa5b1" stroke-width="1"/>
<text x="490" y="136" font-size="13" text-anchor="middle" fill="#1f2933">look</text>
<text x="490" y="156" font-size="12" text-anchor="middle" fill="#1f2933">a font set and its size</text>
<rect x="396" y="196" width="204" height="80" fill="#ffffff" stroke="#9aa5b1" stroke-width="1"/>
<rect x="388" y="204" width="204" height="80" fill="#ffffff" stroke="#9aa5b1" stroke-width="1"/>
<rect x="380" y="212" width="204" height="80" fill="#ffffff" stroke="#2f6fb0" stroke-width="1.5"/>
<text x="482" y="236" font-size="13" text-anchor="middle" fill="#1f2933">console 1, shown</text>
<text x="482" y="256" font-size="12" text-anchor="middle" fill="#1f2933">its own login,</text>
<text x="482" y="272" font-size="12" text-anchor="middle" fill="#1f2933">screen and scrollback</text>
<text x="490" y="318" font-size="12" text-anchor="middle" fill="#1f2933">behind it, consoles 2</text>
<text x="490" y="334" font-size="12" text-anchor="middle" fill="#1f2933">and 3 run unseen</text>
<text x="490" y="362" font-size="12" text-anchor="middle" fill="#1f2933">Ctrl-Super-Right or Left</text>
<text x="490" y="378" font-size="12" text-anchor="middle" fill="#1f2933">shows another console</text>
<!-- displays -->
<line x1="620" y1="132" x2="718" y2="112" stroke="#1f2933" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="620" y1="232" x2="710" y2="256" stroke="#1f2933" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="666" y="176" font-size="12" text-anchor="middle" fill="#1f2933">a rule</text>
<text x="666" y="192" font-size="12" text-anchor="middle" fill="#1f2933">sends each</text>
<text x="666" y="208" font-size="12" text-anchor="middle" fill="#1f2933">to desk</text>
<rect x="720" y="72" width="136" height="84" rx="4" fill="#1f2933" stroke="#9aa5b1" stroke-width="1"/>
<rect x="732" y="84" width="88" height="6" fill="#9aa5b1"/>
<rect x="732" y="98" width="104" height="6" fill="#9aa5b1"/>
<rect x="732" y="112" width="64" height="6" fill="#9aa5b1"/>
<rect x="732" y="126" width="8" height="6" fill="#ffffff"/>
<line x1="788" y1="156" x2="788" y2="166" stroke="#9aa5b1" stroke-width="3"/>
<text x="788" y="184" font-size="13" text-anchor="middle" fill="#1f2933">display DP-1</text>
<rect x="712" y="208" width="152" height="96" rx="4" fill="#1f2933" stroke="#9aa5b1" stroke-width="1"/>
<rect x="725" y="221" width="99" height="7" fill="#9aa5b1"/>
<rect x="725" y="237" width="117" height="7" fill="#9aa5b1"/>
<rect x="725" y="253" width="72" height="7" fill="#9aa5b1"/>
<rect x="725" y="269" width="9" height="7" fill="#ffffff"/>
<line x1="788" y1="304" x2="788" y2="314" stroke="#9aa5b1" stroke-width="3"/>
<text x="788" y="332" font-size="13" text-anchor="middle" fill="#1f2933">display HDMI-A-1</text>
<text x="788" y="362" font-size="12" text-anchor="middle" fill="#1f2933">both show the</text>
<text x="788" y="378" font-size="12" text-anchor="middle" fill="#1f2933">console shown</text>
</svg>
