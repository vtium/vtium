<svg xmlns="http://www.w3.org/2000/svg" width="872" height="480" viewBox="0 0 872 480" font-family="DejaVu Sans Mono, monospace">
<title>vtium's pieces, and who runs them</title>
<rect width="872" height="480" fill="#ffffff"/>
<defs>
<marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="#1f2933"/></marker>
<marker id="arrow-blue" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="#2f6fb0"/></marker>
</defs>
<rect x="16" y="16" width="840" height="224" fill="#e6eef7" stroke="#9aa5b1" stroke-width="1"/>
<text x="32" y="40" font-size="15" fill="#1f2933">runs as root</text>
<rect x="40" y="60" width="200" height="36" fill="#ffffff" stroke="#9aa5b1" stroke-width="1"/>
<text x="140" y="83" font-size="14" text-anchor="middle" fill="#1f2933">the VT</text>
<rect x="40" y="108" width="200" height="36" fill="#ffffff" stroke="#9aa5b1" stroke-width="1"/>
<text x="140" y="131" font-size="14" text-anchor="middle" fill="#1f2933">the display</text>
<rect x="40" y="156" width="200" height="36" fill="#ffffff" stroke="#9aa5b1" stroke-width="1"/>
<text x="140" y="179" font-size="14" text-anchor="middle" fill="#1f2933">keyboards, pointers</text>
<text x="140" y="220" font-size="13" text-anchor="middle" fill="#1f2933">the kernel's devices</text>
<line x1="240" y1="78" x2="336" y2="116" stroke="#9aa5b1" stroke-width="1.5"/>
<line x1="240" y1="126" x2="336" y2="128" stroke="#9aa5b1" stroke-width="1.5"/>
<line x1="240" y1="174" x2="336" y2="140" stroke="#9aa5b1" stroke-width="1.5"/>
<rect x="336" y="100" width="200" height="56" fill="#ffffff" stroke="#2f6fb0" stroke-width="2"/>
<text x="436" y="124" font-size="17" text-anchor="middle" fill="#1f2933">vtium</text>
<text x="436" y="145" font-size="13" text-anchor="middle" fill="#1f2933">the console</text>
<rect x="632" y="60" width="200" height="44" fill="#ffffff" stroke="#9aa5b1" stroke-width="1" stroke-dasharray="6 4"/>
<text x="732" y="87" font-size="14" text-anchor="middle" fill="#1f2933">vtium-vitrify create</text>
<rect x="632" y="148" width="200" height="44" fill="#ffffff" stroke="#9aa5b1" stroke-width="1" stroke-dasharray="6 4"/>
<text x="732" y="175" font-size="14" text-anchor="middle" fill="#1f2933">the trusted store</text>
<line x1="732" y1="104" x2="732" y2="146" stroke="#1f2933" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="742" y="130" font-size="13" fill="#1f2933">font sets</text>
<line x1="632" y1="170" x2="538" y2="140" stroke="#1f2933" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="588" y="134" font-size="13" text-anchor="middle" fill="#1f2933">checked sets</text>
<line x1="436" y1="158" x2="436" y2="256" stroke="#2f6fb0" stroke-width="2" marker-start="url(#arrow-blue)" marker-end="url(#arrow-blue)"/>
<text x="448" y="212" font-size="13" fill="#2f6fb0">bytes, both ways</text>
<rect x="376" y="258" width="120" height="36" fill="#ffffff" stroke="#2f6fb0" stroke-width="2"/>
<text x="436" y="281" font-size="14" text-anchor="middle" fill="#1f2933">the pty</text>
<rect x="16" y="312" width="840" height="112" fill="#fbecd0" stroke="#9aa5b1" stroke-width="1"/>
<text x="32" y="412" font-size="15" fill="#1f2933">runs as the user who logged in</text>
<line x1="436" y1="336" x2="436" y2="294" stroke="#2f6fb0" stroke-width="1.5"/>
<line x1="196" y1="336" x2="396" y2="294" stroke="#2f6fb0" stroke-width="1.5"/>
<line x1="676" y1="336" x2="476" y2="294" stroke="#2f6fb0" stroke-width="1.5"/>
<rect x="96" y="336" width="200" height="44" fill="#ffffff" stroke="#9aa5b1" stroke-width="1" stroke-dasharray="6 4"/>
<text x="196" y="363" font-size="14" text-anchor="middle" fill="#1f2933">vtium-vitrify set</text>
<rect x="336" y="336" width="200" height="44" fill="#ffffff" stroke="#9aa5b1" stroke-width="1"/>
<text x="436" y="363" font-size="14" text-anchor="middle" fill="#1f2933">shell and programs</text>
<rect x="576" y="336" width="200" height="44" fill="#ffffff" stroke="#9aa5b1" stroke-width="1" stroke-dasharray="6 4"/>
<text x="676" y="363" font-size="14" text-anchor="middle" fill="#1f2933">vtium-clipboard</text>
<line x1="24" y1="446" x2="64" y2="446" stroke="#2f6fb0" stroke-width="2"/>
<text x="76" y="451" font-size="13" fill="#1f2933">the only way from the session to vtium: bytes on the session's terminal</text>
<rect x="24" y="462" width="40" height="12" fill="#ffffff" stroke="#9aa5b1" stroke-width="1" stroke-dasharray="6 4"/>
<text x="76" y="473" font-size="13" fill="#1f2933">proposed or planned, not built yet</text>
</svg>
