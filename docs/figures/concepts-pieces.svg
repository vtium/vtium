<svg xmlns="http://www.w3.org/2000/svg" width="872" height="620" viewBox="0 0 872 620" font-family="DejaVu Sans Mono, monospace">
<title>vtium's suite, and who runs each piece</title>
<rect width="872" height="620" fill="#ffffff"/>
<defs>
<marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="#1f2933"/></marker>
<marker id="arrow-blue" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="#2f6fb0"/></marker>
</defs>
<rect x="16" y="16" width="840" height="240" fill="#e6eef7" stroke="#9aa5b1" stroke-width="1"/>
<text x="32" y="40" font-size="15" fill="#1f2933">runs as root</text>
<rect x="40" y="60" width="200" height="36" fill="#ffffff" stroke="#9aa5b1" stroke-width="1"/>
<text x="140" y="83" font-size="14" text-anchor="middle" fill="#1f2933">the VT</text>
<rect x="40" y="108" width="200" height="36" fill="#ffffff" stroke="#9aa5b1" stroke-width="1"/>
<text x="140" y="131" font-size="14" text-anchor="middle" fill="#1f2933">the display</text>
<rect x="40" y="156" width="200" height="36" fill="#ffffff" stroke="#9aa5b1" stroke-width="1"/>
<text x="140" y="179" font-size="14" text-anchor="middle" fill="#1f2933">keyboards, pointers</text>
<text x="140" y="220" font-size="13" text-anchor="middle" fill="#1f2933">the kernel's devices</text>
<line x1="240" y1="78" x2="336" y2="116" stroke="#9aa5b1" stroke-width="1.5"/>
<line x1="240" y1="126" x2="336" y2="128" stroke="#9aa5b1" stroke-width="1.5"/>
<line x1="240" y1="174" x2="336" y2="140" stroke="#9aa5b1" stroke-width="1.5"/>
<rect x="336" y="100" width="200" height="56" fill="#ffffff" stroke="#2f6fb0" stroke-width="2"/>
<text x="436" y="124" font-size="17" text-anchor="middle" fill="#1f2933">vtium</text>
<text x="436" y="145" font-size="13" text-anchor="middle" fill="#1f2933">the console</text>
<rect x="632" y="56" width="200" height="56" fill="#ffffff" stroke="#9aa5b1" stroke-width="1"/>
<text x="732" y="80" font-size="14" text-anchor="middle" fill="#1f2933">vtium.conf, the frits</text>
<text x="732" y="100" font-size="13" text-anchor="middle" fill="#1f2933">/etc/vtium</text>
<rect x="632" y="168" width="200" height="56" fill="#ffffff" stroke="#9aa5b1" stroke-width="1"/>
<text x="732" y="192" font-size="14" text-anchor="middle" fill="#1f2933">vtium-config</text>
<text x="732" y="212" font-size="13" text-anchor="middle" fill="#1f2933">apply, under sudo</text>
<line x1="732" y1="166" x2="732" y2="114" stroke="#1f2933" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="724" y="145" font-size="13" text-anchor="end" fill="#1f2933">vtium.conf, frits</text>
<line x1="632" y1="92" x2="538" y2="114" stroke="#1f2933" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="586" y="90" font-size="13" text-anchor="middle" fill="#1f2933">read</text>
<line x1="436" y1="158" x2="436" y2="294" stroke="#2f6fb0" stroke-width="2" marker-start="url(#arrow-blue)" marker-end="url(#arrow-blue)"/>
<text x="448" y="222" font-size="13" fill="#2f6fb0">bytes, both ways</text>
<rect x="376" y="296" width="120" height="36" fill="#ffffff" stroke="#2f6fb0" stroke-width="2"/>
<text x="436" y="319" font-size="14" text-anchor="middle" fill="#1f2933">the pty</text>
<rect x="16" y="268" width="300" height="88" fill="#e5f1e1" stroke="#9aa5b1" stroke-width="1"/>
<text x="32" y="290" font-size="15" fill="#1f2933">runs as nobody</text>
<rect x="40" y="300" width="200" height="44" fill="#ffffff" stroke="#9aa5b1" stroke-width="1"/>
<text x="140" y="319" font-size="14" text-anchor="middle" fill="#1f2933">vtium-config serve</text>
<text x="140" y="337" font-size="13" text-anchor="middle" fill="#1f2933">the font helper</text>
<line x1="346" y1="158" x2="242" y2="298" stroke="#1f2933" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<text x="326" y="200" font-size="13" fill="#1f2933">starts it,</text>
<text x="326" y="216" font-size="13" fill="#1f2933">two pipes</text>
<rect x="16" y="370" width="840" height="184" fill="#fbecd0" stroke="#9aa5b1" stroke-width="1"/>
<text x="32" y="542" font-size="15" fill="#1f2933">runs as the user who logged in</text>
<line x1="240" y1="410" x2="396" y2="332" stroke="#2f6fb0" stroke-width="1.5"/>
<line x1="240" y1="470" x2="410" y2="332" stroke="#2f6fb0" stroke-width="1.5"/>
<line x1="436" y1="426" x2="436" y2="332" stroke="#2f6fb0" stroke-width="1.5"/>
<rect x="40" y="390" width="200" height="40" fill="#ffffff" stroke="#9aa5b1" stroke-width="1"/>
<text x="140" y="415" font-size="14" text-anchor="middle" fill="#1f2933">vtium config use-frit</text>
<rect x="40" y="450" width="200" height="40" fill="#ffffff" stroke="#9aa5b1" stroke-width="1" stroke-dasharray="6 4"/>
<text x="140" y="475" font-size="14" text-anchor="middle" fill="#1f2933">vtium-clipboard</text>
<rect x="336" y="426" width="200" height="40" fill="#ffffff" stroke="#9aa5b1" stroke-width="1"/>
<text x="436" y="451" font-size="14" text-anchor="middle" fill="#1f2933">shell and programs</text>
<rect x="620" y="380" width="224" height="34" fill="#ffffff" stroke="#9aa5b1" stroke-width="1"/>
<text x="732" y="402" font-size="14" text-anchor="middle" fill="#1f2933">vtium config preview</text>
<rect x="620" y="422" width="224" height="50" fill="#ffffff" stroke="#9aa5b1" stroke-width="1"/>
<text x="732" y="443" font-size="13" text-anchor="middle" fill="#1f2933">vtium config set KEY VALUE</text>
<text x="732" y="462" font-size="13" text-anchor="middle" fill="#1f2933">and the draft's commands</text>
<rect x="620" y="480" width="224" height="50" fill="#ffffff" stroke="#9aa5b1" stroke-width="1"/>
<text x="732" y="501" font-size="13" text-anchor="middle" fill="#1f2933">vtium config new-frit</text>
<text x="732" y="520" font-size="13" text-anchor="middle" fill="#1f2933">and its templates</text>
<path d="M 620 447 L 600 447 L 600 196 L 630 196" fill="none" stroke="#1f2933" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M 620 505 L 600 505 L 600 445" fill="none" stroke="#1f2933" stroke-width="1.5"/>
<text x="610" y="292" font-size="13" fill="#1f2933">vtium.conf</text>
<text x="610" y="310" font-size="13" fill="#1f2933">or a frit,</text>
<text x="610" y="328" font-size="13" fill="#1f2933">sudo once for</text>
<text x="610" y="346" font-size="13" fill="#1f2933">each install</text>
<line x1="24" y1="576" x2="64" y2="576" stroke="#2f6fb0" stroke-width="2"/>
<text x="76" y="581" font-size="13" fill="#1f2933">the only way from the session to vtium: bytes on the session's terminal</text>
<rect x="24" y="594" width="40" height="12" fill="#ffffff" stroke="#9aa5b1" stroke-width="1" stroke-dasharray="6 4"/>
<text x="76" y="605" font-size="13" fill="#1f2933">proposed, not built yet</text>
</svg>
