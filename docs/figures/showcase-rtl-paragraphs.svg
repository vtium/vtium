<!-- category: scripts and emoji -->
<!-- caption: In a build with right-to-left support, a program starts a right-to-left paragraph with SCP 2 and then writes its text in the order it is read. -->
<!-- caption: vtium draws the paragraph from the right edge. Each letter lands to the left of the one before, and the cursor moves leftward with them. -->
<!-- caption: A run of Latin letters and digits inside the paragraph still reads left to right. -->
<!-- alt: Four numbered panels, each a row of sixteen cells. 1: after SCP 2 the cursor waits in the rightmost cell. 2: the Hebrew letter shin stands in the rightmost cell and the cursor is to its left. -->
<!-- alt: 3: the word shalom fills the four rightmost cells, read from the right, and the cursor is to its left. 4: vtium 0.1 stands to the left of shalom, reading left to right, and the cursor is near the left edge. -->
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="292" viewBox="0 0 960 292" font-family="DejaVu Sans Mono, monospace">
<title>A right-to-left paragraph as the program writes it</title>
