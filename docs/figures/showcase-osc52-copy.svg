<!-- category: input and pointer -->
<!-- caption: A program copies text with OSC 52, even over SSH or inside tmux, where it shares no clipboard with you. vtium decodes the text and keeps it as its selection, the one a paste sends. -->
<!-- caption: Shift+Insert or the middle button pastes it into the console you are using. A program that asks to read the selection back gets no reply, so no program can ask vtium for what you copied. -->
<!-- alt: Four numbered panels. 1: a program on a remote host sends OSC 52 with the word hello in base64. 2: vtium holds hello as its selection. 3: Shift+Insert or the middle button pastes hello into the shell. -->
<!-- alt: 4: a program sends OSC 52 with a question mark to read the selection, and vtium sends nothing back. -->
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" font-family="DejaVu Sans Mono, monospace">
<title>A program copies text with OSC 52</title>
<rect width="960" height="300" fill="#ffffff"/>
<defs>
<marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="#1f2933"/></marker>
</defs>
<rect x="16" y="16" width="224" height="268" rx="14" fill="#eef0f2" stroke="#9aa5b1" stroke-width="1"/>
<circle cx="38" cy="38" r="11" fill="#2f6fb0"/>
<text x="38" y="42.5" font-size="13" text-anchor="middle" fill="#ffffff">1</text>
<text x="56" y="43" font-size="13" fill="#1f2933">a program copies</text>
<rect x="252" y="16" width="224" height="268" rx="14" fill="#eef0f2" stroke="#9aa5b1" stroke-width="1"/>
<circle cx="274" cy="38" r="11" fill="#2f6fb0"/>
<text x="274" y="42.5" font-size="13" text-anchor="middle" fill="#ffffff">2</text>
<text x="292" y="43" font-size="13" fill="#1f2933">vtium keeps it</text>
<rect x="488" y="16" width="224" height="268" rx="14" fill="#eef0f2" stroke="#9aa5b1" stroke-width="1"/>
<circle cx="510" cy="38" r="11" fill="#2f6fb0"/>
<text x="510" y="42.5" font-size="13" text-anchor="middle" fill="#ffffff">3</text>
<text x="528" y="43" font-size="13" fill="#1f2933">you paste it</text>
<rect x="724" y="16" width="224" height="268" rx="14" fill="#eef0f2" stroke="#9aa5b1" stroke-width="1"/>
<circle cx="746" cy="38" r="11" fill="#2f6fb0"/>
<text x="746" y="42.5" font-size="13" text-anchor="middle" fill="#ffffff">4</text>
<text x="764" y="43" font-size="13" fill="#1f2933">a program asks to read</text>
<text x="32" y="68" font-size="12" fill="#1f2933">editor on a remote host,</text>
<text x="32" y="84" font-size="12" fill="#1f2933">over ssh, sends</text>
<rect x="32" y="94" width="192" height="44" fill="#ffffff" stroke="#9aa5b1" stroke-width="1"/>
<text x="40" y="112" font-size="12" fill="#1f2933">OSC 52 ; c ;</text>
<text x="40" y="128" font-size="12" fill="#1f2933">aGVsbG8= ST</text>
<text x="32" y="166" font-size="12" fill="#1f2933">c names the clipboard,</text>
<text x="32" y="182" font-size="12" fill="#1f2933">and aGVsbG8= is hello</text>
<text x="32" y="198" font-size="12" fill="#1f2933">in base64.</text>
<line x1="228" y1="116" x2="250" y2="116" stroke="#1f2933" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="268" y="76" font-size="12" fill="#1f2933">vtium's selection</text>
<rect x="268" y="86" width="192" height="36" fill="#ffffff" stroke="#2f6fb0" stroke-width="2"/>
<text x="364" y="109" font-size="14" text-anchor="middle" fill="#1f2933">hello</text>
<text x="268" y="152" font-size="12" fill="#1f2933">vtium decodes the text</text>
<text x="268" y="168" font-size="12" fill="#1f2933">and holds it for a</text>
<text x="268" y="184" font-size="12" fill="#1f2933">paste. With</text>
<text x="268" y="200" font-size="12" fill="#1f2933">no-clipboard-write in</text>
<text x="268" y="216" font-size="12" fill="#1f2933">vtium.conf it drops it.</text>
<line x1="464" y1="104" x2="486" y2="104" stroke="#1f2933" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="504" y="62" width="112" height="26" fill="#fbecd0" stroke="#9aa5b1" stroke-width="1"/>
<text x="560" y="80" font-size="12" text-anchor="middle" fill="#1f2933">Shift+Insert</text>
<text x="504" y="108" font-size="12" fill="#1f2933">or the middle button</text>
<line x1="560" y1="114" x2="560" y2="132" stroke="#1f2933" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="500" y="136" width="200" height="32" rx="3" fill="#1f2933"/>
<text x="510" y="157" font-size="13" fill="#ffffff">$ hello</text>
<rect x="564.6" y="144" width="8" height="18" fill="#d9dee3"/>
<text x="504" y="196" font-size="12" fill="#1f2933">The text reaches the</text>
<text x="504" y="212" font-size="12" fill="#1f2933">program in the console</text>
<text x="504" y="228" font-size="12" fill="#1f2933">you are using, as a</text>
<text x="504" y="244" font-size="12" fill="#1f2933">paste.</text>
<text x="740" y="76" font-size="12" fill="#1f2933">a program sends</text>
<rect x="740" y="86" width="192" height="28" fill="#ffffff" stroke="#9aa5b1" stroke-width="1"/>
<text x="748" y="105" font-size="12" fill="#1f2933">OSC 52 ; c ; ? ST</text>
<rect x="740" y="136" width="192" height="36" fill="#ffffff" stroke="#9aa5b1" stroke-width="1"/>
<rect x="740" y="136" width="192" height="36" fill="none" stroke="#1f2933" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="836" y="159" font-size="13" text-anchor="middle" fill="#1f2933">no reply</text>
<line x1="836" y1="114" x2="836" y2="134" stroke="#1f2933" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="740" y="200" font-size="12" fill="#1f2933">vtium answers nothing,</text>
<text x="740" y="216" font-size="12" fill="#1f2933">so no program can ask</text>
<text x="740" y="232" font-size="12" fill="#1f2933">vtium for what you</text>
<text x="740" y="248" font-size="12" fill="#1f2933">copied.</text>
</svg>
