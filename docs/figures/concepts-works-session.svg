<svg xmlns="http://www.w3.org/2000/svg" width="960" height="468" viewBox="0 0 960 468" font-family="DejaVu Sans Mono, monospace">
<title>The life of one console's session, as a state machine</title>
<rect width="960" height="468" fill="#ffffff"/>
<defs>
<marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="#1f2933"/></marker>
</defs>
<!-- the start -->
<circle cx="13" cy="160" r="6" fill="#1f2933"/>
<line x1="19" y1="160" x2="38" y2="160" stroke="#1f2933" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="40" y="112" width="160" height="96" rx="10" fill="#ffffff" stroke="#2f6fb0" stroke-width="2"/>
<text x="120" y="136" font-size="14" text-anchor="middle" fill="#1f2933">not started</text>
<text x="120" y="156" font-size="12" text-anchor="middle" fill="#1f2933">the console waits</text>
<text x="120" y="172" font-size="12" text-anchor="middle" fill="#1f2933">for its VT and</text>
<text x="120" y="188" font-size="12" text-anchor="middle" fill="#1f2933">a display</text>
<line x1="200" y1="160" x2="328" y2="160" stroke="#1f2933" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="264" y="136" font-size="12" text-anchor="middle" fill="#1f2933">VT shown and</text>
<text x="264" y="152" font-size="12" text-anchor="middle" fill="#1f2933">a display set up</text>
<!-- running -->
<rect x="330" y="100" width="230" height="120" rx="10" fill="#ffffff" stroke="#2f6fb0" stroke-width="2"/>
<text x="445" y="124" font-size="14" text-anchor="middle" fill="#1f2933">running</text>
<text x="445" y="146" font-size="12" text-anchor="middle" fill="#1f2933">vtium's child, login,</text>
<text x="445" y="162" font-size="12" text-anchor="middle" fill="#1f2933">runs on the pty: the</text>
<text x="445" y="178" font-size="12" text-anchor="middle" fill="#1f2933">login prompt, then the</text>
<text x="445" y="194" font-size="12" text-anchor="middle" fill="#1f2933">user's shell</text>
<path d="M 400 100 L 400 70 L 520 70 L 520 98" fill="none" stroke="#1f2933" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="460" y="30" font-size="12" text-anchor="middle" fill="#1f2933">the child exits, or vtium hangs it up:</text>
<text x="460" y="46" font-size="12" text-anchor="middle" fill="#1f2933">vtium resets the screen and starts</text>
<text x="460" y="62" font-size="12" text-anchor="middle" fill="#1f2933">login again on a new pty</text>
<!-- ended -->
<line x1="560" y1="128" x2="718" y2="128" stroke="#1f2933" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="639" y="104" font-size="12" text-anchor="middle" fill="#1f2933">the child exits</text>
<text x="639" y="120" font-size="12" text-anchor="middle" fill="#1f2933">under oneshot</text>
<rect x="720" y="88" width="224" height="80" rx="10" fill="#ffffff" stroke="#2f6fb0" stroke-width="2"/>
<text x="832" y="112" font-size="14" text-anchor="middle" fill="#1f2933">ended</text>
<text x="832" y="132" font-size="12" text-anchor="middle" fill="#1f2933">the console starts</text>
<text x="832" y="148" font-size="12" text-anchor="middle" fill="#1f2933">nothing more</text>
<!-- gave up -->
<line x1="560" y1="200" x2="718" y2="200" stroke="#1f2933" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="568" y="222" font-size="12" fill="#1f2933">the 6th exit in</text>
<text x="568" y="238" font-size="12" fill="#1f2933">a row, each within</text>
<text x="568" y="254" font-size="12" fill="#1f2933">2 s of its start</text>
<rect x="720" y="184" width="224" height="128" rx="10" fill="#ffffff" stroke="#2f6fb0" stroke-width="2"/>
<text x="832" y="208" font-size="14" text-anchor="middle" fill="#1f2933">vtium gives up</text>
<text x="832" y="228" font-size="12" text-anchor="middle" fill="#1f2933">open policy: vtium</text>
<text x="832" y="244" font-size="12" text-anchor="middle" fill="#1f2933">exits with status 1</text>
<text x="832" y="268" font-size="12" text-anchor="middle" fill="#1f2933">closed policy: vtium</text>
<text x="832" y="284" font-size="12" text-anchor="middle" fill="#1f2933">holds the VT with a</text>
<text x="832" y="300" font-size="12" text-anchor="middle" fill="#1f2933">notice, takes no input</text>
<!-- kept -->
<line x1="410" y1="220" x2="410" y2="338" stroke="#1f2933" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="402" y="272" font-size="12" text-anchor="end" fill="#1f2933">vtium crashes</text>
<text x="402" y="288" font-size="12" text-anchor="end" fill="#1f2933">or restarts</text>
<line x1="490" y1="338" x2="490" y2="222" stroke="#1f2933" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="498" y="272" font-size="12" fill="#1f2933">the next vtium</text>
<text x="498" y="288" font-size="12" fill="#1f2933">takes the pty back</text>
<rect x="330" y="340" width="230" height="88" rx="10" fill="#ffffff" stroke="#2f6fb0" stroke-width="2"/>
<text x="445" y="364" font-size="14" text-anchor="middle" fill="#1f2933">kept</text>
<text x="445" y="384" font-size="12" text-anchor="middle" fill="#1f2933">no vtium runs; the</text>
<text x="445" y="400" font-size="12" text-anchor="middle" fill="#1f2933">keeper holds the pty:</text>
<text x="445" y="416" font-size="12" text-anchor="middle" fill="#1f2933">the fd store or vtium hold</text>
<!-- note -->
<text x="24" y="452" font-size="12" fill="#1f2933">Each console of each head has a session of its own, which moves through these states alone.</text>
</svg>
