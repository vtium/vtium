<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1000" viewBox="0 0 960 1000" font-family="DejaVu Sans Mono, monospace">
<title>vtium's processes, their threads, and the channels between them</title>
<rect width="960" height="1000" fill="#ffffff"/>
<defs>
<marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="#1f2933"/></marker>
</defs>
<!-- the system's services -->
<rect x="16" y="16" width="928" height="132" fill="#eef0f2" stroke="#9aa5b1" stroke-width="1"/>
<text x="32" y="38" font-size="15" fill="#1f2933">outside vtium: the system's services</text>
<rect x="32" y="52" width="218" height="80" fill="#ffffff" stroke="#9aa5b1" stroke-width="1"/>
<text x="141" y="74" font-size="14" text-anchor="middle" fill="#1f2933">udev</text>
<text x="141" y="94" font-size="13" text-anchor="middle" fill="#1f2933">reports each device</text>
<text x="141" y="112" font-size="13" text-anchor="middle" fill="#1f2933">that comes or goes</text>
<rect x="316" y="52" width="184" height="80" fill="#ffffff" stroke="#9aa5b1" stroke-width="1"/>
<text x="408" y="74" font-size="14" text-anchor="middle" fill="#1f2933">seatd or logind</text>
<text x="408" y="94" font-size="13" text-anchor="middle" fill="#1f2933">through libseat,</text>
<text x="408" y="112" font-size="13" text-anchor="middle" fill="#1f2933">in the libseat build</text>
<rect x="516" y="52" width="184" height="80" fill="#ffffff" stroke="#9aa5b1" stroke-width="1"/>
<text x="608" y="74" font-size="14" text-anchor="middle" fill="#1f2933">D-Bus services</text>
<text x="608" y="94" font-size="13" text-anchor="middle" fill="#1f2933">logind, systemd,</text>
<text x="608" y="112" font-size="13" text-anchor="middle" fill="#1f2933">localed; in the</text>
<text x="608" y="128" font-size="13" text-anchor="middle" fill="#1f2933">logind build</text>
<rect x="716" y="52" width="228" height="80" fill="#ffffff" stroke="#9aa5b1" stroke-width="1"/>
<text x="830" y="74" font-size="14" text-anchor="middle" fill="#1f2933">systemd, PID 1</text>
<text x="830" y="94" font-size="13" text-anchor="middle" fill="#1f2933">starts vtium@ttyN,</text>
<text x="830" y="112" font-size="13" text-anchor="middle" fill="#1f2933">keeps the fd store</text>
<!-- channels from the services -->
<path d="M 250 92 L 282 92 L 282 244 L 298 244" fill="none" stroke="#1f2933" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="276" y="176" font-size="12" text-anchor="end" fill="#1f2933">added,</text>
<text x="276" y="192" font-size="12" text-anchor="end" fill="#1f2933">removed</text>
<line x1="408" y1="134" x2="408" y2="230" stroke="#1f2933" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<text x="416" y="176" font-size="12" fill="#1f2933">devices; enable,</text>
<text x="416" y="192" font-size="12" fill="#1f2933">disable</text>
<line x1="608" y1="134" x2="608" y2="230" stroke="#1f2933" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<text x="616" y="176" font-size="12" fill="#1f2933">method calls,</text>
<text x="616" y="192" font-size="12" fill="#1f2933">localed's signal</text>
<path d="M 830 134 L 830 262 L 702 262" fill="none" stroke="#1f2933" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<text x="838" y="176" font-size="12" fill="#1f2933">READY=1;</text>
<text x="838" y="192" font-size="12" fill="#1f2933">pty masters</text>
<text x="838" y="208" font-size="12" fill="#1f2933">in and out</text>
<!-- the kernel -->
<rect x="16" y="232" width="170" height="330" fill="#eef0f2" stroke="#9aa5b1" stroke-width="1"/>
<text x="28" y="254" font-size="15" fill="#1f2933">the kernel</text>
<rect x="28" y="268" width="146" height="52" fill="#ffffff" stroke="#9aa5b1" stroke-width="1"/>
<text x="101" y="290" font-size="14" text-anchor="middle" fill="#1f2933">the VT</text>
<text x="101" y="308" font-size="13" text-anchor="middle" fill="#1f2933">/dev/ttyN</text>
<rect x="28" y="340" width="146" height="52" fill="#ffffff" stroke="#9aa5b1" stroke-width="1"/>
<text x="101" y="362" font-size="14" text-anchor="middle" fill="#1f2933">KMS/DRM card</text>
<text x="101" y="380" font-size="13" text-anchor="middle" fill="#1f2933">or fbdev</text>
<rect x="28" y="412" width="146" height="52" fill="#ffffff" stroke="#9aa5b1" stroke-width="1"/>
<text x="101" y="434" font-size="14" text-anchor="middle" fill="#1f2933">evdev devices</text>
<text x="101" y="452" font-size="13" text-anchor="middle" fill="#1f2933">keys, pointers</text>
<rect x="28" y="484" width="146" height="52" fill="#ffffff" stroke="#9aa5b1" stroke-width="1"/>
<text x="101" y="506" font-size="14" text-anchor="middle" fill="#1f2933">/dev/kmsg</text>
<text x="101" y="524" font-size="13" text-anchor="middle" fill="#1f2933">kernel messages</text>
<line x1="174" y1="306" x2="298" y2="306" stroke="#1f2933" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<text x="180" y="282" font-size="12" fill="#1f2933">mode ioctls,</text>
<text x="180" y="296" font-size="12" fill="#1f2933">SIGUSR1, SIGUSR2</text>
<line x1="174" y1="366" x2="298" y2="366" stroke="#1f2933" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<text x="180" y="344" font-size="12" fill="#1f2933">buffers,</text>
<text x="180" y="358" font-size="12" fill="#1f2933">page flips</text>
<line x1="174" y1="438" x2="298" y2="438" stroke="#1f2933" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="180" y="416" font-size="12" fill="#1f2933">key and pointer</text>
<text x="180" y="430" font-size="12" fill="#1f2933">events</text>
<line x1="174" y1="510" x2="298" y2="510" stroke="#1f2933" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="180" y="502" font-size="12" fill="#1f2933">messages</text>
<!-- the console process -->
<rect x="300" y="232" width="400" height="330" fill="#e6eef7" stroke="#2f6fb0" stroke-width="2"/>
<text x="316" y="256" font-size="14" fill="#1f2933">vtium: one process per VT, as root</text>
<rect x="316" y="272" width="184" height="274" fill="#ffffff" stroke="#9aa5b1" stroke-width="1"/>
<text x="328" y="294" font-size="14" fill="#1f2933">the event loop</text>
<text x="328" y="312" font-size="13" fill="#1f2933">on the main thread</text>
<text x="328" y="336" font-size="13" fill="#1f2933">serves the VT, the</text>
<text x="328" y="352" font-size="13" fill="#1f2933">devices, the ptys,</text>
<text x="328" y="368" font-size="13" fill="#1f2933">the image helper</text>
<text x="328" y="384" font-size="13" fill="#1f2933">and the timers</text>
<text x="328" y="412" font-size="12" fill="#2f6fb0">vtium</text>
<text x="328" y="428" font-size="12" fill="#2f6fb0">vtium-platform</text>
<text x="328" y="444" font-size="12" fill="#2f6fb0">vtium-term</text>
<text x="328" y="460" font-size="12" fill="#2f6fb0">vtium-parse</text>
<text x="328" y="476" font-size="12" fill="#2f6fb0">vtium-settings</text>
<text x="328" y="492" font-size="12" fill="#2f6fb0">vtium-devices</text>
<text x="328" y="508" font-size="12" fill="#2f6fb0">vtium-font</text>
<text x="328" y="524" font-size="12" fill="#2f6fb0">vtium-image (images)</text>
<rect x="556" y="272" width="128" height="140" fill="#ffffff" stroke="#9aa5b1" stroke-width="1"/>
<text x="620" y="294" font-size="13" text-anchor="middle" fill="#1f2933">render thread</text>
<text x="620" y="312" font-size="13" text-anchor="middle" fill="#1f2933">one per head</text>
<text x="620" y="336" font-size="12" text-anchor="middle" fill="#1f2933">composes each</text>
<text x="620" y="352" font-size="12" text-anchor="middle" fill="#1f2933">frame in the</text>
<text x="620" y="368" font-size="12" text-anchor="middle" fill="#1f2933">display's buffer</text>
<text x="620" y="396" font-size="12" text-anchor="middle" fill="#2f6fb0">vtium-render</text>
<rect x="556" y="428" width="128" height="118" fill="#ffffff" stroke="#9aa5b1" stroke-width="1"/>
<text x="620" y="450" font-size="13" text-anchor="middle" fill="#1f2933">font helper's</text>
<text x="620" y="468" font-size="13" text-anchor="middle" fill="#1f2933">threads:</text>
<text x="620" y="492" font-size="12" text-anchor="middle" fill="#1f2933">a writer,</text>
<text x="620" y="508" font-size="12" text-anchor="middle" fill="#1f2933">a reader and</text>
<text x="620" y="524" font-size="12" text-anchor="middle" fill="#1f2933">a reaper</text>
<line x1="500" y1="340" x2="556" y2="340" stroke="#1f2933" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<text x="528" y="332" font-size="12" text-anchor="middle" fill="#1f2933">frames</text>
<line x1="500" y1="488" x2="556" y2="488" stroke="#1f2933" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<text x="528" y="480" font-size="12" text-anchor="middle" fill="#1f2933">glyphs</text>
<!-- processes of vtium's beside the console -->
<rect x="780" y="296" width="164" height="84" fill="#e6eef7" stroke="#9aa5b1" stroke-width="1"/>
<text x="862" y="318" font-size="14" text-anchor="middle" fill="#1f2933">vtium hold</text>
<text x="862" y="338" font-size="13" text-anchor="middle" fill="#1f2933">keeps pty masters</text>
<text x="862" y="354" font-size="13" text-anchor="middle" fill="#1f2933">where systemd's</text>
<text x="862" y="370" font-size="13" text-anchor="middle" fill="#1f2933">store is missing</text>
<line x1="780" y1="338" x2="702" y2="338" stroke="#1f2933" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<text x="741" y="326" font-size="12" text-anchor="middle" fill="#1f2933">socket:</text>
<text x="741" y="356" font-size="12" text-anchor="middle" fill="#1f2933">keep, take</text>
<rect x="780" y="404" width="164" height="72" fill="#ffffff" stroke="#9aa5b1" stroke-width="1"/>
<text x="862" y="426" font-size="14" text-anchor="middle" fill="#1f2933">vtium blank,</text>
<text x="862" y="446" font-size="14" text-anchor="middle" fill="#1f2933">vtium wake</text>
<text x="862" y="466" font-size="13" text-anchor="middle" fill="#1f2933">run by root</text>
<line x1="780" y1="440" x2="702" y2="440" stroke="#1f2933" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="741" y="432" font-size="12" text-anchor="middle" fill="#1f2933">SIGRTMIN</text>
<text x="741" y="456" font-size="12" text-anchor="middle" fill="#1f2933">+1 or +2</text>
<!-- the pty -->
<line x1="408" y1="546" x2="408" y2="610" stroke="#1f2933" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<text x="400" y="584" font-size="12" text-anchor="end" fill="#1f2933">bytes both ways,</text>
<text x="400" y="600" font-size="12" text-anchor="end" fill="#1f2933">window size</text>
<rect x="330" y="612" width="156" height="52" fill="#eef0f2" stroke="#9aa5b1" stroke-width="1"/>
<text x="408" y="634" font-size="14" text-anchor="middle" fill="#1f2933">the pty</text>
<text x="408" y="652" font-size="12" text-anchor="middle" fill="#1f2933">a kernel device</text>
<line x1="408" y1="664" x2="408" y2="828" stroke="#1f2933" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<text x="416" y="724" font-size="12" fill="#1f2933">the session's</text>
<text x="416" y="740" font-size="12" fill="#1f2933">terminal</text>
<!-- the font helper -->
<line x1="620" y1="546" x2="620" y2="610" stroke="#1f2933" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<text x="612" y="584" font-size="12" text-anchor="end" fill="#1f2933">pipes: requests,</text>
<text x="612" y="600" font-size="12" text-anchor="end" fill="#1f2933">glyph sets back</text>
<rect x="530" y="612" width="184" height="148" fill="#e5f1e8" stroke="#9aa5b1" stroke-width="1"/>
<text x="622" y="634" font-size="14" text-anchor="middle" fill="#1f2933">vtium-config serve</text>
<text x="622" y="654" font-size="13" text-anchor="middle" fill="#1f2933">the font helper</text>
<text x="622" y="672" font-size="13" text-anchor="middle" fill="#1f2933">as nobody,</text>
<text x="622" y="690" font-size="13" text-anchor="middle" fill="#1f2933">in a sandbox;</text>
<text x="622" y="708" font-size="13" text-anchor="middle" fill="#1f2933">one per font set</text>
<text x="622" y="732" font-size="12" text-anchor="middle" fill="#2f6fb0">vtium-config,</text>
<text x="622" y="748" font-size="12" text-anchor="middle" fill="#2f6fb0">vtium-font</text>
<!-- the image helper -->
<path d="M 702 530 L 862 530 L 862 610" fill="none" stroke="#1f2933" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<text x="854" y="566" font-size="12" text-anchor="end" fill="#1f2933">socket pair:</text>
<text x="854" y="582" font-size="12" text-anchor="end" fill="#1f2933">requests, replies,</text>
<text x="854" y="598" font-size="12" text-anchor="end" fill="#1f2933">memory files</text>
<rect x="780" y="612" width="164" height="190" fill="#fbecd0" stroke="#9aa5b1" stroke-width="1"/>
<text x="862" y="634" font-size="14" text-anchor="middle" fill="#1f2933">vtium-image</text>
<text x="862" y="654" font-size="13" text-anchor="middle" fill="#1f2933">the image helper,</text>
<text x="862" y="672" font-size="13" text-anchor="middle" fill="#1f2933">as the session's</text>
<text x="862" y="690" font-size="13" text-anchor="middle" fill="#1f2933">user, sandboxed;</text>
<text x="862" y="708" font-size="13" text-anchor="middle" fill="#1f2933">one per console;</text>
<text x="862" y="726" font-size="13" text-anchor="middle" fill="#1f2933">the images build</text>
<text x="862" y="744" font-size="12" text-anchor="middle" fill="#2f6fb0">vtium-image-helper</text>
<rect x="792" y="752" width="140" height="42" fill="#ffffff" stroke="#9aa5b1" stroke-width="1"/>
<text x="862" y="770" font-size="12" text-anchor="middle" fill="#1f2933">decode workers,</text>
<text x="862" y="786" font-size="12" text-anchor="middle" fill="#1f2933">one per request</text>
<!-- the session -->
<rect x="300" y="816" width="644" height="104" fill="#fbecd0" stroke="#9aa5b1" stroke-width="1"/>
<rect x="330" y="830" width="156" height="52" fill="#ffffff" stroke="#9aa5b1" stroke-width="1"/>
<text x="408" y="852" font-size="14" text-anchor="middle" fill="#1f2933">/bin/login</text>
<text x="408" y="870" font-size="13" text-anchor="middle" fill="#1f2933">vtium's child</text>
<line x1="486" y1="856" x2="588" y2="856" stroke="#1f2933" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="537" y="848" font-size="12" text-anchor="middle" fill="#1f2933">starts</text>
<rect x="590" y="830" width="260" height="52" fill="#ffffff" stroke="#9aa5b1" stroke-width="1"/>
<text x="720" y="852" font-size="14" text-anchor="middle" fill="#1f2933">the user's shell</text>
<text x="720" y="870" font-size="13" text-anchor="middle" fill="#1f2933">and its programs</text>
<text x="316" y="908" font-size="13" fill="#1f2933">runs as the user who logs in</text>
<!-- legend -->
<rect x="24" y="940" width="24" height="14" fill="#e6eef7" stroke="#9aa5b1" stroke-width="1"/>
<text x="56" y="952" font-size="13" fill="#1f2933">as root</text>
<rect x="140" y="940" width="24" height="14" fill="#fbecd0" stroke="#9aa5b1" stroke-width="1"/>
<text x="172" y="952" font-size="13" fill="#1f2933">as the session's user</text>
<rect x="360" y="940" width="24" height="14" fill="#e5f1e8" stroke="#9aa5b1" stroke-width="1"/>
<text x="392" y="952" font-size="13" fill="#1f2933">as nobody, sandboxed</text>
<rect x="572" y="940" width="24" height="14" fill="#eef0f2" stroke="#9aa5b1" stroke-width="1"/>
<text x="604" y="952" font-size="13" fill="#1f2933">the kernel, the services</text>
<line x1="24" y1="976" x2="64" y2="976" stroke="#1f2933" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="76" y="981" font-size="13" fill="#1f2933">a channel, labelled with what crosses it</text>
</svg>
