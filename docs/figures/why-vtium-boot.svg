<svg xmlns="http://www.w3.org/2000/svg" width="872" height="520" viewBox="0 0 872 520" font-family="DejaVu Sans Mono, monospace">
<title>Where vtium sits in the boot of a Linux machine, beside the kernel's own console</title>
<rect width="872" height="520" fill="#ffffff"/>
<defs>
<marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="#1f2933"/></marker>
</defs>
<text x="384" y="40" font-size="15" text-anchor="middle" fill="#1f2933">the kernel's console alone</text>
<text x="704" y="40" font-size="15" text-anchor="middle" fill="#1f2933">with vtium</text>
<g font-size="13" fill="#1f2933">
<text x="24" y="104">1. power on</text>
<text x="24" y="184">2. init starts</text>
<text x="24" y="264">3. on each text VT</text>
<text x="24" y="344">4. after login</text>
<text x="24" y="424">5. a desktop, if</text>
<text x="24" y="442">   there is one</text>
</g>
<rect x="240" y="72" width="608" height="56" fill="#fbecd0" stroke="#9aa5b1" stroke-width="1"/>
<text x="544" y="96" font-size="14" text-anchor="middle" fill="#1f2933">the kernel starts, and its own console,</text>
<text x="544" y="116" font-size="14" text-anchor="middle" fill="#1f2933">fbcon, shows its messages</text>
<rect x="240" y="152" width="608" height="56" fill="#fbecd0" stroke="#9aa5b1" stroke-width="1"/>
<text x="544" y="176" font-size="14" text-anchor="middle" fill="#1f2933">init starts the services:</text>
<text x="544" y="196" font-size="14" text-anchor="middle" fill="#1f2933">systemd, sysvinit or another init</text>
<rect x="240" y="232" width="288" height="56" fill="#fbecd0" stroke="#9aa5b1" stroke-width="1"/>
<text x="384" y="256" font-size="14" text-anchor="middle" fill="#1f2933">getty prints a login</text>
<text x="384" y="276" font-size="14" text-anchor="middle" fill="#1f2933">prompt, fbcon draws it</text>
<rect x="560" y="232" width="288" height="56" fill="#e6eef7" stroke="#2f6fb0" stroke-width="2"/>
<text x="704" y="256" font-size="14" text-anchor="middle" fill="#1f2933">vtium takes the VT and</text>
<text x="704" y="276" font-size="14" text-anchor="middle" fill="#1f2933">the display, starts login</text>
<rect x="240" y="312" width="288" height="56" fill="#fbecd0" stroke="#9aa5b1" stroke-width="1"/>
<text x="384" y="336" font-size="14" text-anchor="middle" fill="#1f2933">a shell, drawn by</text>
<text x="384" y="356" font-size="14" text-anchor="middle" fill="#1f2933">the kernel's console</text>
<rect x="560" y="312" width="288" height="56" fill="#e6eef7" stroke="#2f6fb0" stroke-width="2"/>
<text x="704" y="336" font-size="14" text-anchor="middle" fill="#1f2933">a shell, drawn by vtium</text>
<text x="704" y="356" font-size="14" text-anchor="middle" fill="#1f2933">in its own fonts and colors</text>
<rect x="240" y="400" width="608" height="56" fill="#ffffff" stroke="#9aa5b1" stroke-width="1"/>
<text x="544" y="424" font-size="14" text-anchor="middle" fill="#1f2933">a desktop runs on a VT of its own;</text>
<text x="544" y="444" font-size="14" text-anchor="middle" fill="#1f2933">Ctrl-Alt and a function key switch VTs</text>
<g stroke="#1f2933" stroke-width="1.5">
<line x1="384" y1="130" x2="384" y2="148" marker-end="url(#arrow)"/>
<line x1="704" y1="130" x2="704" y2="148" marker-end="url(#arrow)"/>
<line x1="384" y1="210" x2="384" y2="228" marker-end="url(#arrow)"/>
<line x1="704" y1="210" x2="704" y2="228" marker-end="url(#arrow)"/>
<line x1="384" y1="290" x2="384" y2="308" marker-end="url(#arrow)"/>
<line x1="704" y1="290" x2="704" y2="308" marker-end="url(#arrow)"/>
</g>
<path d="M 560 268 L 530 268" fill="none" stroke="#1f2933" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<text x="24" y="488" font-size="13" fill="#1f2933">The dashed arrow: when vtium cannot start, for example with no display, a getty takes its VT.</text>
</svg>
