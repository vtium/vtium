# /etc/vtium/heads.conf: the annotated reference to every option of the head
# file. As it stands it runs the builtin configuration, the one vtium runs with
# no head file: its active lines are default.conf's, and every other option is
# a comment. For a whole setup, start from a scenario file beside this one:
# default.conf, two-heads.conf, kiosk.conf, kiosk-admin.conf, stations.conf or
# off.conf. docs/heads.md explains the head file in full.
#
# Today's build does not read policy, isolated, roaming, off or
# when-display-lost yet, so it rejects this file and runs builtin, which is
# what the file means anyway.

# --- Reading this file ---
#
# A line starting "# " explains. A line starting "#" with no space after it is
# an example: delete the "#" to use it. Uncommenting any one example line, or
# the one example block, keeps the file valid; where examples exclude each
# other, the comment says to uncomment one of them.
#
# "#" starts a comment at the start of a line or after whitespace, and the
# comment runs to the end of the line. A "#" inside a word is part of the
# value, as in cmd --x#1, and "\#" gives a literal "#" after whitespace.
# Spaces around "=" and between tokens are dropped. A file holds at most
# 65536 bytes, and a line at most 8192.

# --- Installing and checking ---
#
# vtium reads the file only when root owns it and neither its group nor others
# can write it, whatever the group; /etc/vtium and each directory above it
# pass the same check. Install a file with:
#
#   install -d -o root -g root -m 0755 /etc/vtium
#   install -o root -g root -m 0644 heads.conf /etc/vtium/heads.conf
#
# Check a candidate first with "vtium check-config FILE". It exits 1 on an
# error or a warning about the file itself, and lists what depends on the
# devices present as notes, with exit status 0.
#
# vtium never alters a present file. An untrusted one runs builtin. A trusted
# file with errors runs what survives of it: under policy = open with
# builtin's input rules after it, else builtin; under policy = closed with
# nothing added, else nothing, and the panic screen on the boot display.

# --- version ---
#
# The head file's format. Required, and 1 is the only value. A file with no
# version, or a version vtium does not know, is invalid whole but for its
# policy: under open builtin runs, and under closed the panic screen shows.
# The top-level keys, version and policy, come before the first section, in
# any order.
version = 1

# --- policy ---
#
# open or closed: what the file gives anything it does not mention, as a
# firewall's default policy. Unset, open. The rules mean the same under
# either policy, and a key the file writes wins under both. The policy
# decides the rest:
#
#                              policy = open           policy = closed
#   an input no rule matches   roams                   is ignored
#   a head's isolated, unset   no                      yes
#   the rescue key and the     on                      off
#     anti-lockout guard
#   the rules light no         the boot display shows  the boot display shows
#     display                  the first head          a notice alone
#   no display at start        wait display-wait,      hold the VT and wait
#                              then exit to a getty    for a display
#
# A closed file with no heads keeps every display dark. A display no rule
# matches is off under either policy. A readable policy = closed wins over any
# other policy line, and once vtium has read it, nothing opens anything while
# vtium runs. A policy line vtium cannot read, inside a section or with an
# unknown value, counts as open and is an error.
#
# To close this file, change open to closed on the line below, and give head
# console isolated = no as well: closed isolates it, and an isolated head is
# never the active head, so no keyboard here would reach it.
policy = open

# --- [head NAME] ---
#
# Declares a head: a terminal for one or more displays, with its own grid,
# profile and consoles. Rules under [rules] give it its displays and inputs.
# NAME is 1 to 64 characters of A-Z a-z 0-9 . _ + -, and roaming, ignore and
# off are reserved. A file declares at most 16 heads. A head names no other
# head, only its profile. A key given twice in one section is an error, and
# the file has no sections but its heads and one [rules].
#
# The keys below belong to head console. Each is unset here, so the head has
# 1 console, the default profile, kmscon.conf's login, when-display-lost =
# keep and, under open, isolated = no.
[head console]

# profile: how the head looks, its font included. Unset, default, under
# either policy. Until a profile file format exists, a name other than
# default names a frit, vtium's font file /etc/vtium/fonts/NAME.vtfrit, and
# default is the compiled-in look. A frit that does not exist draws the
# default, with a warning from check-config. Uncomment one of these:
#profile = default
#profile = small

# consoles: how many consoles the head has, each a session with its own
# login, screen and scrollback. The console chords switch among them and
# never open or close one. Unset, 1, under either policy. From 1 to the
# head's cap, 4 a head and 8 for all heads together; kmscon.conf's
# head-consoles-max and consoles-max raise the caps, to at most 50. A value
# past the cap gives the cap, with a warning.
#consoles = 2

# login: the command each console runs, as kmscon.conf's login takes it.
# Unset, kmscon.conf's login, under either policy, which is /bin/login -p
# when kmscon.conf sets none. It runs as root: a program that is not a login
# drops its privileges itself, or is started through a tool that does.
#login = /usr/local/bin/kiosk

# when-display-lost: what the head's sessions do when its last display goes;
# a head with several displays keeps them while any remains. Unset, keep,
# under either policy.
#
#   keep             they run on unseen, and come back with a display the
#                    head's rules match
#   hangup           they are hung up at once: the pty closes and its
#                    processes get SIGHUP
#   hangup DURATION  a display back within DURATION brings them back, and
#                    after it they are hung up; DURATION is plain seconds,
#                    or a number with s, m or h: 30, 30s, 5m, 1h
#
# After a hang-up, a display returning starts the head's consoles afresh,
# each at its login. Uncomment one of these:
#when-display-lost = keep
#when-display-lost = hangup
#when-display-lost = hangup 30s

# isolated: yes or no. An isolated head gives up three rights together: its
# keyboards' Ctrl-Alt-F<n> and XF86Switch_VT_<n> for another VT reach its
# session as keys and never switch the VT; the rescue key never takes its
# keyboards away; and it is never the active head, so no roaming input
# reaches it. Its own keyboards still type into it. Unset, no under
# policy = open and yes under policy = closed. In this file every keyboard
# roams, so isolated = yes on the only head leaves no keyboard reaching it;
# isolated = no is what a closed file writes for a head with rights.
# Uncomment one of these:
#isolated = no
#isolated = yes

# A second head, as an example block: uncomment its three lines together.
# It shows on a display only once a rule names it, such as
# "display edid:BBB:0x0002:SMALL00001 -> panel" above the shipped rules;
# without one it declares a head with nothing to show. two-heads.conf is a
# whole setup with two heads.
#[head panel]
#consoles = 2
#when-display-lost = hangup 30s

# --- [rules] ---
#
# One rule a line: display MATCH -> TARGET, or input MATCH -> TARGET. Each
# display and each input walks the rules from the top on its own, and the
# first rule that matches it places it, so the order devices appear in never
# changes where they land, and a device plugged in later walks the same
# rules. A match is *, every display or every input, or one or more
# key:value tokens, every one of which must hold. A device no rule matches
# falls to the policy: a display is off, logged with the rule line that would
# claim it, and an input roams under open and is ignored under closed.
#
# Add rules above the shipped rules, where the examples are. A rule that an
# earlier rule leaves unreachable is a warning. A key not listed below, such
# as pth: for path:, or a value its key cannot take, is an error that drops
# the rule. A value that names no device present is no error: the rule
# matches nothing, and check-config notes it.
[rules]

# --- Match keys for inputs ---
#
# A strong key names one port or one unit; a weak one names whatever claims
# its identity. A key that needs udev reads udev's database, so it matches
# nothing on a system with no udev daemon, and check-config notes each rule
# that uses one.
#
# path: a USB port, by udev's ID_PATH up to the port. Strong. Needs udev.
#   It takes every interface of the device in that port and every device on
#   a hub plugged into it: ...usb-0:3.3 takes ...usb-0:3.3:1.0 and
#   ...usb-0:3.3.2:1.0, and never port 3.30. To find it:
#   udevadm info -q property -n /dev/input/event5 | grep ID_PATH=
#input path:pci-0000:15:00.0-usb-0:3.3 -> console
#
# serial: one unit wherever it is plugged, VENDOR:PRODUCT:SERIAL from udev's
#   ID_VENDOR_ID, ID_MODEL_ID and ID_SERIAL_SHORT, taking every interface of
#   that unit. Strong where the device has a serial. Needs udev.
#input serial:aaaa:0002:NUMPAD0001 -> console
#
# bluetooth: one Bluetooth device, by the address it reports as its unique
#   id. Strong once bonded. Works without udev.
#input bluetooth:aa:bb:cc:dd:ee:ff -> console
#
# id: every unit of a model, VENDOR:PRODUCT in hex. Weak: a device can report
#   another maker's id. Works without udev.
#input id:aaaa:0001 -> console
#
# name: a device by the name it reports, a glob. The weakest key: anything
#   can name itself so. Works without udev.
#input name:*AVRCP* -> ignore
#
# class: a kind of input, udev's input class: keyboard (every key from
#   Escape through S), key (any device with keys: numpads, macro pads, media
#   keys), mouse, touchpad, touchscreen, trackball, pointingstick, tablet,
#   tablet-pad, joystick, accelerometer or switch. No strength: it names a
#   kind of device, never one device. Works without udev, since vtium derives
#   the same classes itself; the shipped rules match by class alone, so they
#   mean the same either way.
#input class:tablet -> roaming
#
# udev: any udev property of the device, NAME=VALUE, a glob on the value, as
#   an administrator's udev rules and hwdb set it. As strong as the rule that
#   set it. Needs udev. The example patterns in /usr/share/doc/vtium/examples/
#   set VTIUM_HEAD, VTIUM_IGNORE and VTIUM_ROLE, and do nothing until copied
#   into /etc/udev.
#input udev:VTIUM_IGNORE=1 -> ignore

# --- Match keys for displays ---
#
# edid: one monitor, MAKER:PRODUCT:SERIAL from its EDID: the PNP maker id,
#   the product code in hex, and the serial string, else the serial number.
#   Strong, and the key to use for a display; an EDID emulator can copy it.
#   Two monitors of one model that report serial 0 both match one edid rule.
#   Works without udev. /sys/class/drm/card*-*/edid holds the EDID, and a
#   decoder such as edid-decode prints the values.
#display edid:AAA:0x0001:LARGE00001 -> console
#
# connector: a port of a graphics card, CARD/CONNECTOR: the card's udev
#   ID_PATH and the kernel's connector name, globs allowed. Strong where the
#   name is stable: a DisplayPort multi-stream connector's name, such as
#   DP-8, can change after a replug or a resume. Needs udev.
#display connector:pci-0000:03:00.0/HDMI-A-* -> off
#
# connector-path: one port of a DisplayPort multi-stream hub, by the
#   connector's PATH property, which stays the same across a replug or a
#   resume. Strong. Works without udev.
#display connector-path:mst:83-1 -> console
#
# card: every output of a graphics card, by its udev ID_PATH, a glob; never
#   cardN, whose number can change between boots. Strong. Needs udev.
#display card:pci-0000:00:02.0 -> off

# --- Combining keys ---
#
# path plus serial binds that unit in that port, the strongest binding for
# an input: use it where the device has a serial, path alone otherwise, and
# id or name alone only for convenience, never for a head whose sessions
# need protecting; check-config notes a rule that does. For a display, use
# edid, with connector-path where a multi-stream connector must be told
# apart, and add connector where two monitors share an EDID.
#input path:pci-0000:15:00.0-usb-0:3.1 serial:eeee:0001:KBD0000001 -> console
#display connector:pci-0000:03:00.0/DP-1 edid:BBB:0x0002:SMALL00001 -> console

# --- Targets ---
#
# A head's name, for a display or an input: the device belongs to that head.
#   A display shows it; a keyboard types into it alone, and its console
#   chords switch that head's consoles.
# roaming, for an input: no head owns it, and it types into the active head,
#   which the roaming chord moves; with no active head it delivers nothing.
#   A rule to roaming means the same under either policy, which is how a
#   closed file lends a port to a head with rights.
# ignore, for an input: nothing it sends is delivered. Under open vtium opens
#   a keyboard sent here only to watch for the rescue key; under closed it
#   opens none.
# off, for a display: vtium sets its connector off, so it shows nothing, a
#   frame another program left included, and logs it.
#
# Rules to roaming and to ignore, by port:
#input path:pci-0000:15:00.0-usb-0:3.2 -> roaming
#input path:pci-0000:15:00.0-usb-0:3.4.2 -> ignore

# --- The shipped rules ---
#
# builtin's rules: every display shows head console, mirrored, and every
# keyboard, pointer and other key device roams, typing into it; every other
# input, a joystick, tablet, switch or accelerometer, is ignored. The last
# rule places every input itself, so in this file the policy's input default
# never applies. kmscon.conf's mouse off drops the pointer rules.
display * -> console
input class:keyboard -> roaming
input class:mouse -> roaming
input class:touchpad -> roaming
input class:touchscreen -> roaming
input class:trackball -> roaming
input class:pointingstick -> roaming
input class:key -> roaming
input * -> ignore
