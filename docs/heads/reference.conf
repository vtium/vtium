# /etc/vtium/heads.conf: annotated reference.
#
# This is the builtin configuration with every other option written out as a
# comment. The active lines are default.conf's, so installing this file
# changes nothing: vtium runs exactly what it runs with no file at all.
#
# For a whole setup, start from a scenario file instead: default.conf,
# two-heads.conf, kiosk.conf, kiosk-admin.conf, stations.conf or off.conf.
# docs/heads.md has the long explanation.
#
# Today's build doesn't parse policy, isolated, roaming, off or
# when-display-lost. It rejects this file and runs builtin, which is what the
# file says anyway.

# --- Reading this file ---
#
# "# " lines are commentary. A "#" followed directly by text is an example:
# delete the "#" to enable it. Any single example line, or the one example
# block, can be enabled on its own and the file stays valid. Where two
# examples conflict, the comment says to pick one.
#
# A "#" at the start of a line or after whitespace starts a comment that runs
# to the end of the line. A "#" inside a word is data, so cmd --x#1 keeps it.
# Write "\#" for a literal "#" after whitespace. Whitespace around "=" and
# between tokens is ignored. Limits: 65536 bytes a file, 8192 a line.

# --- Installing and checking ---
#
# vtium reads this file only if root owns it and neither group nor other can
# write it. The group doesn't matter; a group write bit does. /etc/vtium and
# every directory above it get the same check. Fail it and vtium ignores the
# file and runs builtin. This file decides which keyboard reaches a root
# login, and a file someone else can edit is theirs, not root's.
#
#   install -d -o root -g root -m 0755 /etc/vtium
#   install -o root -g root -m 0644 heads.conf /etc/vtium/heads.conf
#
# Run "vtium check-config FILE" before you install. Exit 1 means an error or a
# warning in the file itself. Findings that depend on the hardware plugged in
# are notes and leave the exit status at 0.
#
# vtium never edits, renames or replaces a file you wrote, broken or not. A
# trusted file with errors runs what survives. Under policy = open, builtin's
# input rules are appended, and if nothing survives you get builtin. Under
# policy = closed, nothing is appended, and if nothing survives you get the
# panic screen on the boot display and no input at all.

# --- version ---
#
# The format version. Required. The only value is 1. Missing or unknown, the
# whole file is invalid except its policy line, which vtium still reads so it
# knows how to fail: open runs builtin, closed shows the panic screen.
#
# version and policy are the top-level keys. They go before the first
# section, in either order.
version = 1

# --- policy ---
#
# open or closed. This is the file's default policy, as a firewall has one:
# it decides what happens to anything the file doesn't mention. The rules
# mean the same under both, and a key you write overrides it. Unset, open.
#
#                              policy = open           policy = closed
#   an input no rule matches   roams                   is ignored
#   a head's isolated, unset   no                      yes
#   rescue key, anti-lockout   on                      off
#   rules light no display     boot display shows      boot display shows
#                              the first head          a notice only
#   no display at start        wait display-wait,      hold the VT and wait
#                              then exit to a getty    for a display
#
# A display no rule matches is off under both. A closed file with no heads
# keeps every display dark.
#
# An open file fails by leaking: forget a rule and a stranger's keyboard types
# into your session. A closed file fails by locking out: forget a rule and
# your own keyboard is dead. Set closed wrong and you've locked yourself out.
# vtium won't save you; ssh will, or a serial getty, or another boot medium.
# Run check-config, and have that other way in before you reboot.
#
# Closed is sticky. One readable policy = closed among the top-level keys
# beats every other policy line. While vtium runs closed, a reload applies
# only a valid closed file; anything else, a valid open file included, is
# logged and ignored, and going from closed to open takes a restart of vtium.
# While it runs open, a reload applies any valid file, closed included.
# Reload isn't built yet. A policy line vtium can't parse, inside a section or
# with a bad value, counts as open and is an error.
#
# To close this file, change open to closed below and add isolated = no to
# head console. Without it, console is isolated, so it is never the active
# head, and every keyboard here roams to nothing.
policy = open

# --- [head NAME] ---
#
# A head is one terminal: its own grid, profile and consoles, shown on the
# displays the rules give it and typed into by the inputs the rules give it.
# NAME is 1 to 64 characters from A-Z a-z 0-9 . _ + -. roaming, ignore and off
# are targets, so they can't be head names. At most 16 heads. A head refers to
# nothing but its profile; no head names another.
#
# A key twice in one section is an error. The only sections are the heads and
# a single [rules].
#
# Every key below is commented out, so head console gets 1 console, the
# default profile, kmscon.conf's login, when-display-lost = keep and, under
# open, isolated = no.
[head console]

# profile: what the head looks like, font included. Unset: default, under
# both policies. There's no profile file format yet, so any name other than
# default picks the frit /etc/vtium/fonts/NAME.vtfrit; default is the
# compiled-in look. Name a frit that doesn't exist and you get the default
# frit and a check-config warning. Pick one:
#profile = default
#profile = small

# consoles: how many consoles the head has. Each is its own session, with its
# own login, screen and scrollback. The count is fixed: the console chords
# switch between them and never open or close one. Unset: 1, under both
# policies. Range 1 to the cap, 4 a head and 8 across all heads; kmscon.conf's
# head-consoles-max and consoles-max raise the caps to at most 50. Ask for
# more than the cap and you get the cap and a warning. Every console costs
# memory, and on a small machine the caps bind.
#consoles = 2

# login: the command each console runs, parsed as kmscon.conf's login is.
# Unset: kmscon.conf's login, under both policies, which defaults to
# /bin/login -p. It runs as root. A kiosk program that isn't a login drops
# privileges itself or is started through something that does. Get this
# wrong and whoever sits at the kiosk is root.
#login = /usr/local/bin/kiosk

# when-display-lost: what happens to the head's sessions when its last
# display goes away. A head mirrored on several displays keeps its sessions
# while any one of them remains. Unset: keep, under both policies.
#
#   keep             sessions keep running unseen, and come back on a display
#                    the head's rules match
#   hangup           sessions are hung up at once: the pty closes and its
#                    processes get SIGHUP
#   hangup DURATION  a display back within DURATION resumes them; after that
#                    they are hung up. DURATION is plain seconds, or a number
#                    with s, m or h: 30, 30s, 5m, 1h
#
# keep is the default because the kernel console behaves the same way: a
# monitor that sleeps, a KVM switch or a pulled cable doesn't kill your shell.
# The price is a session left logged in with nobody watching it. If people
# walk away from this display, use hangup. After a hang-up, a display coming
# back starts fresh consoles at their login. Pick one:
#when-display-lost = keep
#when-display-lost = hangup
#when-display-lost = hangup 30s

# isolated: yes or no. An isolated head gives up three rights, all together:
#   - Ctrl-Alt-F<n> and XF86Switch_VT_<n> pressed on its keyboards reach its
#     session as keys and never switch the VT;
#   - the rescue key never takes its keyboards away;
#   - it is never the active head, so no roaming input reaches it.
# Its own keyboards still type into it. Unset: no under open, yes under
# closed.
#
# A VT switch changes what every display shows, so on a machine several people
# share, one person's Ctrl-Alt-F<n> switches everyone's screen. Isolation
# stops that. In this file every keyboard roams, so isolated = yes on the only
# head leaves no keyboard reaching it. isolated = no is the line a closed file
# writes for the head that keeps its rights. Pick one:
#isolated = no
#isolated = yes

# Example block: a second head. Enable all three lines together. It shows
# nothing until a rule sends a display to it, such as
# "display edid:BBB:0x0002:SMALL00001 -> panel" above the shipped rules.
# two-heads.conf is a complete setup with two heads.
#[head panel]
#consoles = 2
#when-display-lost = hangup 30s

# --- [rules] ---
#
# One rule a line: display MATCH -> TARGET, or input MATCH -> TARGET. First
# match wins. Each display and each input walks the list from the top by
# itself and stops at the first rule that matches it. Other devices, and the
# order the kernel reported them in, don't change the result, so a device
# hotplugged later lands where it would have landed at boot.
#
# MATCH is * for every device of that kind, or one or more key:value tokens
# that must all hold. A device nothing matches falls to the policy: a display
# is turned off and logged with the rule line that would claim it; an input
# roams under open and is ignored under closed.
#
# New rules go above the shipped rules, where the examples are. A rule an
# earlier one makes unreachable is a warning. An unknown key, such as pth:
# for path:, or a value the key can't take, is an error and drops that rule.
# A value that matches nothing plugged in is not an error: the rule never
# fires, and check-config notes it.
[rules]

# --- Match keys for inputs ---
#
# Strong keys name one port or one physical unit. Weak keys name whatever
# claims an identity, and devices lie. Keys that need udev read udev's
# database; with no udev daemon they match nothing, and check-config says
# which rules use them.
#
# path: a USB port, by udev's ID_PATH up to the port. Strong. Needs udev.
#   Matches every interface of the device in that port and everything on a
#   hub plugged into it: ...usb-0:3.3 matches ...usb-0:3.3:1.0 and
#   ...usb-0:3.3.2:1.0, never port 3.30. To read it:
#   udevadm info -q property -n /dev/input/event5 | grep ID_PATH=
#input path:pci-0000:15:00.0-usb-0:3.3 -> console
#
# serial: one unit wherever it's plugged in, VENDOR:PRODUCT:SERIAL from udev's
#   ID_VENDOR_ID, ID_MODEL_ID and ID_SERIAL_SHORT. Matches every interface of
#   that unit. Strong if the device has a serial. Needs udev.
#input serial:aaaa:0002:NUMPAD0001 -> console
#
# bluetooth: one Bluetooth device, by the address it reports as its unique
#   id. Strong once bonded. Works without udev.
#input bluetooth:aa:bb:cc:dd:ee:ff -> console
#
# id: every unit of a model, VENDOR:PRODUCT in hex. Weak: a keyboard can
#   report another maker's ids. Works without udev.
#input id:aaaa:0001 -> console
#
# name: the name the device reports, as a glob. Weakest: any device can call
#   itself anything. Works without udev.
#input name:*AVRCP* -> ignore
#
# class: what kind of input it is, as udev classifies it: keyboard (has every
#   key from Escape through S), key (has any key at all: numpads, macro pads,
#   media keys), mouse, touchpad, touchscreen, trackball, pointingstick,
#   tablet, tablet-pad, joystick, accelerometer or switch. No strength: it
#   names a kind, not a device. Works without udev, because vtium applies
#   udev's classification itself. The shipped rules use class alone, so
#   builtin behaves the same with or without udev.
#input class:tablet -> roaming
#
# udev: any udev property, NAME=VALUE, a glob on the value. For anything
#   vtium's own keys don't cover: classify the device in udev, match the
#   result here. As strong as the udev rule that set it. Needs udev.
#   /usr/share/doc/vtium/examples/ has rules that set VTIUM_HEAD, VTIUM_IGNORE
#   and VTIUM_ROLE; they do nothing until you copy them into /etc/udev.
#input udev:VTIUM_IGNORE=1 -> ignore

# --- Match keys for displays ---
#
# edid: one monitor, MAKER:PRODUCT:SERIAL from its EDID: the PNP maker id,
#   the product code in hex, and the serial string, else the serial number.
#   Strong. Use this for displays. An EDID emulator can copy it, and two
#   monitors of one model that both report serial 0 both match it. Works
#   without udev. Read it from /sys/class/drm/card*-*/edid with a decoder such
#   as edid-decode.
#display edid:AAA:0x0001:LARGE00001 -> console
#
# connector: a port on a graphics card, CARD/CONNECTOR: the card's udev
#   ID_PATH and the kernel's connector name, globs allowed. Strong if the name
#   is stable. A DisplayPort multi-stream connector's name, DP-8 say, is
#   handed out when the display is detected and can change across a replug
#   or a resume. Needs udev.
#display connector:pci-0000:03:00.0/HDMI-A-* -> off
#
# connector-path: one port of a DisplayPort multi-stream hub, by the
#   connector's PATH property, which survives a replug or a resume. Strong.
#   Works without udev.
#display connector-path:mst:83-1 -> console
#
# card: every output of one graphics card, by its udev ID_PATH, a glob. Not
#   cardN: those numbers can change between boots. Strong. Needs udev.
#display card:pci-0000:00:02.0 -> off

# --- Combining keys ---
#
# Every token on a rule must match. path plus serial pins that unit to that
# port, the strongest binding there is. Use it when the device has a serial,
# and path alone when it doesn't. id and name alone are for convenience. Don't
# use them for a head whose sessions matter: anyone who plugs in the same
# model, or a device claiming to be one, gets in. check-config notes a rule
# that does. For displays, use edid, add connector-path to tell multi-stream
# ports apart, and add connector when two monitors share an EDID.
#input path:pci-0000:15:00.0-usb-0:3.1 serial:eeee:0001:KBD0000001 -> console
#display connector:pci-0000:03:00.0/DP-1 edid:BBB:0x0002:SMALL00001 -> console

# --- Targets ---
#
# A head's name, for displays and inputs: the device belongs to that head. A
#   display shows it. A keyboard types into it and nothing else, and its
#   console chords switch that head's consoles.
# roaming, inputs only: no head owns the device. It types into the active
#   head, which the roaming chord moves; with no active head it delivers
#   nothing. A rule to roaming means the same under either policy, and that
#   is how a closed file lends one port to the head that keeps its rights.
# ignore, inputs only: nothing the device sends is delivered. Under open vtium
#   still opens an ignored keyboard, only to watch it for the rescue key.
#   Under closed it never opens it.
# off, displays only: vtium turns the connector off, so it shows nothing,
#   including whatever another program left on it, and logs it.
#
# Rules to roaming and to ignore, by port:
#input path:pci-0000:15:00.0-usb-0:3.2 -> roaming
#input path:pci-0000:15:00.0-usb-0:3.4.2 -> ignore

# --- The shipped rules ---
#
# These are builtin's rules. Every display shows head console, mirrored.
# Every keyboard, pointer and other key device roams, which with one head
# means it types into console. Joysticks, tablets, switches and accelerometers
# are ignored. udev marks a numpad and an OTP token as keyboards, so they roam
# too, and a console login can need the token. The last rule places every
# input left, so in this file the policy's default for unmatched inputs never
# applies. kmscon.conf's mouse off removes the pointer rules.
display * -> console
input class:keyboard -> roaming
input class:mouse -> roaming
input class:touchpad -> roaming
input class:touchscreen -> roaming
input class:trackball -> roaming
input class:pointingstick -> roaming
input class:key -> roaming
input * -> ignore
