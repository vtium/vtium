<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" width="960" height="700" font-family="DejaVu Sans, Verdana, sans-serif" font-size="14">
  <title>The site's sections, sorted by what the reader is doing</title>
  <desc>A map of the documentation site. Across the top, the Home section: the home page and the showcase. In the middle, four boxes in a two by two grid. The left column holds pages that teach by doing, the right column pages that explain; the top row is for a reader who is learning, the bottom row for a reader at work. Tutorials, top left: Try vtium on one VT, and Your first frit. Explanation, top right: Why vtium, and Concepts. How-to guides, bottom left: Install vtium and give it VTs, Configure vtium, Choose a font, Set up heads, and Find out what went wrong. Reference, bottom right: What vtium does, Keys, Configuration keys, The head file, Modes, systemd and PID 1, and Specimens. Across the bottom, two more sections: Decisions, the decision records reached through their index, and For contributors: Architecture, The C reference, The VT review, and links to AGENTS.md and CONTRIBUTING.md on GitHub. New pages are marked with a star.</desc>
  <rect x="0" y="0" width="960" height="700" fill="#ffffff"/>

  <!-- Home -->
  <rect x="40" y="20" width="880" height="64" rx="8" fill="#475569"/>
  <text x="60" y="47" fill="#ffffff" font-weight="bold" font-size="16">Home</text>
  <text x="60" y="70" fill="#ffffff">The home page *   ·   Showcase: vtium's own screens at 1920x1080, captured by tier 3 *</text>

  <!-- axis labels -->
  <text x="270" y="112" fill="#1a1a1a" text-anchor="middle" font-style="italic">doing: steps to follow</text>
  <text x="710" y="112" fill="#1a1a1a" text-anchor="middle" font-style="italic">knowing: facts and reasons</text>
  <text x="26" y="230" fill="#1a1a1a" text-anchor="middle" font-style="italic" transform="rotate(-90 26 230)">learning</text>
  <text x="26" y="440" fill="#1a1a1a" text-anchor="middle" font-style="italic" transform="rotate(-90 26 440)">at work</text>

  <!-- Tutorials -->
  <rect x="40" y="124" width="430" height="190" rx="8" fill="#2d8e5e"/>
  <text x="60" y="152" fill="#ffffff" font-weight="bold" font-size="16">Tutorials</text>
  <text x="60" y="176" fill="#ffffff" font-size="13">A lesson a newcomer follows from start to finish</text>
  <text x="60" y="212" fill="#ffffff">Try vtium on one VT *</text>
  <text x="76" y="232" fill="#ffffff" font-size="12">install, switch to it, get back, remove it</text>
