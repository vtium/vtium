  <text x="510" y="152" fill="#ffffff" font-weight="bold" font-size="16">Explanation</text>
  <text x="510" y="176" fill="#ffffff" font-size="13">Why vtium is the way it is</text>
  <text x="510" y="212" fill="#ffffff">Why vtium   (why-vtium.md)</text>
  <text x="526" y="232" fill="#ffffff" font-size="12">takes the README's comparison with the alternatives</text>
