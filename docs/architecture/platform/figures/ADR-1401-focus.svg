<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" font-family="DejaVu Sans Mono, monospace">
<title>One keyboard, two heads: the focus chord moves the keyboard from one head to the other, and each head shows whether it holds the focus</title>
<defs>
<marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="#1f2933"/></marker>
<marker id="arrow-blue" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="#2f6fb0"/></marker>
</defs>
<rect width="960" height="500" fill="#ffffff"/>
<g fill="#1f2933">
<text x="16" y="28" font-size="13" font-weight="bold">before the chord</text>
<!-- row 1 -->
<rect x="16" y="40" width="420" height="100" fill="#e6eef7" stroke="#2f6fb0" stroke-width="2"/>
<text x="30" y="60" font-size="14" font-weight="bold">head desk</text>
<circle cx="298" cy="55" r="6" fill="#2f6fb0"/>
<text x="310" y="60" font-size="12" fill="#2f6fb0">holds the focus</text>
<rect x="36" y="72" width="380" height="54" fill="#ffffff" stroke="#9aa5b1"/>
<text x="226" y="96" font-size="13" text-anchor="middle">the large monitor</text>
<text x="226" y="114" font-size="11" text-anchor="middle">its session reads the keys typed</text>
<rect x="524" y="40" width="420" height="100" fill="#e6eef7" stroke="#2f6fb0" stroke-width="2"/>
<text x="538" y="60" font-size="14" font-weight="bold">head panel</text>
<circle cx="846" cy="55" r="6" fill="#ffffff" stroke="#2f6fb0" stroke-width="1.5"/>
<text x="858" y="60" font-size="12" fill="#2f6fb0">no focus</text>
<rect x="544" y="72" width="380" height="54" fill="#ffffff" stroke="#9aa5b1"/>
<text x="734" y="96" font-size="13" text-anchor="middle">the small panel</text>
<text x="734" y="114" font-size="11" text-anchor="middle">its session runs on; no keys reach it</text>
<rect x="400" y="160" width="160" height="36" fill="#f1f5f9" stroke="#9aa5b1"/>
<text x="480" y="183" font-size="13" text-anchor="middle">the keyboard</text>
<line x1="440" y1="160" x2="380" y2="143" stroke="#2f6fb0" stroke-width="2" marker-end="url(#arrow-blue)"/>
<!-- the chord -->
<line x1="480" y1="200" x2="480" y2="246" stroke="#1f2933" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="494" y="222" font-size="12">the focus chord, pressed on the keyboard</text>
<text x="494" y="238" font-size="11">(a grab key; its default chord is vtium/vtium#82's)</text>
<text x="16" y="248" font-size="13" font-weight="bold">after the chord</text>
<!-- row 2 -->
<rect x="16" y="260" width="420" height="100" fill="#e6eef7" stroke="#2f6fb0" stroke-width="2"/>
<text x="30" y="280" font-size="14" font-weight="bold">head desk</text>
<circle cx="336" cy="275" r="6" fill="#ffffff" stroke="#2f6fb0" stroke-width="1.5"/>
<text x="348" y="280" font-size="12" fill="#2f6fb0">no focus</text>
<rect x="36" y="292" width="380" height="54" fill="#ffffff" stroke="#9aa5b1"/>
<text x="226" y="316" font-size="13" text-anchor="middle">the large monitor</text>
<text x="226" y="334" font-size="11" text-anchor="middle">its session runs on; no keys reach it</text>
<rect x="524" y="260" width="420" height="100" fill="#e6eef7" stroke="#2f6fb0" stroke-width="2"/>
<text x="538" y="280" font-size="14" font-weight="bold">head panel</text>
<circle cx="808" cy="275" r="6" fill="#2f6fb0"/>
<text x="820" y="280" font-size="12" fill="#2f6fb0">holds the focus</text>
<rect x="544" y="292" width="380" height="54" fill="#ffffff" stroke="#9aa5b1"/>
<text x="734" y="316" font-size="13" text-anchor="middle">the small panel</text>
<text x="734" y="334" font-size="11" text-anchor="middle">its session reads the keys typed</text>
<rect x="400" y="380" width="160" height="36" fill="#f1f5f9" stroke="#9aa5b1"/>
<text x="480" y="403" font-size="13" text-anchor="middle">the keyboard</text>
<line x1="520" y1="380" x2="580" y2="363" stroke="#2f6fb0" stroke-width="2" marker-end="url(#arrow-blue)"/>
<text x="16" y="444" font-size="11">Focus moves only by the chord, never at a hotplug, and a new keyboard never takes it. It rests only on a head</text>
<text x="16" y="460" font-size="11">with a lit display. Each head draws its mark outside the session's output.</text>
<!-- legend -->
<rect x="16" y="474" width="22" height="16" fill="#e6eef7" stroke="#2f6fb0"/>
<text x="46" y="487" font-size="12">vtium, root</text>
<rect x="150" y="474" width="22" height="16" fill="#f1f5f9" stroke="#9aa5b1"/>
<text x="180" y="487" font-size="12">a device</text>
<circle cx="282" cy="482" r="6" fill="#2f6fb0"/>
<text x="294" y="487" font-size="12">holds the focus</text>
<circle cx="434" cy="482" r="6" fill="#ffffff" stroke="#2f6fb0" stroke-width="1.5"/>
<text x="446" y="487" font-size="12">no focus</text>
<text x="944" y="487" font-size="11" text-anchor="end">Proposed (ADR-1401, D5)</text>
</g>
</svg>
