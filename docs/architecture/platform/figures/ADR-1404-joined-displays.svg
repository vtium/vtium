<svg xmlns="http://www.w3.org/2000/svg" width="960" height="490" viewBox="0 0 960 490" font-family="DejaVu Sans Mono, monospace">
<title>Two joined heads: a stacked head whose two displays of different widths share 106 columns, and a head side by side whose two displays of different density draw text at the same physical size</title>
<rect width="960" height="490" fill="#ffffff"/>
<g fill="#1f2933">
<!-- stacked -->
<text x="24" y="30" font-size="14" font-weight="bold">arrange = stacked</text>
<text x="24" y="48" font-size="12">display-order = Top monitor, Bottom monitor</text>
<rect x="24" y="64" width="400" height="225" fill="#f1f5f9" stroke="#9aa5b1" stroke-width="2"/>
<rect x="91" y="64" width="265" height="225" fill="#e6eef7" stroke="#2f6fb0"/>
<text x="224" y="150" font-size="13" text-anchor="middle">Top monitor, 1920×1080</text>
<text x="224" y="170" font-size="12" text-anchor="middle">rows 1 to 45</text>
<text x="224" y="190" font-size="12" text-anchor="middle">cells 12×24 pixels</text>
<text x="57" y="182" font-size="11" text-anchor="middle" fill="#52606d">spare</text>
<text x="390" y="182" font-size="11" text-anchor="middle" fill="#52606d">spare</text>
<line x1="24" y1="296" x2="424" y2="296" stroke="#c0392b" stroke-width="2" stroke-dasharray="6 4"/>
<text x="432" y="300" font-size="11" fill="#c0392b">seam</text>
<rect x="91" y="303" width="267" height="150" fill="#e6eef7" stroke="#2f6fb0" stroke-width="2"/>
<text x="224" y="365" font-size="13" text-anchor="middle">Bottom monitor, 1280×720</text>
<text x="224" y="385" font-size="12" text-anchor="middle">rows 46 to 75</text>
<text x="224" y="405" font-size="12" text-anchor="middle">cells 12×24 pixels</text>
<line x1="91" y1="466" x2="358" y2="466" stroke="#2f6fb0" stroke-width="2"/>
<text x="224" y="482" font-size="11" text-anchor="middle" fill="#2f6fb0">106 columns, the shared side</text>
<!-- side by side -->
<text x="490" y="30" font-size="14" font-weight="bold">arrange = side-by-side</text>
<text x="490" y="48" font-size="12">display-order = Left panel, Right panel</text>
<rect x="490" y="64" width="210" height="160" fill="#e6eef7" stroke="#2f6fb0" stroke-width="2"/>
<text x="595" y="110" font-size="13" text-anchor="middle">Left panel</text>
<text x="595" y="130" font-size="12" text-anchor="middle">1920×1080, 96 DPI</text>
<text x="595" y="150" font-size="12" text-anchor="middle">cells 12×24 pixels</text>
<text x="595" y="170" font-size="12" text-anchor="middle">columns 1 to 160</text>
<line x1="711" y1="56" x2="711" y2="232" stroke="#c0392b" stroke-width="2" stroke-dasharray="6 4"/>
<text x="711" y="246" font-size="11" text-anchor="middle" fill="#c0392b">seam</text>
<rect x="722" y="64" width="210" height="160" fill="#e6eef7" stroke="#2f6fb0" stroke-width="2"/>
<text x="827" y="110" font-size="13" text-anchor="middle">Right panel</text>
<text x="827" y="130" font-size="12" text-anchor="middle">3840×2160, 192 DPI</text>
<text x="827" y="150" font-size="12" text-anchor="middle">cells 24×48 pixels</text>
<text x="827" y="170" font-size="12" text-anchor="middle">columns 161 to 320</text>
<rect x="500" y="196" width="422" height="18" fill="#ffffff" stroke="#9aa5b1"/>
<text x="711" y="209" font-size="11" text-anchor="middle">one row, the same physical size on both sides</text>
<line x1="490" y1="262" x2="932" y2="262" stroke="#2f6fb0" stroke-width="2"/>
<text x="711" y="280" font-size="11" text-anchor="middle" fill="#2f6fb0">45 rows, the shared side; one grid of 320×45</text>
<text x="490" y="330" font-size="12">Each display draws only the rows or columns</text>
<text x="490" y="348" font-size="12">that fall on it, at a font height of its own.</text>
<text x="490" y="374" font-size="12">Spare pixels lie at the outer edges, away</text>
<text x="490" y="392" font-size="12">from the seam, in the background color.</text>
<text x="490" y="418" font-size="12">Unplugging one display shrinks the grid to</text>
<text x="490" y="436" font-size="12">the other, and plugging it in grows it back.</text>
</g>
</svg>
