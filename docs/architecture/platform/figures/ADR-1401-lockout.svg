<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" font-family="DejaVu Sans Mono, monospace">
<title>Lockout and rescue: the anti-lockout guard sending stranded keyboards to the focus, and the rescue key pulling a real keyboard to the focus when a head is left with only a numpad</title>
<defs>
<marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="#1f2933"/></marker>
<marker id="arrow-red" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="#b91c1c"/></marker>
</defs>
<rect width="960" height="620" fill="#ffffff"/>
<g fill="#1f2933">
<text x="16" y="28" font-size="13" font-weight="bold">1. every keyboard is claimed by a head with no lit display: the anti-lockout guard acts</text>
<rect x="16" y="44" width="284" height="96" fill="#e6eef7" stroke="#2f6fb0" stroke-dasharray="6 4"/>
<text x="30" y="64" font-size="14" font-weight="bold">head panel</text>
<text x="30" y="88" font-size="12">its small panel is unplugged:</text>
<text x="30" y="106" font-size="12">no lit display</text>
<text x="30" y="128" font-size="11">input * -&gt; panel</text>
<rect x="16" y="168" width="134" height="40" fill="#f1f5f9" stroke="#9aa5b1"/>
<text x="83" y="193" font-size="12" text-anchor="middle">keyboard A</text>
<rect x="166" y="168" width="134" height="40" fill="#f1f5f9" stroke="#9aa5b1"/>
<text x="233" y="193" font-size="12" text-anchor="middle">keyboard B</text>
<line x1="83" y1="168" x2="83" y2="142" stroke="#9aa5b1" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<line x1="233" y1="168" x2="233" y2="142" stroke="#9aa5b1" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<rect x="340" y="70" width="280" height="80" fill="#fee2e2" stroke="#b91c1c"/>
<text x="480" y="92" font-size="13" text-anchor="middle" font-weight="bold">the anti-lockout guard</text>
<text x="480" y="112" font-size="11" text-anchor="middle">no keyboard-class device reaches</text>
<text x="480" y="128" font-size="11" text-anchor="middle">a lit head: every one follows the</text>
<text x="480" y="144" font-size="11" text-anchor="middle">focus until one does</text>
<line x1="302" y1="188" x2="420" y2="152" stroke="#b91c1c" stroke-width="1.5" marker-end="url(#arrow-red)"/>
<rect x="660" y="44" width="284" height="96" fill="#e6eef7" stroke="#2f6fb0" stroke-width="2"/>
<text x="674" y="64" font-size="14" font-weight="bold">head desk</text>
<text x="674" y="86" font-size="12">the large monitor, lit</text>
<rect x="674" y="96" width="256" height="34" fill="#fee2e2" stroke="#b91c1c"/>
<text x="802" y="111" font-size="11" text-anchor="middle">notice: no keyboard reached a lit</text>
<text x="802" y="125" font-size="11" text-anchor="middle">head; every keyboard follows focus</text>
<line x1="620" y1="110" x2="658" y2="100" stroke="#b91c1c" stroke-width="1.5" marker-end="url(#arrow-red)"/>
<text x="16" y="236" font-size="11">It moves every stranded keyboard at once, so it chooses none, and lets go once a rule's keyboard reaches a lit head.</text>
<line x1="16" y1="254" x2="944" y2="254" stroke="#9aa5b1"/>
<text x="16" y="280" font-size="13" font-weight="bold">2. a head is left with only a numpad: the guard is satisfied, and the rescue key acts</text>
<rect x="16" y="296" width="284" height="92" fill="#e6eef7" stroke="#2f6fb0" stroke-width="2"/>
<text x="30" y="316" font-size="14" font-weight="bold">head desk</text>
<text x="30" y="338" font-size="12">the large monitor, lit</text>
<text x="30" y="356" font-size="11">input path:...3.4.1 -&gt; desk</text>
<text x="30" y="374" font-size="11">input path:...3.3 -&gt; ignore</text>
<rect x="16" y="414" width="134" height="40" fill="#f1f5f9" stroke="#9aa5b1"/>
<text x="83" y="439" font-size="12" text-anchor="middle">a numpad</text>
<line x1="83" y1="414" x2="83" y2="390" stroke="#1f2933" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="16" y="476" font-size="11">udev tags it ID_INPUT_KEYBOARD: a</text>
<text x="16" y="492" font-size="11">keyboard, so the guard does not act</text>
<rect x="340" y="414" width="220" height="56" fill="#f1f5f9" stroke="#9aa5b1"/>
<text x="450" y="434" font-size="13" text-anchor="middle">keyboard A</text>
<text x="450" y="452" font-size="11" text-anchor="middle">ignored by its rule; opened</text>
<text x="450" y="465" font-size="11" text-anchor="middle">to watch for the rescue key</text>
<rect x="600" y="400" width="344" height="84" fill="#fee2e2" stroke="#b91c1c"/>
<text x="772" y="422" font-size="13" text-anchor="middle" font-weight="bold">the rescue key</text>
<text x="772" y="442" font-size="11" text-anchor="middle">Ctrl-Alt-F&lt;n&gt; for vtium's own VT, while</text>
<text x="772" y="458" font-size="11" text-anchor="middle">it is shown, pressed on keyboard A:</text>
<text x="772" y="474" font-size="11" text-anchor="middle">keyboard A follows the focus for the boot</text>
<line x1="560" y1="442" x2="598" y2="442" stroke="#1f2933" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M772,400 L772,342 L304,342" fill="none" stroke="#b91c1c" stroke-width="1.5" marker-end="url(#arrow-red)"/>
<text x="760" y="364" font-size="11" fill="#b91c1c" text-anchor="end">a notice; heads.conf unchanged</text>
<!-- the switches -->
<rect x="16" y="506" width="928" height="56" fill="#ffffff" stroke="#9aa5b1"/>
<text x="30" y="526" font-size="12" font-weight="bold">[guards]</text>
<text x="110" y="526" font-size="11">anti-lockout = on, rescue-key = on, never-dark = on by default; a head's rescue = off keeps its keyboards</text>
<text x="30" y="546" font-size="11">Each off is a note in check-config. vtium.heads=builtin on the kernel command line runs the compiled-in rules, every guard on.</text>
<!-- legend -->
<rect x="16" y="576" width="22" height="16" fill="#e6eef7" stroke="#2f6fb0"/>
<text x="46" y="589" font-size="12">vtium, root</text>
<rect x="150" y="576" width="22" height="16" fill="#f1f5f9" stroke="#9aa5b1"/>
<text x="180" y="589" font-size="12">a device</text>
<rect x="270" y="576" width="22" height="16" fill="#fee2e2" stroke="#b91c1c"/>
<text x="300" y="589" font-size="12">a guard or a notice</text>
<rect x="470" y="576" width="22" height="16" fill="#e6eef7" stroke="#2f6fb0" stroke-dasharray="6 4"/>
<text x="500" y="589" font-size="12">a head with no lit display</text>
<text x="944" y="612" font-size="11" text-anchor="end">Proposed (ADR-1401, D9)</text>
</g>
</svg>
