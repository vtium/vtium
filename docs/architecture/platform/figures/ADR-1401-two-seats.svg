<svg xmlns="http://www.w3.org/2000/svg" width="960" height="490" viewBox="0 0 960 490" font-family="DejaVu Sans Mono, monospace">
<title>Two GPUs on two seats, later and not built: the desktop compositor on seat0 with the discrete GPU, vtium on seat1 with the integrated GPU and its own keyboard</title>
<defs>
<marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="#1f2933"/></marker>
</defs>
<rect width="960" height="490" fill="#ffffff"/>
<g fill="#1f2933">
<!-- seat0 -->
<rect x="16" y="40" width="454" height="290" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
<text x="30" y="62" font-size="14" font-weight="bold">seat0</text>
<text x="456" y="62" font-size="12" text-anchor="end">the kernel VTs, Ctrl-Alt-F&lt;n&gt;</text>
<rect x="36" y="80" width="414" height="60" fill="#fbecd0" stroke="#b45309"/>
<text x="243" y="104" font-size="13" text-anchor="middle">the desktop compositor</text>
<text x="243" y="124" font-size="11" text-anchor="middle">the user's graphical session; holds card1's master</text>
<rect x="36" y="180" width="128" height="52" fill="#f1f5f9" stroke="#9aa5b1"/>
<text x="100" y="202" font-size="12" text-anchor="middle">the discrete</text>
<text x="100" y="220" font-size="12" text-anchor="middle">GPU, card1</text>
<rect x="179" y="180" width="128" height="52" fill="#f1f5f9" stroke="#9aa5b1"/>
<text x="243" y="202" font-size="12" text-anchor="middle">the large</text>
<text x="243" y="220" font-size="12" text-anchor="middle">monitor, DP-8</text>
<rect x="322" y="180" width="128" height="52" fill="#f1f5f9" stroke="#9aa5b1"/>
<text x="386" y="202" font-size="12" text-anchor="middle">keyboard A,</text>
<text x="386" y="220" font-size="12" text-anchor="middle">the mouse</text>
<line x1="100" y1="180" x2="100" y2="142" stroke="#1f2933" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="243" y1="180" x2="243" y2="142" stroke="#1f2933" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="386" y1="180" x2="386" y2="142" stroke="#1f2933" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="36" y="266" font-size="11">A vtium on a seat0 VT runs here too, and takes</text>
<text x="36" y="282" font-size="11">card1 only while its VT is shown.</text>
<!-- seat1 -->
<rect x="490" y="40" width="454" height="290" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="504" y="62" font-size="14" font-weight="bold">seat1</text>
<text x="930" y="62" font-size="12" text-anchor="end">later, not built; no kernel VT</text>
<rect x="510" y="80" width="414" height="60" fill="#e6eef7" stroke="#2f6fb0" stroke-dasharray="6 4"/>
<text x="717" y="104" font-size="13" text-anchor="middle">vtium, one a seat</text>
<text x="717" y="124" font-size="11" text-anchor="middle">its own console switching; holds card0's master</text>
<rect x="510" y="180" width="128" height="52" fill="#f1f5f9" stroke="#9aa5b1"/>
<text x="574" y="202" font-size="12" text-anchor="middle">the integrated</text>
<text x="574" y="220" font-size="12" text-anchor="middle">GPU, card0</text>
<rect x="653" y="180" width="128" height="52" fill="#f1f5f9" stroke="#9aa5b1"/>
<text x="717" y="202" font-size="12" text-anchor="middle">the small</text>
<text x="717" y="220" font-size="12" text-anchor="middle">panel, HDMI-A-2</text>
<rect x="796" y="180" width="128" height="52" fill="#f1f5f9" stroke="#9aa5b1"/>
<text x="860" y="202" font-size="12" text-anchor="middle">keyboard B,</text>
<text x="860" y="220" font-size="12" text-anchor="middle">its own</text>
<line x1="574" y1="180" x2="574" y2="142" stroke="#1f2933" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="717" y1="180" x2="717" y2="142" stroke="#1f2933" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="860" y1="180" x2="860" y2="142" stroke="#1f2933" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="510" y="266" font-size="11">Ctrl-Alt-F&lt;n&gt; are vtium's own keys here; the two</text>
<text x="510" y="282" font-size="11">sessions run side by side, neither switching the other.</text>
<!-- logind -->
<rect x="16" y="350" width="928" height="56" fill="#e6eef7" stroke="#2f6fb0"/>
<text x="480" y="372" font-size="13" text-anchor="middle">logind assigns whole devices to seats: cards and inputs, never connectors</text>
<text x="480" y="392" font-size="12" text-anchor="middle">one keyboard cannot be on two seats; only seat0 has kernel VTs</text>
<line x1="243" y1="348" x2="243" y2="332" stroke="#1f2933" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="717" y1="348" x2="717" y2="332" stroke="#1f2933" stroke-width="1.5" marker-end="url(#arrow)"/>
<!-- legend -->
<rect x="16" y="430" width="22" height="16" fill="#e6eef7" stroke="#2f6fb0"/>
<text x="46" y="443" font-size="12">root</text>
<rect x="102" y="430" width="22" height="16" fill="#fbecd0" stroke="#b45309"/>
<text x="132" y="443" font-size="12">the user</text>
<rect x="222" y="430" width="22" height="16" fill="#f1f5f9" stroke="#9aa5b1"/>
<text x="252" y="443" font-size="12">a device</text>
<rect x="342" y="430" width="22" height="16" fill="#ffffff" stroke="#9aa5b1" stroke-dasharray="6 4"/>
<text x="372" y="443" font-size="12">later, not built</text>
<text x="944" y="478" font-size="11" text-anchor="end">A later extension named in ADR-1401 (Context, D2); this record builds seat0 only</text>
</g>
</svg>
