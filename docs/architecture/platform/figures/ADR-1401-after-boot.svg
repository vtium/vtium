<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" font-family="DejaVu Sans Mono, monospace">
<title>No display and no keyboard at boot, then each added after boot, then the display removed mid-session</title>
<defs>
<marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="#1f2933"/></marker>
</defs>
<rect width="1000" height="560" fill="#ffffff"/>
<g fill="#1f2933">
<!-- the time line -->
<line x1="16" y1="40" x2="980" y2="40" stroke="#1f2933" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="984" y="32" font-size="11" text-anchor="end">time</text>
<circle cx="126" cy="40" r="5" fill="#1f2933"/>
<text x="126" y="30" font-size="12" text-anchor="middle">boot</text>
<circle cx="366" cy="40" r="5" fill="#1f2933"/>
<text x="366" y="30" font-size="12" text-anchor="middle">a display plugged in</text>
<circle cx="606" cy="40" r="5" fill="#1f2933"/>
<text x="606" y="30" font-size="12" text-anchor="middle">a keyboard plugged in</text>
<circle cx="856" cy="40" r="5" fill="#1f2933"/>
<text x="856" y="30" font-size="12" text-anchor="middle">the display removed</text>
<!-- 1: boot with nothing -->
<rect x="16" y="64" width="220" height="200" fill="#e6eef7" stroke="#2f6fb0" stroke-width="2"/>
<text x="30" y="86" font-size="13" font-weight="bold">1. nothing attached</text>
<text x="30" y="110" font-size="11">no display, no keyboard</text>
<text x="30" y="130" font-size="11">vtium holds its VT and</text>
<text x="30" y="146" font-size="11">waits display-wait, 10 s by</text>
<text x="30" y="162" font-size="11">default, from when the VT</text>
<text x="30" y="178" font-size="11">is first shown</text>
<text x="30" y="202" font-size="11">no rule is walked yet;</text>
<text x="30" y="218" font-size="11">no session starts</text>
<!-- the branch -->
<line x1="126" y1="264" x2="126" y2="300" stroke="#1f2933" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="134" y="288" font-size="11">no display by then</text>
<rect x="16" y="302" width="220" height="62" fill="#fee2e2" stroke="#b91c1c"/>
<text x="126" y="322" font-size="11" text-anchor="middle">vtium exits with status 1;</text>
<text x="126" y="338" font-size="11" text-anchor="middle">the unit's OnFailure= starts</text>
<text x="126" y="354" font-size="11" text-anchor="middle">a getty on the VT</text>
<rect x="16" y="380" width="220" height="62" fill="#e6eef7" stroke="#2f6fb0"/>
<text x="126" y="400" font-size="11" text-anchor="middle">under display-wait=forever,</text>
<text x="126" y="416" font-size="11" text-anchor="middle">vtium waits for the first</text>
<text x="126" y="432" font-size="11" text-anchor="middle">display however long it takes</text>
<path d="M236,411 L246,411 L246,236 L254,236" fill="none" stroke="#1f2933" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="236" y1="110" x2="254" y2="110" stroke="#1f2933" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="30" y="242" font-size="11">a display within the wait</text>
<text x="30" y="258" font-size="11">goes on to 2</text>
<!-- 2: a display -->
<rect x="256" y="64" width="220" height="200" fill="#e6eef7" stroke="#2f6fb0" stroke-width="2"/>
<text x="270" y="86" font-size="13" font-weight="bold">2. a display</text>
<text x="270" y="110" font-size="11">it walks the rules:</text>
<text x="270" y="126" font-size="11">display * -&gt; console</text>
<text x="270" y="146" font-size="11">the head lights and its</text>
<text x="270" y="162" font-size="11">session starts on its grid</text>
<rect x="268" y="178" width="196" height="40" fill="#fee2e2" stroke="#b91c1c"/>
<text x="366" y="194" font-size="11" text-anchor="middle">notice: no keyboard</text>
<text x="366" y="210" font-size="11" text-anchor="middle">was found</text>
<text x="270" y="238" font-size="11">the login prompt shows;</text>
<text x="270" y="254" font-size="11">nothing can type yet</text>
<line x1="476" y1="164" x2="494" y2="164" stroke="#1f2933" stroke-width="1.5" marker-end="url(#arrow)"/>
<!-- 3: a keyboard -->
<rect x="496" y="64" width="220" height="200" fill="#e6eef7" stroke="#2f6fb0" stroke-width="2"/>
<text x="510" y="86" font-size="13" font-weight="bold">3. a keyboard</text>
<text x="510" y="110" font-size="11">it walks the same rules:</text>
<text x="510" y="126" font-size="11">input * -&gt; focus</text>
<text x="510" y="146" font-size="11">it follows the focus, on</text>
<text x="510" y="162" font-size="11">the only lit head</text>
<text x="510" y="186" font-size="11">the session can be typed</text>
<text x="510" y="202" font-size="11">on; the notice is gone</text>
<text x="510" y="226" font-size="11">a new keyboard never takes</text>
<text x="510" y="242" font-size="11">the focus from another head</text>
<line x1="716" y1="164" x2="742" y2="164" stroke="#1f2933" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<!-- 4: the tail -->
<rect x="744" y="64" width="236" height="200" fill="#ffffff" stroke="#2f6fb0" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="758" y="86" font-size="13" font-weight="bold">4. the display goes</text>
<text x="758" y="110" font-size="11">vtium keeps running and</text>
<text x="758" y="126" font-size="11">waits for a hotplug;</text>
<text x="758" y="142" font-size="11">display-wait was the</text>
<text x="758" y="158" font-size="11">start's alone</text>
<rect x="756" y="172" width="212" height="40" fill="#e6eef7" stroke="#2f6fb0"/>
<text x="862" y="188" font-size="11" text-anchor="middle">head console, shipped:</text>
<text x="862" y="204" font-size="11" text-anchor="middle">never hangs up, as today</text>
<rect x="756" y="218" width="212" height="40" fill="#fbecd0" stroke="#b45309"/>
<text x="862" y="234" font-size="11" text-anchor="middle">a head the file declares:</text>
<text x="862" y="250" font-size="11" text-anchor="middle">hangup-after, see below</text>
<!-- the grace period -->
<rect x="496" y="300" width="484" height="142" fill="#ffffff" stroke="#9aa5b1"/>
<text x="510" y="322" font-size="12" font-weight="bold">a declared head losing its last display (probe 3)</text>
<line x1="520" y1="370" x2="950" y2="370" stroke="#1f2933" stroke-width="1.5" marker-end="url(#arrow)"/>
<circle cx="530" cy="370" r="5" fill="#1f2933"/>
<text x="530" y="356" font-size="11" text-anchor="middle">gone</text>
<rect x="540" y="362" width="240" height="16" fill="#fbecd0" stroke="#b45309"/>
<text x="660" y="374" font-size="10" text-anchor="middle">hangup-after, 10 s unset</text>
<circle cx="790" cy="370" r="5" fill="#b91c1c"/>
<text x="790" y="356" font-size="11" text-anchor="middle">hang-up</text>
<text x="510" y="400" font-size="11">back within the time: the sessions resume</text>
<text x="510" y="416" font-size="11">time out: the pty closes and its processes get SIGHUP</text>
<text x="510" y="432" font-size="11">hangup-after = 0 hangs up at once; never keeps them</text>
<!-- legend -->
<rect x="16" y="480" width="22" height="16" fill="#e6eef7" stroke="#2f6fb0"/>
<text x="46" y="493" font-size="12">vtium, root</text>
<rect x="150" y="480" width="22" height="16" fill="#fee2e2" stroke="#b91c1c"/>
<text x="180" y="493" font-size="12">an exit or a notice</text>
<rect x="350" y="480" width="22" height="16" fill="#fbecd0" stroke="#b45309"/>
<text x="380" y="493" font-size="12">open to the operator (probe 3)</text>
<rect x="620" y="480" width="22" height="16" fill="#ffffff" stroke="#2f6fb0" stroke-dasharray="6 4"/>
<text x="650" y="493" font-size="12">a later moment, the tail</text>
<text x="16" y="530" font-size="11">Each device walks the rules when it arrives, exactly as one found at start would; the session waits for the first display.</text>
<text x="984" y="550" font-size="11" text-anchor="end">Proposed (ADR-1401, D8)</text>
</g>
</svg>
