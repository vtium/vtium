<text x="760" y="186" font-size="12" text-anchor="start" fill="#52606d" font-weight="normal">after: the erased row is dashed</text>
<rect x="520" y="220" width="18" height="14" fill="#f6a35c" stroke="#b45309"/>
<text x="546" y="232" font-size="12" text-anchor="start" fill="#1f2933" font-weight="normal">a sixel: the erase cuts it, and it stays as two pieces</text>
<rect x="520" y="246" width="18" height="14" fill="#5fb3a1" stroke="#1f6f5f"/>
<text x="546" y="258" font-size="12" text-anchor="start" fill="#1f2933" font-weight="normal">a kitty placement: no erase command but ED 2</text>
<text x="546" y="274" font-size="12" text-anchor="start" fill="#1f2933" font-weight="normal">reaches it, so EL leaves it unchanged</text>
<text x="520" y="306" font-size="12" text-anchor="start" fill="#52606d" font-weight="normal">Each piece shows part of the same picture;</text>
<text x="520" y="324" font-size="12" text-anchor="start" fill="#52606d" font-weight="normal">the picture itself is never cut.</text>
