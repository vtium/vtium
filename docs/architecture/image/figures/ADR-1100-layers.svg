<svg xmlns="http://www.w3.org/2000/svg" width="980" height="470" viewBox="0 0 980 470" font-family="DejaVu Sans, sans-serif">
<title>The layers of a frame, and what EL does to each kind of placement</title>
<rect width="980" height="470" fill="#ffffff"/>
<text x="20" y="30" font-size="15" text-anchor="start" fill="#1f2933" font-weight="bold">A: the layers of a frame, from the bottom</text>
<rect x="20" y="340" width="430" height="34" rx="4" fill="#e4e7eb" stroke="#9aa5b1"/>
<text x="32" y="362" font-size="12" text-anchor="start" fill="#1f2933" font-weight="normal">1  the default background</text>
<rect x="20" y="298" width="430" height="34" rx="4" fill="#d5f0ea" stroke="#9aa5b1"/>
<text x="32" y="320" font-size="12" text-anchor="start" fill="#1f2933" font-weight="normal">2  kitty placements with z below -1,073,741,824</text>
<rect x="20" y="256" width="430" height="34" rx="4" fill="#e4e7eb" stroke="#9aa5b1"/>
<text x="32" y="278" font-size="12" text-anchor="start" fill="#1f2933" font-weight="normal">3  cell backgrounds that are not the default</text>
<rect x="20" y="214" width="430" height="34" rx="4" fill="#d5f0ea" stroke="#9aa5b1"/>
<text x="32" y="236" font-size="12" text-anchor="start" fill="#1f2933" font-weight="normal">4  kitty placements with z from -1,073,741,824 to -1</text>
<rect x="20" y="172" width="430" height="34" rx="4" fill="#dbe7f6" stroke="#9aa5b1"/>
<text x="32" y="194" font-size="12" text-anchor="start" fill="#1f2933" font-weight="normal">5  glyphs and decorations</text>
<rect x="20" y="130" width="430" height="34" rx="4" fill="#d5f0ea" stroke="#9aa5b1"/>
<text x="32" y="152" font-size="12" text-anchor="start" fill="#1f2933" font-weight="normal">6  kitty placements with z of 0 or more; sixel and iTerm2 at z 0</text>
<rect x="20" y="88" width="430" height="34" rx="4" fill="#fbecd0" stroke="#9aa5b1"/>
<text x="32" y="110" font-size="12" text-anchor="start" fill="#1f2933" font-weight="normal">7  the cursor, the pointer, vtium's own notices and marks</text>
<text x="20" y="400" font-size="12" text-anchor="start" fill="#52606d" font-weight="normal">Within a layer: by z. At equal z, a later picture draws above an</text>
<text x="20" y="418" font-size="12" text-anchor="start" fill="#52606d" font-weight="normal">earlier one, except that a newly arrived kitty picture slides in</text>
<text x="20" y="436" font-size="12" text-anchor="start" fill="#52606d" font-weight="normal">beneath the first kitty picture with a higher id. Nothing already</text>
<text x="20" y="454" font-size="12" text-anchor="start" fill="#52606d" font-weight="normal">shown moves.</text>
<text x="520" y="30" font-size="15" text-anchor="start" fill="#1f2933" font-weight="bold">B: EL 2 on row 3, before and after</text>
