<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="800" height="560" font-family="DejaVu Sans, Verdana, sans-serif" font-size="15">
  <title>Glyph ink reaching the rows above and below</title>
  <desc>Three rows of four cells, each 9 by 16 pixels drawn ten times larger. The top row is blue and holds g, y and an underscore, each inside the row. The middle row holds a light capital E whose acute accent rises two pixel rows into the blue top row and is drawn over the blue, inside a dashed box that spans the three columns around the E and the three rows from the top row to the bottom row. The bottom row holds an amber Arabic lam whose fatha rises into the middle row. To the right, the order each pixel is drawn in.</desc>
  <rect x="0" y="0" width="800" height="560" fill="#ffffff"/>

  <!-- backgrounds: the top row is blue, the others dark -->
  <rect x="40" y="40" width="360" height="160" fill="#1e40af"/>
  <rect x="40" y="200" width="360" height="160" fill="#1f2937"/>
  <rect x="40" y="360" width="360" height="160" fill="#111827"/>

  <!-- cell edges -->
  <g stroke="#6b7280" stroke-width="1">
    <line x1="130" y1="40" x2="130" y2="520"/>
    <line x1="220" y1="40" x2="220" y2="520"/>
    <line x1="310" y1="40" x2="310" y2="520"/>
    <line x1="40" y1="200" x2="400" y2="200"/>
    <line x1="40" y1="360" x2="400" y2="360"/>
  </g>
  <rect x="40" y="40" width="360" height="480" fill="none" stroke="#374151" stroke-width="2"/>

  <!-- top row: g, y and an underscore, all inside the row -->
  <g fill="#e5e7eb" font-family="DejaVu Sans Mono, monospace" font-size="130">
    <text x="45" y="155">g</text>
    <text x="135" y="155">y</text>
  </g>
  <rect x="230" y="178" width="72" height="12" fill="#e5e7eb"/>

  <!-- middle row: E with its acute reaching into the top row -->
  <g fill="#e5e7eb">
    <rect x="152" y="235" width="13" height="105"/>
    <rect x="152" y="235" width="56" height="12"/>
    <rect x="152" y="282" width="48" height="11"/>
    <rect x="152" y="328" width="56" height="12"/>
    <polygon points="170,224 183,224 205,180 191,180"/>
  </g>

  <!-- bottom row: lam with its fatha reaching into the middle row -->
  <g fill="none" stroke="#f59e0b" stroke-width="12" stroke-linecap="round">
    <path d="M 278 388 L 278 482 Q 278 503 256 503 Q 238 503 233 488"/>
    <line x1="252" y1="372" x2="282" y2="350"/>
  </g>

  <!-- the E's reach: its cell and one more on every side -->
  <rect x="42" y="42" width="266" height="476" fill="none" stroke="#f59e0b" stroke-width="3" stroke-dasharray="10 6"/>

  <!-- row labels -->
  <g fill="#374151" font-size="13">
    <text x="8" y="125">r-1</text>
    <text x="14" y="285">r</text>
    <text x="8" y="445">r+1</text>
  </g>

  <!-- the order each pixel is drawn in -->
  <g fill="#111827">
    <text x="430" y="70" font-weight="bold">Each pixel is drawn in this order</text>
    <text x="430" y="110">1. its cell's background</text>
    <text x="430" y="140">2. its cell's underline</text>
    <text x="430" y="170">3. ink from the row above</text>
    <text x="430" y="200">4. ink from the row below</text>
    <text x="430" y="230">5. ink from the cells beside it</text>
    <text x="430" y="260">6. its cell's own glyph</text>
    <text x="430" y="290">7. its cell's strike-through</text>
  </g>
  <g fill="#374151" font-size="13">
    <text x="430" y="340">The accent of the E lies over the blue</text>
    <text x="430" y="360">background of row r-1: that pixel's only</text>
    <text x="430" y="380">background is its own cell's, drawn first.</text>
    <text x="430" y="420">Dashed: the reach of the E, its own cell</text>
    <text x="430" y="440">and one cell more on every side.</text>
  </g>
</svg>
