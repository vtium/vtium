<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 490" width="880" height="490" font-family="DejaVu Sans, Verdana, sans-serif" font-size="14">
  <title>Glyph ink reaching the cells beside it</title>
  <desc>Five cells A to E of one row, each 9 by 16 pixels drawn twelve times larger, on a dark background. A dashed line marks the font's own baseline and a solid line one pixel higher marks the baseline vtium uses. B holds an amber italic letter slanted by 0.2: its top leans into C and its tail a little into A, inside a dashed box spanning A to C. C is selected, drawn dark on light blue: B's ink inside C is dark, and C's own italic letter is dark inside C and light gray where it leans out into D. E holds an underscore in the cell's last row, with an outline one row lower, past the cell's bottom edge, where the font's own baseline would have put it. Below, the order each pixel is drawn in.</desc>
  <defs>
    <clipPath id="row"><rect x="60" y="60" width="540" height="192"/></clipPath>
    <clipPath id="outC"><rect x="60" y="60" width="216" height="192"/><rect x="384" y="60" width="216" height="192"/></clipPath>
    <clipPath id="inC"><rect x="276" y="60" width="108" height="192"/></clipPath>
  </defs>
  <rect x="0" y="0" width="880" height="490" fill="#ffffff"/>

  <!-- backgrounds: C is selected, light blue -->
  <rect x="60" y="60" width="216" height="192" fill="#1f2937"/>
  <rect x="276" y="60" width="108" height="192" fill="#93c5fd"/>
  <rect x="384" y="60" width="216" height="192" fill="#1f2937"/>

  <!-- the baselines: the font's own (dashed), and vtium's, one pixel higher -->
  <line x1="60" y1="216" x2="600" y2="216" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4"/>
  <line x1="60" y1="204" x2="600" y2="204" stroke="#f97316" stroke-width="2"/>

  <!-- B's reach: one cell past B on each side -->
  <rect x="56" y="56" width="332" height="200" fill="none" stroke="#d97706" stroke-width="2.5" stroke-dasharray="9 5"/>

  <g clip-path="url(#row)">
    <!-- B's letter, slanted by 0.2 about vtium's baseline (y 204): amber outside C -->
    <g clip-path="url(#outC)" fill="#fbbf24">
      <polygon points="266.4,72 290.4,72 259.2,228 235.2,228"/>
      <polygon points="165.6,216 261.6,216 256.8,240 160.8,240"/>
    </g>
    <!-- C's letter, slanted by 0.2: light gray, its unmarked color, where it leans into D -->
    <g clip-path="url(#outC)" fill="#d1d5db">
      <polygon points="374.4,72 398.4,72 372,204 348,204"/>
    </g>
    <!-- inside the selection every ink takes the selection's text color -->
    <g clip-path="url(#inC)" fill="#0f172a">
      <polygon points="266.4,72 290.4,72 259.2,228 235.2,228"/>
      <polygon points="374.4,72 398.4,72 372,204 348,204"/>
    </g>
    <!-- E's underscore in the cell's last row -->
    <rect x="498" y="240" width="96" height="12" fill="#e5e7eb"/>
  </g>
  <!-- where the font's own baseline would have put the underscore: past the bottom edge -->
  <rect x="498" y="252" width="96" height="12" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4 3"/>

  <!-- cell edges -->
  <g fill="none" stroke="#475569" stroke-width="1">
    <rect x="60" y="60" width="108" height="192"/>
    <rect x="168" y="60" width="108" height="192"/>
    <rect x="276" y="60" width="108" height="192"/>
    <rect x="384" y="60" width="108" height="192"/>
    <rect x="492" y="60" width="108" height="192"/>
  </g>

  <g fill="#1a1a1a">
    <text x="114" y="290" text-anchor="middle">A</text>
    <text x="222" y="290" text-anchor="middle">B, italic</text>
    <text x="330" y="290" text-anchor="middle">C, selected</text>
    <text x="438" y="290" text-anchor="middle">D</text>
    <text x="546" y="290" text-anchor="middle">E</text>
    <text x="222" y="44" text-anchor="middle" fill="#b45309">B's reach: A to C</text>
    <text x="616" y="200" fill="#c2410c">baseline vtium uses</text>
    <text x="616" y="222" fill="#475569">the font's own, 1 px lower</text>
    <text x="616" y="250" fill="#475569">_ in the last row; dashed:</text>
    <text x="616" y="268" fill="#475569">where it would have been</text>
    <text x="616" y="90" fill="#475569">C's letter leans out of</text>
    <text x="616" y="108" fill="#475569">the selection into D in</text>
    <text x="616" y="126" fill="#475569">its unselected color</text>
    <text x="40" y="314" fill="#475569">Colors assumed: text light gray, and B's text amber, on dark gray;</text>
    <text x="40" y="332" fill="#475569">the selection set to dark text on light blue (OSC 17 and 19).</text>
    <text x="40" y="364" font-weight="bold">Each pixel of the row is drawn in this order:</text>
    <text x="40" y="388">1. the background of the cell the pixel lies in</text>
    <text x="40" y="408">2. that cell's underline</text>
    <text x="40" y="428">3. the ink of the glyphs beside the cell that reaches the pixel: the one before it, then the one after it</text>
    <text x="40" y="448">4. that cell's own glyph</text>
    <text x="40" y="468">5. that cell's strike-through</text>
  </g>
</svg>
