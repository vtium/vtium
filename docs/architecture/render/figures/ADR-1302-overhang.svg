<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420" font-family="DejaVu Sans, Verdana, sans-serif" font-size="14">
  <title>An italic glyph's ink reaching into the cells beside it</title>
  <desc>Four cells of one row, A to D. Cell B holds a slanted glyph. Its ink reaches right into cell C and left into cell A, inside a dashed box one cell past B on each side. The part above the row's top edge is cut. Cell C is selected, so the ink inside C takes C's text color; the ink in A and B takes B's own amber. Below, the layer order the row is drawn in.</desc>
  <defs>
    <clipPath id="row"><rect x="120" y="60" width="400" height="200"/></clipPath>
    <clipPath id="notC"><rect x="120" y="60" width="200" height="200"/><rect x="420" y="60" width="100" height="200"/></clipPath>
    <clipPath id="onlyC"><rect x="320" y="60" width="100" height="200"/></clipPath>
  </defs>
  <rect x="0" y="0" width="800" height="420" fill="#ffffff"/>

  <!-- the row: backgrounds -->
  <rect x="120" y="60" width="100" height="200" fill="#1f2937"/>
  <rect x="220" y="60" width="100" height="200" fill="#1f2937"/>
  <rect x="320" y="60" width="100" height="200" fill="#2563eb"/>
  <rect x="420" y="60" width="100" height="200" fill="#1f2937"/>

  <!-- the glyph's ink above the row, which the row cuts: an outline only -->
  <polygon points="338,60 364,60 391,20 365,20" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4 3"/>

  <!-- the glyph: a slanted stroke and a crossbar, in B's amber outside C and in C's text color inside it -->
  <g clip-path="url(#row)">
    <g clip-path="url(#notC)" fill="#fbbf24">
      <polygon points="365,20 391,20 238,250 212,250"/>
      <rect x="246" y="130" width="84" height="18"/>
    </g>
    <g clip-path="url(#onlyC)" fill="#ffffff">
      <polygon points="365,20 391,20 238,250 212,250"/>
      <rect x="246" y="130" width="84" height="18"/>
    </g>
  </g>

  <!-- cell edges -->
  <g fill="none" stroke="#475569" stroke-width="1">
    <rect x="120" y="60" width="100" height="200"/>
    <rect x="220" y="60" width="100" height="200"/>
    <rect x="320" y="60" width="100" height="200"/>
    <rect x="420" y="60" width="100" height="200"/>
  </g>
  <!-- the reach: one cell past B on each side -->
  <rect x="116" y="56" width="308" height="208" fill="none" stroke="#d97706" stroke-width="2.5" stroke-dasharray="9 5"/>

  <g fill="#1a1a1a">
    <text x="170" y="284" text-anchor="middle">A</text>
    <text x="270" y="284" text-anchor="middle">B, italic</text>
    <text x="370" y="284" text-anchor="middle">C, selected</text>
    <text x="470" y="284" text-anchor="middle">D</text>
    <text x="540" y="36">cut at the row's top edge</text>
    <text x="540" y="54" fill="#475569">(dashed: the ink the row drops)</text>
    <text x="540" y="120" fill="#b45309">B's reach: A to C</text>
    <text x="540" y="138" fill="#475569">D is past it, so B's ink</text>
    <text x="540" y="156" fill="#475569">never changes D</text>
    <text x="540" y="200" fill="#475569">inside C the ink takes</text>
    <text x="540" y="218" fill="#475569">C's text color</text>
  </g>

  <g fill="#1a1a1a">
    <text x="40" y="320" font-weight="bold">Each pixel of the row is drawn in this order:</text>
    <text x="40" y="344">1. the background of the cell the pixel lies in, then its underline</text>
    <text x="40" y="366">2. the ink of the glyph to its left, then of the glyph to its right, where they reach it</text>
    <text x="40" y="388">3. the cell's own glyph</text>
    <text x="40" y="410">4. the cell's strike</text>
  </g>
</svg>
