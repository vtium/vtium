<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 720" width="880" height="720" font-family="DejaVu Sans, Verdana, sans-serif" font-size="14">
  <title>The window moving through the tall buffer as one new line slides in</title>
  <desc>Four frames of one display's tall buffer, with rows 20 pixels high drawn twice their size. Each buffer holds lines 8 to 14 and, below them, the slot the next new line is drawn into. Line 14 is blue: vtium draws it once, when it arrives, below the window. An orange window five rows tall shows lines 9 to 13 at frame 0, with SRC_Y at 20, then moves down to SRC_Y 27, 33 and 40, where it shows lines 10 to 14 and the slide is at rest. Below, the step table: at 60 Hz with a catch-up time of 80 ms and a minimum speed of 20 rows a second, the minimum speed sets every step at 6.7 pixels, and the lag falls from 20 to 13.3, 6.7 and 0 pixels.</desc>
  <rect x="0" y="0" width="880" height="720" fill="#ffffff"/>

  <!-- frame 0, 0 ms: the window starts at SRC_Y 20 -->
  <g transform="translate(40,0)">
    <text x="0" y="36" fill="#111827" font-weight="bold">frame 0, 0 ms</text>
    <text x="0" y="58" fill="#374151" font-size="13">lag 20 px</text>
    <rect x="0" y="90" width="150" height="40" fill="#1f2937"/>
    <rect x="0" y="130" width="150" height="40" fill="#111827"/>
    <rect x="0" y="170" width="150" height="40" fill="#1f2937"/>
    <rect x="0" y="210" width="150" height="40" fill="#111827"/>
    <rect x="0" y="250" width="150" height="40" fill="#1f2937"/>
    <rect x="0" y="290" width="150" height="40" fill="#111827"/>
    <rect x="0" y="330" width="150" height="40" fill="#1e40af"/>
    <rect x="1" y="371" width="148" height="38" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="6 4"/>
    <g stroke="#6b7280" stroke-width="1">
      <line x1="0" y1="130" x2="150" y2="130"/>
      <line x1="0" y1="170" x2="150" y2="170"/>
      <line x1="0" y1="210" x2="150" y2="210"/>
      <line x1="0" y1="250" x2="150" y2="250"/>
      <line x1="0" y1="290" x2="150" y2="290"/>
      <line x1="0" y1="330" x2="150" y2="330"/>
    </g>
    <rect x="-5" y="130" width="160" height="200" fill="none" stroke="#f97316" stroke-width="3.5"/>
    <text stroke="#1f2937" stroke-width="6" stroke-linejoin="round" paint-order="stroke" x="10" y="115" fill="#e5e7eb">line 8</text>
    <text stroke="#111827" stroke-width="6" stroke-linejoin="round" paint-order="stroke" x="10" y="155" fill="#e5e7eb">line 9</text>
    <text stroke="#1f2937" stroke-width="6" stroke-linejoin="round" paint-order="stroke" x="10" y="195" fill="#e5e7eb">line 10</text>
    <text stroke="#111827" stroke-width="6" stroke-linejoin="round" paint-order="stroke" x="10" y="235" fill="#e5e7eb">line 11</text>
    <text stroke="#1f2937" stroke-width="6" stroke-linejoin="round" paint-order="stroke" x="10" y="275" fill="#e5e7eb">line 12</text>
    <text stroke="#111827" stroke-width="6" stroke-linejoin="round" paint-order="stroke" x="10" y="315" fill="#e5e7eb">line 13</text>
    <text stroke="#1e40af" stroke-width="6" stroke-linejoin="round" paint-order="stroke" x="10" y="355" fill="#e5e7eb">line 14, new</text>
    <text x="10" y="395" fill="#374151" font-size="13">next line's slot</text>
    <text x="0" y="440" fill="#111827">SRC_Y = 20</text>
  </g>

  <!-- frame 1, 16.7 ms: the window starts at SRC_Y 27 -->
  <g transform="translate(250,0)">
    <text x="0" y="36" fill="#111827" font-weight="bold">frame 1, 16.7 ms</text>
    <text x="0" y="58" fill="#374151" font-size="13">lag 13.3 px</text>
    <rect x="0" y="90" width="150" height="40" fill="#1f2937"/>
    <rect x="0" y="130" width="150" height="40" fill="#111827"/>
    <rect x="0" y="170" width="150" height="40" fill="#1f2937"/>
    <rect x="0" y="210" width="150" height="40" fill="#111827"/>
    <rect x="0" y="250" width="150" height="40" fill="#1f2937"/>
    <rect x="0" y="290" width="150" height="40" fill="#111827"/>
    <rect x="0" y="330" width="150" height="40" fill="#1e40af"/>
    <rect x="1" y="371" width="148" height="38" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="6 4"/>
    <g stroke="#6b7280" stroke-width="1">
      <line x1="0" y1="130" x2="150" y2="130"/>
      <line x1="0" y1="170" x2="150" y2="170"/>
      <line x1="0" y1="210" x2="150" y2="210"/>
      <line x1="0" y1="250" x2="150" y2="250"/>
      <line x1="0" y1="290" x2="150" y2="290"/>
      <line x1="0" y1="330" x2="150" y2="330"/>
    </g>
    <rect x="-5" y="144" width="160" height="200" fill="none" stroke="#f97316" stroke-width="3.5"/>
    <text stroke="#1f2937" stroke-width="6" stroke-linejoin="round" paint-order="stroke" x="10" y="115" fill="#e5e7eb">line 8</text>
    <text stroke="#111827" stroke-width="6" stroke-linejoin="round" paint-order="stroke" x="10" y="155" fill="#e5e7eb">line 9</text>
    <text stroke="#1f2937" stroke-width="6" stroke-linejoin="round" paint-order="stroke" x="10" y="195" fill="#e5e7eb">line 10</text>
    <text stroke="#111827" stroke-width="6" stroke-linejoin="round" paint-order="stroke" x="10" y="235" fill="#e5e7eb">line 11</text>
    <text stroke="#1f2937" stroke-width="6" stroke-linejoin="round" paint-order="stroke" x="10" y="275" fill="#e5e7eb">line 12</text>
    <text stroke="#111827" stroke-width="6" stroke-linejoin="round" paint-order="stroke" x="10" y="315" fill="#e5e7eb">line 13</text>
    <text stroke="#1e40af" stroke-width="6" stroke-linejoin="round" paint-order="stroke" x="10" y="355" fill="#e5e7eb">line 14</text>
    <text x="10" y="395" fill="#374151" font-size="13">next line's slot</text>
    <text x="0" y="440" fill="#111827">SRC_Y = 27</text>
  </g>

  <!-- frame 2, 33.3 ms: the window starts at SRC_Y 33 -->
  <g transform="translate(460,0)">
    <text x="0" y="36" fill="#111827" font-weight="bold">frame 2, 33.3 ms</text>
    <text x="0" y="58" fill="#374151" font-size="13">lag 6.7 px</text>
    <rect x="0" y="90" width="150" height="40" fill="#1f2937"/>
    <rect x="0" y="130" width="150" height="40" fill="#111827"/>
    <rect x="0" y="170" width="150" height="40" fill="#1f2937"/>
    <rect x="0" y="210" width="150" height="40" fill="#111827"/>
    <rect x="0" y="250" width="150" height="40" fill="#1f2937"/>
    <rect x="0" y="290" width="150" height="40" fill="#111827"/>
    <rect x="0" y="330" width="150" height="40" fill="#1e40af"/>
    <rect x="1" y="371" width="148" height="38" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="6 4"/>
    <g stroke="#6b7280" stroke-width="1">
      <line x1="0" y1="130" x2="150" y2="130"/>
      <line x1="0" y1="170" x2="150" y2="170"/>
      <line x1="0" y1="210" x2="150" y2="210"/>
      <line x1="0" y1="250" x2="150" y2="250"/>
      <line x1="0" y1="290" x2="150" y2="290"/>
      <line x1="0" y1="330" x2="150" y2="330"/>
    </g>
    <rect x="-5" y="156" width="160" height="200" fill="none" stroke="#f97316" stroke-width="3.5"/>
    <text stroke="#1f2937" stroke-width="6" stroke-linejoin="round" paint-order="stroke" x="10" y="115" fill="#e5e7eb">line 8</text>
    <text stroke="#111827" stroke-width="6" stroke-linejoin="round" paint-order="stroke" x="10" y="155" fill="#e5e7eb">line 9</text>
    <text stroke="#1f2937" stroke-width="6" stroke-linejoin="round" paint-order="stroke" x="10" y="195" fill="#e5e7eb">line 10</text>
    <text stroke="#111827" stroke-width="6" stroke-linejoin="round" paint-order="stroke" x="10" y="235" fill="#e5e7eb">line 11</text>
    <text stroke="#1f2937" stroke-width="6" stroke-linejoin="round" paint-order="stroke" x="10" y="275" fill="#e5e7eb">line 12</text>
    <text stroke="#111827" stroke-width="6" stroke-linejoin="round" paint-order="stroke" x="10" y="315" fill="#e5e7eb">line 13</text>
    <text stroke="#1e40af" stroke-width="6" stroke-linejoin="round" paint-order="stroke" x="10" y="355" fill="#e5e7eb">line 14</text>
    <text x="10" y="395" fill="#374151" font-size="13">next line's slot</text>
    <text x="0" y="440" fill="#111827">SRC_Y = 33</text>
  </g>

  <!-- frame 3, 50 ms: the window starts at SRC_Y 40 -->
  <g transform="translate(670,0)">
    <text x="0" y="36" fill="#111827" font-weight="bold">frame 3, 50 ms</text>
    <text x="0" y="58" fill="#374151" font-size="13">lag 0, at rest</text>
    <rect x="0" y="90" width="150" height="40" fill="#1f2937"/>
    <rect x="0" y="130" width="150" height="40" fill="#111827"/>
    <rect x="0" y="170" width="150" height="40" fill="#1f2937"/>
    <rect x="0" y="210" width="150" height="40" fill="#111827"/>
    <rect x="0" y="250" width="150" height="40" fill="#1f2937"/>
    <rect x="0" y="290" width="150" height="40" fill="#111827"/>
    <rect x="0" y="330" width="150" height="40" fill="#1e40af"/>
    <rect x="1" y="371" width="148" height="38" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="6 4"/>
    <g stroke="#6b7280" stroke-width="1">
      <line x1="0" y1="130" x2="150" y2="130"/>
      <line x1="0" y1="170" x2="150" y2="170"/>
      <line x1="0" y1="210" x2="150" y2="210"/>
      <line x1="0" y1="250" x2="150" y2="250"/>
      <line x1="0" y1="290" x2="150" y2="290"/>
      <line x1="0" y1="330" x2="150" y2="330"/>
    </g>
    <rect x="-5" y="170" width="160" height="200" fill="none" stroke="#f97316" stroke-width="3.5"/>
    <text stroke="#1f2937" stroke-width="6" stroke-linejoin="round" paint-order="stroke" x="10" y="115" fill="#e5e7eb">line 8</text>
    <text stroke="#111827" stroke-width="6" stroke-linejoin="round" paint-order="stroke" x="10" y="155" fill="#e5e7eb">line 9</text>
    <text stroke="#1f2937" stroke-width="6" stroke-linejoin="round" paint-order="stroke" x="10" y="195" fill="#e5e7eb">line 10</text>
    <text stroke="#111827" stroke-width="6" stroke-linejoin="round" paint-order="stroke" x="10" y="235" fill="#e5e7eb">line 11</text>
    <text stroke="#1f2937" stroke-width="6" stroke-linejoin="round" paint-order="stroke" x="10" y="275" fill="#e5e7eb">line 12</text>
    <text stroke="#111827" stroke-width="6" stroke-linejoin="round" paint-order="stroke" x="10" y="315" fill="#e5e7eb">line 13</text>
    <text stroke="#1e40af" stroke-width="6" stroke-linejoin="round" paint-order="stroke" x="10" y="355" fill="#e5e7eb">line 14</text>
    <text x="10" y="395" fill="#374151" font-size="13">next line's slot</text>
    <text x="0" y="440" fill="#111827">SRC_Y = 40</text>
  </g>

  <!-- the step table: rule 1 of D3, s = max(d·t/c, v·t), at most d -->
  <text x="40" y="470" fill="#111827" font-weight="bold">Each step, by rule 1: s = max(d·t/c, v·t), at most the lag d</text>
  <text x="40" y="492" fill="#374151" font-size="13">60 Hz, so t = 16.7 ms; rows 20 px high; catch-up time c = 80 ms; minimum speed v = 20 rows a second</text>
  <g fill="#111827">
    <text x="40" y="528" font-weight="bold">frame</text>
    <text x="110" y="528" font-weight="bold">time</text>
    <text x="210" y="528" font-weight="bold">lag d</text>
    <text x="320" y="528" font-weight="bold">d·t/c</text>
    <text x="420" y="528" font-weight="bold">v·t</text>
    <text x="510" y="528" font-weight="bold">step s</text>
    <text x="610" y="528" font-weight="bold">lag after</text>
    <text x="720" y="528" font-weight="bold">SRC_Y</text>
    <text x="40" y="558">1</text>
    <text x="110" y="558">16.7 ms</text>
    <text x="210" y="558">20 px</text>
    <text x="320" y="558">4.2 px</text>
    <text x="420" y="558">6.7 px</text>
    <text x="510" y="558">6.7 px</text>
    <text x="610" y="558">13.3 px</text>
    <text x="720" y="558">27</text>
    <text x="40" y="588">2</text>
    <text x="110" y="588">33.3 ms</text>
    <text x="210" y="588">13.3 px</text>
    <text x="320" y="588">2.8 px</text>
    <text x="420" y="588">6.7 px</text>
    <text x="510" y="588">6.7 px</text>
    <text x="610" y="588">6.7 px</text>
    <text x="720" y="588">33</text>
    <text x="40" y="618">3</text>
    <text x="110" y="618">50 ms</text>
    <text x="210" y="618">6.7 px</text>
    <text x="320" y="618">1.4 px</text>
    <text x="420" y="618">6.7 px</text>
    <text x="510" y="618">6.7 px</text>
    <text x="610" y="618">0</text>
    <text x="720" y="618">40</text>
  </g>
  <g stroke="#6b7280" stroke-width="1">
    <line x1="36" y1="537" x2="820" y2="537"/>
  </g>

  <!-- legend -->
  <rect x="40" y="639" width="30" height="18" fill="none" stroke="#f97316" stroke-width="3"/>
  <text x="80" y="653" fill="#111827">the window the display shows, five rows high</text>
  <rect x="470" y="639" width="30" height="18" fill="#1e40af"/>
  <text x="510" y="653" fill="#111827">drawn once, when the line arrives</text>
  <text x="40" y="683" fill="#374151" font-size="13">SRC_Y counts pixel lines from the top of line 8's slot. A display turned on its side moves SRC_X.</text>
  <text x="40" y="703" fill="#374151" font-size="13">The window starts on a whole pixel line, so SRC_Y rounds the lag that is left.</text>
</svg>
